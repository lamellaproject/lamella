[workspace]
resolver = "3"
members = ["crates/*"]

# Shared package metadata. Member crates inherit these with `field.workspace = true`
# so versioning and licensing stay in one place.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["The Lamella project"]
description = "A from-scratch C# toolchain: compiler, runtime, and base class library."

# Lints applied to every member that opts in with `[lints] workspace = true`.
# Warnings stay warnings so the build does not break, but nothing is silently
# undocumented and unsafe code is called out. The compiler libraries forbid
# unsafe outright in their own source; device crates that genuinely need it can
# relax this locally.
[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# The device-image profile the size gate links with: smallest-code settings, panics abort
# (the bare-metal shim provides the handler; no unwinder ships).
#
# SYMBOLS ARE KEPT ON PURPOSE. A device that stops responding is diagnosed by matching program
# counters recovered over the debug port to function names, and that cannot be done after the fact:
# flipping this setting CHANGES THE EMITTED IMAGE, so a rebuild with symbols is a different build
# from the one on the chip. The symbol table has to be in the artifact that was flashed. Measured
# cost of keeping it: 32 bytes on a 315 KB image, 0.01%. The names themselves do not reach the
# device -- a symbol table is not a loadable section, so nothing here enlarges what is programmed
# into flash.
[profile.flash]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "none"

# The profile for host-side batch runs of the compiler over a whole corpus, where an unoptimized
# build is the difference between a run you can repeat and one you cannot: measured at 109 s per
# file unoptimized against 4.07 s here.
#
# Debug assertions and overflow checks stay ON deliberately. An arithmetic overflow that panics in
# one build and wraps in another is a different compiler, so a batch run that quietly traded the
# checks away for speed would be measuring something other than what it reports.
[profile.gate]
inherits = "release"
debug-assertions = true
overflow-checks = true
