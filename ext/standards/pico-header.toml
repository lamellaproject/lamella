# Positions 31, 32 and 34 are the header's three analog inputs. Which converter channel each reaches,
# and through which pad, is the board's fact -- see this file's header.

[[pins]]
number = 31
signal = "gp26"
aka = "gp26_a0"
routable = true
description = "General-purpose I/O, labeled GP26, and the header's first analog input."

[[pins]]
number = 32
signal = "gp27"
aka = "gp27_a1"
routable = true
description = "General-purpose I/O, labeled GP27, and the header's second analog input."

[[pins]]
number = 33
signal = "agnd"
routable = false
description = "Analog ground: the ground reference the analog positions are routed against, and a ground position like any other where the converter is not used."

[[pins]]
number = 34
signal = "gp28"
aka = "gp28_a2"
routable = true
description = "General-purpose I/O, labeled GP28, and the header's third analog input."

[[pins]]
number = 35
signal = "adc_vref"
routable = false
description = "The analog-to-digital converter's supply and reference voltage, filtered from the board's 3.3 V supply; an external reference may be fitted here for better converter performance."

[[pins]]
number = 36
signal = "3v3"
aka = "3v3(out)"
routable = false
description = "The board's regulated 3.3 V supply, which also powers the chip and its I/O. It can power external circuitry."

[[pins]]
number = 37
signal = "3v3_en"
routable = false
description = "The enable input of the board's 3.3 V regulator, pulled high: shorting it low turns the 3.3 V supply off, and the chip with it."

[[pins]]
number = 38
signal = "gnd38"
routable = false
description = "Ground."

[[pins]]
number = 39
signal = "vsys"
routable = false
description = "The main system input voltage, which the board's regulator makes 3.3 V from."

[[pins]]
number = 40
signal = "vbus"
routable = false
description = "The board's USB input voltage, nominally 5 V, or 0 V when no powered USB is connected."
