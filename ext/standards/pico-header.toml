# The Raspberry Pi Pico HEADER: the forty positions along the two long edges of a Pico-shaped board,
# twenty a side on a 0.1 inch grid, as through-holes with castellations. This file is the JOIN
# VOCABULARY between a board that carries the header and an extension that plugs onto it, the way
# xplained-pro.toml is for that connector.
#
# THE POSITIONS ARE NAMED BY THE PICO'S OWN LABELS, IN LOWER CASE. `gp0` is the position the Pico
# prints GP0, and a board states which pad of ITS chip sits behind it. On the Raspberry Pi Pico
# boards and on Pimoroni's Pico Plus 2 boards that pad is the GPIO of the same number, so their rows
# read as the identity -- and each is still stated per board, because the header is a shape other
# makers copy, and nothing obliges a copy to wire position GP0 to its chip's GPIO0.
#
# ONE POSITION CAN REACH TWO PADS, AND THAT IS A BOARD FACT RATHER THAN ONE OF THIS FILE'S. The
# Pimoroni Pico Plus 2 boards carry an RP2350B, whose analog inputs are GPIO40 to GPIO47, so each of
# the three analog positions lands on its low-numbered GPIO directly and on an ADC pad through 1k.
# The position is the same position; which pad digitizes it is stated by the board, next to its
# converter.
#
# ONLY THE TWENTY-SIX GPIO POSITIONS ARE ROUTABLE. RUN is the chip's enable input and ADC_VREF its
# converter's supply and reference; neither is a GPIO, and no binding reaches either. The power and
# ground positions reach no pad at all. They are all stated so the table is the connector's rather
# than a subset chosen by what happens to be bindable.

[table]
kind = "header-standard"
standard = "pico-header"
sources = [
    "Raspberry Pi Pico 2 Datasheet (build d4e0f1799616), section 3.1 and Figure 2 (The pinout of the Raspberry Pi Pico 2 board): every position's label against its pin number -- GP0 and GP1 on 1 and 2, GND on 3, GP2 to GP5 on 4 to 7, GND on 8, GP6 to GP9 on 9 to 12, GND on 13, GP10 to GP13 on 14 to 17, GND on 18, GP14 and GP15 on 19 and 20, GP16 and GP17 on 21 and 22, GND on 23, GP18 to GP21 on 24 to 27, GND on 28, GP22 on 29, RUN on 30, GP26 and GP27 on 31 and 32, AGND on 33, GP28 on 34, ADC_VREF on 35, 3V3(OUT) on 36, 3V3_EN on 37, GND on 38, VSYS on 39 and VBUS on 40.",
    "The same section's list of the seven positions that are neither GPIO nor ground -- PIN40 VBUS, PIN39 VSYS, PIN37 3V3_EN, PIN36 3V3, PIN35 ADC_VREF, PIN33 AGND and PIN30 RUN -- and what each is for, which the descriptions below restate.",
    "Raspberry Pi Pico Datasheet (build d4e0f1799616) section 2.1, Raspberry Pi Pico W Datasheet (build eec2b0c) section 2.1 and Raspberry Pi Pico 2 W Datasheet (build 63766c4) section 2.1: the same seven positions at the same numbers, and a Figure 2 pinout carrying the same forty labels in the same places. Four boards on two chips share it, which is what makes it a standard rather than one board's connector.",
    "Pimoroni Pico Plus 2 and Pico Plus 2 W pinout diagrams: the same forty positions in the same order, labeled by GPIO number alone -- 0 to 22, then 26 / A0, 27 / A1 and 28 / A2 -- with 3V3 EN and ADC VREF for 3V3_EN and ADC_VREF, and with GND on the position the Pico labels AGND.",
    "Raspberry Pi Pico 2 Datasheet Figure 1 (both sides of the board): the underside silkscreen spells the three analog positions GP26_A0, GP27_A1 and GP28_A2, which is the spelling each row's `aka` records.",
]
notes = [
    "A power budget is a real constraint this connector carries and no row here expresses it: the Pico 2 datasheet recommends keeping the load on 3V3 below 300 mA, and an extension that powers itself from 3V3 is inside that budget while one that takes VSYS or VBUS is not. Nothing joins an extension's draw to a board's regulator yet, and a file that implied it did would be worse than one that does not.",
    "The eight ground positions are named by pin number, because a row is keyed by signal and two rows may not share one. Position 33 keeps the Pico's own name, AGND: it is the ground reference the analog positions are routed against, and the Pico datasheet says it may be tied to digital ground where the converter is not used, which is what a board that labels it GND has done.",
]

