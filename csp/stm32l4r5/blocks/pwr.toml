# BLOCK layout: the STM32L4R5 power controller. Only the field a board's bring-up writes is laid
# out: the one that validates the VDDIO2 rail. The rest of the block grows with its consumers.
[table]
kind = "block"
family = "stm32l4r5"
block = "pwr"
# Rust only: a board's bring-up takes the rail's prerequisite from its own bindings, as absolute
# addresses, so no managed program reads this layout.
emit = ["rust"]
sources = ["RM0432 Rev 9 section 5.1.2 (independent I/O supply rail) and section 5.4.2 (PWR_CR2)"]
notes = [
    "PG[15:2] are supplied through VDDIO2 and are logically and electrically isolated after reset; setting PWR_CR2.IOSV is mandatory to use them (5.1.2, 5.4.2).",
    "The PWR registers answer only with PWREN set in RCC_APB1ENR1, which the pwr instance row states as its clock gate.",
    "Where VDDIO2 is not always present, PVM2 can confirm it before IOSV is set (5.1.2). A board that ties VDDIO2 to VDD needs no such check.",
]

[registers.CR2]
offset = 0x04
width = 32
fields = { IOSV = [9, 1] }
notes = "Resets to 0, and is reset again on exit from Standby, so a board that wakes from Standby sets IOSV again."
