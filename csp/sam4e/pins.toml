# PIN map for the SAM4E family: pin x function -> (instance, signal), or -> nothing. It lists only
# the cells a binding uses, and a row naming a pin outside every part's `pins` list is refused.
#
# IT HAS NO ROWS. The only pins this family's boards place are an LED and a user button, and a
# control pin rides no alternate function -- it is driven as a plain output or read as a plain
# input -- so neither needs a cell here.
#
# THIS PART HAS SIGNALS ITS SIBLING SERIES HAVE NO PINS FOR AT ALL: an Ethernet MAC and two CAN
# controllers, which neither the SAM4S nor the SAM4N has.

[table]
kind = "pins"
family = "sam4e"
sources = [
    "SAM4E Series datasheet (Atmel-11157): the I/O line peripheral multiplexing tables, for rows when a binding needs them",
]
