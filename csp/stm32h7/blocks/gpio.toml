# BLOCK layout: the STM32H7 GPIO port block -- the registers a uart binding muxes through and a
# control line drives. PARTIAL: MODER/AFRH fields are stated for the pins the boards claim and
# grow as more do. Offsets are instance-base-relative; port instance bases live in
# ../instances.toml.
#
# A pin's alternate function is selected in TWO registers, which is the thing to get right: MODER
# puts the pin in alternate-function MODE (2 bits per pin), and an AFR register selects WHICH
# function (4 bits per pin). Setting one without the other leaves the pin either driving nothing or
# driving the wrong peripheral.

[table]
kind = "block"
family = "stm32h7"
block = "gpio"
sources = [
    "STM32H745/755 and STM32H747/757 reference manual RM0399 Rev 4: GPIOx_MODER 12.4.1 (address offset 0x00), GPIOx_OTYPER 12.4.2 (0x04), GPIOx_OSPEEDR 12.4.3 (0x08), GPIOx_PUPDR 12.4.4 (0x0C), GPIOx_IDR 12.4.5 (0x10), GPIOx_ODR 12.4.6 (0x14), GPIOx_BSRR 12.4.7 (0x18), GPIOx_LCKR 12.4.8 (0x1C), GPIOx_AFRL 12.4.9 (0x20), GPIOx_AFRH 12.4.10 (0x24)",
    "STM32H745/755 and STM32H747/757 reference manual RM0399 Rev 4, GPIOx_MODER bit description: 00 input mode, 01 general purpose output mode, 10 alternate function mode, 11 analog mode (reset state); reset value 0xABFF FFFF for port A, 0xFFFF FEBF for port B, 0xFFFF FFFF for other ports",
]
notes = [
    "GPIO config is read-modify-write: MODER holds 2 bits per pin and an AFR nibble 4, so a pin's field span is cleared before the set value is OR-ed in.",
    "WHICH AFR register a pin uses is decided by the pin number, not by the function: AFRL covers pins 0..7 and AFRH covers pins 8..15, each with 4 bits per pin counted from its own base. So pin 9's nibble is at bit 4 of AFRH, not at bit 36 of anything. Both pins this family muxes are in the high half, so nothing here exercises AFRL -- which is worth knowing before the first row that does.",
    "The alternate-function MODE value is 10 binary (2), the same on every port and pin.",
    "OTYPER is the one register here with ONE bit per pin rather than two, so its shift is the pin index itself and not twice it. A rule applied uniformly across these registers is wrong for exactly this one.",
    "BSRR's low half SETS a pin and its high half CLEARS one, so either can be done with a single write and no read-modify-write. The two halves are 16 bits apart and a mask written to the wrong one drives the pin the wrong way rather than failing.",
    "AFRL is stated for ports A to K and AFRH only for ports A to J, which is the manual's own scope line on each section rather than an inference from the port count.",
    "The per-pin field rows below are PARTIAL and deliberately stay that way. A pin's span follows from its index by rule -- 2 bits at [2n], a nibble at [4n] within its own AFR half, one bit at [n] -- and that rule is what composes a binding's words at generation time, so a row per pin would be a second statement of the same arithmetic rather than a new fact.",
]

[registers.MODER]
offset = 0x0
width = 32
fields = { MODER0 = [0, 2], MODER1 = [2, 2], MODER8 = [16, 2], MODER9 = [18, 2], MODER14 = [28, 2] }
notes = "Port mode, 2 bits per pin at [2n, 2] (PARTIAL: pins 0, 1, 8, 9 and 14 stated). 00 = input, 01 = general purpose output, 10 = alternate function, 11 = analog -- and 11 is the RESET state on this part, so a pin nobody configures has its input buffer off."

[registers.OTYPER]
offset = 0x4
width = 32
fields = { }
notes = "Output type, ONE bit per pin at [n]: 0 = push-pull (reset), 1 = open drain."

[registers.OSPEEDR]
offset = 0x8
width = 32
fields = { }
notes = "Output speed, 2 bits per pin at [2n]: 00 low, 01 medium, 10 high, 11 very high. Reset is 0 for every port but A and B, whose debug pins come up faster. A slew-rate setting, not a clock -- it does not make a bus faster, it stops a fast bus from being smeared."

[registers.PUPDR]
offset = 0xC
width = 32
fields = { }
notes = "Pull-up/pull-down, 2 bits per pin at [2n]: 00 none, 01 pull-up, 10 pull-down. Reset is 0 for every port but A and B. Whether an external pull is present is a board fact, never this table's."

[registers.IDR]
offset = 0x10
width = 32
fields = { }
notes = "Input data, ONE bit per pin at [n], read-only. What a button row is read through -- and on this part it reads zero until MODER takes the pin out of analog mode."

[registers.ODR]
offset = 0x14
width = 32
fields = { }
notes = "Output data, ONE bit per pin at [n]. Read-modify-write; BSRR is the single-write alternative."

[registers.BSRR]
offset = 0x18
width = 32
fields = { }
notes = "Bit set/reset, write-only: bit [n] SETS pin n and bit [n+16] CLEARS it."

[registers.LCKR]
offset = 0x1C
width = 32
fields = { }
notes = "Configuration lock. Freezes a pin's control and alternate-function registers until the next reset, through a write sequence rather than a plain write."

[registers.AFRL]
offset = 0x20
width = 32
fields = { }
notes = "Alternate function for pins 0..7, 4 bits per pin at [4n, 4]. No pin this family muxes falls in this half yet."

[registers.AFRH]
offset = 0x24
width = 32
fields = { AFSEL8 = [0, 4], AFSEL9 = [4, 4] }
notes = "Alternate function for pins 8..15, 4 bits per pin at [4*(n-8), 4] (PARTIAL: pins 8 and 9 stated). The nibble's value IS the AF number: 0111 selects AF7."

[constants]
MODER_MODE_OUTPUT = 1
MODER_MODE_AF = 2
MODER_MODE_ANALOG = 3
OTYPER_OPEN_DRAIN = 1
OSPEEDR_VERY_HIGH = 3
PUPDR_PULL_UP = 1
