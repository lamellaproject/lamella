# INSTANCE map: where each STM32H7 block copy sits, plus its RCC clock-enable routing.
# The record carries the enable REGISTER OFFSET as data because ST spreads the gates across banked
# enable registers, so [base, rcc_en_off, rcc_en_bit] states each gate in full. `-1` = the row
# gates nothing (the RCC itself).
#
# THE BASES ARE NOT THE OTHER ST FAMILIES' BASES AND THE DIFFERENCE IS A WHOLE 384 MEGABYTES.
# This part puts its GPIO ports and its RCC at 0x58020000 and above, in the D3 domain on AHB4,
# where the vendor's F0, F4, F7 and L4 lines put them at 0x40020000 and 0x40023800. The USART, by
# contrast, is where those lines would put it: USART3 sits at 0x40004800 on APB1. So a family that
# copied "the ST layout" would place the serial port correctly and every GPIO write
# into a reserved region -- and RM0399's own footnote to that table says accessing a reserved area
# results in a bus error, which at least fails loudly rather than silently.
#
# THE ENABLE REGISTER HAS THREE ALIASES ON THIS PART AND THE SHARED ONE IS THE RIGHT ONE. Each
# RCC enable register appears three times: RCC_AHB4ENR at offset 0x0E0, RCC_C1_AHB4ENR at 0x140
# and RCC_C2_AHB4ENR at 0x1A0, and the same pattern holds for RCC_APB1LENR at 0x0E8/0x148/0x1A8.
# The C1 and C2 forms let ONE core allocate a peripheral to the OTHER; the shared form allocates
# to whichever core wrote it, because RM0399 says the hardware detects which CPU did the access in
# order to allocate the peripheral to the right CPU. The offsets below are the shared ones, and
# that is what makes them target-independent: the same emitted constant is correct whether the
# image runs on the Cortex-M7 or on the Cortex-M4. Nothing about the multi-core split reaches this
# table, and that is a finding rather than an omission.

[table]
kind = "instances"
family = "stm32h7"
record = ["base", "rcc_en_off", "rcc_en_bit"]
sources = [
    "STM32H745/755 and STM32H747/757 reference manual RM0399 Rev 4: Table 7 register boundary addresses -- RCC 0x58024400 and GPIOA through GPIOK from 0x58020000 in 0x400 steps on AHB4 (D3), with GPIOK occupying 0x58022800-0x58022BFF, USART3 0x40004800 on APB1 (D2)",
    "STM32H745/755 and STM32H747/757 reference manual RM0399 Rev 4: RCC_AHB4ENR 9.7.42 (address offset 0x0E0), whose per-bit prose gives GPIOAEN through GPIOKEN at bits 0 to 10 in alphabetical order -- GPIOAEN 0, GPIOBEN 1, GPIOCEN 2, GPIODEN 3, GPIOEEN 4, GPIOFEN 5, GPIOGEN 6, GPIOHEN 7, GPIOIEN 8, GPIOJEN 9, GPIOKEN 10; RCC_APB1LENR 9.7.44 (address offset 0x0E8, USART3EN bit 18)",
]
notes = [
    "Every bit position here is taken from the reference manual's per-bit descriptions rather than from its register bit-map diagram: the diagram is a wide table whose columns do not survive a text conversion, and the per-bit prose states the same fact unambiguously.",
    "The GPIO ports sit in the D3 power domain and the USART in D2, which is a fact with a consequence nothing here models yet: RM0399 warns that enabling a peripheral in a domain that is in DStop or DStandby makes the power controller raise that domain first, so the clock-enable write can take far longer than the two clock cycles it takes within a running domain.",
    "ALL ELEVEN GPIO PORTS ARE PLACED, AND THAT IS A DEPARTURE FROM THE EVIDENCE-ONLY RULE THE REST OF THIS FILE FOLLOWS. Seven were here because a board reached them; GPIOA, GPIOF, GPIOG and GPIOH joined when this family gained a GPIO DRIVER, which is a different kind of consumer from a binding. A driver presents `PinCount` and answers for every pin in it, so a map with holes would give a caller a pin number whose port has no base -- and the hole would be wherever nothing had been bound yet, which is the least predictable place for one. The USART row stays evidence-only: nothing presents a count over USARTs.",
    "Every base below was read off RM0399 Table 7 rather than stepped from GPIOA, and the table repays that: it prints its rows in DESCENDING address order, GPIOK first and GPIOA last, so an eye running down the page and an index counting up the alphabet move in opposite directions. The arithmetic happens to agree here -- 0x400 per port with no gap -- and a boundary table exists to be read, not to be predicted.",
]

[[instances]]
name = "usart3"
block = "usart"
base = 0x40004800
rcc_en_off = 0xE8   # RCC_APB1LENR (the shared form; C1 is 0x148 and C2 0x1A8)
rcc_en_bit = 18     # USART3EN

[[instances]]
name = "gpioa"
block = "gpio"
base = 0x58020000
rcc_en_off = 0xE0   # RCC_AHB4ENR (the shared form; C1 is 0x140 and C2 0x1A0)
rcc_en_bit = 0      # GPIOAEN

[[instances]]
name = "gpiob"
block = "gpio"
base = 0x58020400
rcc_en_off = 0xE0   # RCC_AHB4ENR (the shared form; C1 is 0x140 and C2 0x1A0)
rcc_en_bit = 1      # GPIOBEN

[[instances]]
name = "gpioc"
block = "gpio"
base = 0x58020800
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 2      # GPIOCEN

[[instances]]
name = "gpiod"
block = "gpio"
base = 0x58020C00
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 3      # GPIODEN

[[instances]]
name = "gpioe"
block = "gpio"
base = 0x58021000
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 4      # GPIOEEN

# PORTS I AND J EXIST ONLY ON THE LARGER PACKAGES, AND THEIR ENABLE BITS ARE WHERE THE ALPHABET
# STOPS BEING A GUIDE. GPIOIEN and GPIOJEN sit at bits 8 and 9 of RCC_AHB4ENR, which does continue
# the run A=0 through K=10 -- but the letters skip no position only because this register carries
# nothing else below bit 11, and the same vendor's other lines put a port's enable bit in a
# register whose low bits are already spent. Both were read from RM0399's per-bit descriptions.

[[instances]]
name = "gpiof"
block = "gpio"
base = 0x58021400
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 5      # GPIOFEN

[[instances]]
name = "gpiog"
block = "gpio"
base = 0x58021800
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 6      # GPIOGEN

[[instances]]
name = "gpioh"
block = "gpio"
base = 0x58021C00
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 7      # GPIOHEN

[[instances]]
name = "gpioi"
block = "gpio"
base = 0x58022000
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 8      # GPIOIEN

[[instances]]
name = "gpioj"
block = "gpio"
base = 0x58022400
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 9      # GPIOJEN

[[instances]]
name = "gpiok"
block = "gpio"
base = 0x58022800
rcc_en_off = 0xE0   # RCC_AHB4ENR
rcc_en_bit = 10     # GPIOKEN

[[instances]]
name = "rcc"
block = "rcc"
base = 0x58024400
rcc_en_off = -1
rcc_en_bit = -1
