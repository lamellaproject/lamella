# PIN map for the SAM E54 family: pin x function -> (instance, signal). PARTIAL and append-only:
# rows exist for every binding a board package uses, each with its source. Grow the table with the
# boards, never from recall. A binding whose (pin, function) row is missing REFUSES.

[table]
kind = "pins"
family = "same54"
sources = [
    "SAM D5x/E5x Family Data Sheet DS60001507F Table 6-1 (Multiplexed Peripheral Signals), whose column letters A to N are the function selection and whose cells name the instance and signal each reaches",
    "DS60001507F Table 6-8 (SERCOM I2C Pinout), which lists the pads with I2C support per package -- used as corroboration for the I2C rows below, never as their source",
    "SAM E54 Xplained Pro user guide DS70005321A Table 5-1, which names the peripheral behind each extension-header position -- used as corroboration for the rows below, never as their source",
]

# THE FUNCTION LETTER IS A COLUMN OF Table 6-1 AND THE COLUMNS ARE NOT INTERCHANGEABLE. Column C
# and column D both carry a SERCOM for these two pads, and the PAD NUMBERS SWAP BETWEEN THEM: on
# column C the lower-numbered pin is pad 0, and on column D it is pad 1. So a row moved from one
# column to the other does not merely select a different SERCOM -- it exchanges the two signals of
# whatever bus is on it, which for I2C means exchanging data and clock. Both alternatives are
# recorded here for that reason, and only the column C rows have a consumer.

[[pins]]
pin = "PA22"
function = "C"
instance = "sercom3"
signal = "pad0"
source = "DS60001507F Table 6-1 (Multiplexed Peripheral Signals), the PA22 row: column C is SERCOM3/PAD[0]. Table 6-8 (SERCOM I2C Pinout) independently lists PA22 among the pads with I2C support on the 128-pin package."

[[pins]]
pin = "PA23"
function = "C"
instance = "sercom3"
signal = "pad1"
source = "DS60001507F Table 6-1, the PA23 row: column C is SERCOM3/PAD[1]. Table 6-8 independently lists PA23 among the pads with I2C support on the 128-pin package."

[[pins]]
pin = "PA22"
function = "D"
instance = "sercom5"
signal = "pad1"
source = "DS60001507F Table 6-1, the PA22 row: column D is SERCOM5/PAD[1]. NOTE THE PAD NUMBER against the column C row above -- the same pad is pad 0 of one SERCOM and pad 1 of another."

[[pins]]
pin = "PA23"
function = "D"
instance = "sercom5"
signal = "pad0"
source = "DS60001507F Table 6-1, the PA23 row: column D is SERCOM5/PAD[0]. The pad numbers of PA22 and PA23 are reversed between columns C and D, so the pair is ordered one way on SERCOM3 and the other way on SERCOM5."

# THE ANALOG FUNCTION IS COLUMN B, AND IT IS ONE COLUMN COVERING SIX PERIPHERALS. Table 6-1 puts
# ANAREF, ADC0, ADC1, AC, DAC and PTC all under the single function letter B, so selecting B on a
# pad does not say WHICH analog peripheral reaches it -- the cell does, and that is what this row
# records. The channel number is part of the signal name for the same reason: a converter reaches a
# pad on one numbered input, and the number is a property of the pairing rather than of either.

[[pins]]
pin = "PB04"
function = "B"
instance = "adc1"
signal = "ain6"
source = "DS60001507F Table 6-1 (Multiplexed Peripheral Signals), the PB04 row: the function B cell is ADC1/AIN[6]."

# ---- SERCOM5 IOSET 1: the pads the SAM E51 Curiosity Nano wires its debugger UART to -------------
#
# THE SAME INSTANCE THIS TABLE ALREADY REACHES BY ANOTHER ROUTE. SERCOM5 is already here on PA22 and
# PA23 in column D, which is Table 6-15's IOSET 2. These two rows are IOSET 1 of the same instance,
# in column C -- so the letter and the pad pair move together and a row that took one from each set
# would name a pin the instance does not drive.
#
# ONE NUMBER TELLS THE TWO SETS APART AND IT IS NOT THE PAD: the IOSET is which PINS carry the pads,
# and Table 6-15 lists six of them for SERCOM5. What a binding names is a pin and a function letter,
# so the IOSET is implied by the pins rather than stated -- which is why both rows below record
# which IOSET they came from.

[[pins]]
pin = "PB16"
function = "C"
instance = "sercom5"
signal = "pad0"
source = "DS60001507F Table 6-1 (I/O Multiplexing and Considerations): the PB16 row carries SERCOM5/PAD[0] in column C, the SERCOM column, and nothing in column D. Corroborated by Table 6-15 (SERCOM5 IO SET Configuration), whose IOSET 1 column gives PAD0 = PB16. The pad is bonded on the 64-pin package: the ch 4 pinout numbers it pin 39 on TQFP/VQFN/WLCSP 64, which is the package atsame51j20a comes in."

[[pins]]
pin = "PB17"
function = "C"
instance = "sercom5"
signal = "pad1"
source = "DS60001507F Table 6-1: the PB17 row carries SERCOM5/PAD[1] in column C and nothing in column D. Corroborated by Table 6-15, whose IOSET 1 column gives PAD1 = PB17. Bonded on the 64-pin package at pin 40, adjacent to PB16."

# --- EIC: the COMPLETE pad-to-EXTINT map for this die ------------------------------------------
#
# EVERY PAD ON THE DIE IS HERE. Which EXTINT a pad can raise is a property of the silicon, so it
# does not depend on any board and must not be limited to the pads some particular board wires. An
# engineer who prototypes on an evaluation kit and then lays out their own hardware needs every pad.
#
# FUNCTION A IS THE EIC COLUMN, so a pad raises its EXTINT only with PINCFG.PMUXEN set and PMUX
# selecting A.
#
# 99 PADS, 16 LINES, SO PADS SHARE AND ONLY ONE OF A LINE'S PADS CAN BE THE LIVE SOURCE. Six pads
# compete for most lines here against three or four on the smaller family, and nothing in the chip
# reports the competition.
#
# PA08 IS NMI AND NOT AN EXTINT, alone on this die as on the SAM D21 -- the one pad whose function A
# reaches the non-maskable interrupt, which cannot be masked, does not appear in INTFLAG, and is not
# serviced by any of the sixteen EXTINT vectors.
#
# THE LINE IS NOT THE PAD AND A DERIVATION IS WRONG ON TWELVE PADS. For 86 of the 98 EXTINT pads the
# line is the pad index modulo sixteen, which is more than enough to make the rule look right under
# any spot check. It fails on PB26, PB27, PB28 and PB29, which raise 12 through 15 rather than 10
# through 13; on PC07, which raises 9 rather than 7; on PD08 through PD12, which raise 3 through 7
# rather than 8 through 12; and on PD20 and PD21, which raise 10 and 11 rather than 4 and 5.
# The SAM D21 breaks the same rule on six of its own pads, in different places.
#
# Every row: DS60001507F Table 6-1 (Multiplexed Peripheral Signals), column A. ANCHORED FOUR WAYS:
# the 99 pads are exactly the atsame54p20a pad set in parts.toml, the 64-pin atsame51j20a's 51 pads
# are a subset of them, all sixteen lines occur, and exactly one pad carries NMI.

[[pins]]
pin = "PA00"
function = "A"
instance = "eic"
signal = "extint0"
source = "DS60001507F Table 6-1, column A (EIC)."

[[pins]]
pin = "PA01"
function = "A"
instance = "eic"
signal = "extint1"
source = "DS60001507F Table 6-1, column A (EIC)."

