# BLOCK: the STM32L0x1 flash controller, stated ONLY as far as one fact that consumers outside the
# controller need. The controller itself -- its unlock sequences, its page geometry, its command
# bits -- is not described here and is not this file's to describe.
#
# WHY THE ERASED VALUE IS A BLOCK FACT AND NOT A PART FACT. It is a property of the CONTROLLER, not
# of a die: every STM32L0 category erases to zero -- 1, 2, 3 and 5, L0x1 and L0x3 alike -- and it
# never varies by package, density or ordering code, which is what a parts row is for. Stated once
# per block, a part inherits it by naming its block; and if the family ever splits, that is a NEW
# block rather than a per-part override, so the split is visible rather than hidden in one row of
# six.
#
# AND IT IS REQUIRED RATHER THAN DEFAULTED. Most flash controllers erase to ones, so a default of
# `0xffffffff` would be silently wrong on exactly the families where the value matters. The reader
# refuses a flash block that omits it.
#
# THIS FAMILY ERASES TO ZERO, WHICH INVERTS THE USUAL BLANK CHECK. A correctly erased part reads as
# full and a full part reads as erased.
#

[table]
kind = "block"
family = "stm32l0"
block = "flash"
erased_value = 0x00000000
sources = [
    "STM32L0x1 reference manual RM0377 Rev 10 section 3.3.4 and the FLASH_SR description: NOTZEROERR is raised when a program targets a word whose content is not zero, and outside category 3 devices the write is not performed at all -- which only coheres if an erased word IS zero",
    "RM0377 Rev 10, the flash page-erase code example, which performs the erase by writing a zero word to an address inside the page",
    "A read of the part: an STM32L011 erased, programmed and verified over SWD, whose freshly erased array reads zero rather than ones",
]
notes = [
    "The 512 bytes of data EEPROM this family also carries are a separate array from the program flash. Nothing here states a value for them, and a consumer must not assume this one applies to that array.",
    "This block declares no registers. A block file is useful the moment it carries a fact a consumer needs, and the register map of this controller is read and owned elsewhere -- a partial transcription of it here would be a second spelling of somebody else's source.",
]
