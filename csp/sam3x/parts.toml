# The SAM3X parts table. Its `pins` lists are partial: each names the pins checked against the
# datasheet's pinout, not the whole package, so a consumer must not read one as the package. A pin
# that is not listed is refused rather than assumed.

[table]
kind = "parts"
family = "sam3x"
sources = [
    "SAM3X/A datasheet Atmel-11057C: Table 1-1 (configuration summary) + ch 4 (packages and pinout)",
]

[[parts]]
part = "atsam3x8e"
package = "144-pin"
flash = 0x80000
ram = 0x18000
pins = ["PA8-PA9"]
source = "Atmel-11057 Table 1-1: SAM3X8E = LQFP144, 512 KB flash (2 x 256 KB planes), 96 KB SRAM, 103 PIOs; CHIPID_CIDR 0x285E0A60 -- a partial pin list: PA8/PA9 are the UART pins"
