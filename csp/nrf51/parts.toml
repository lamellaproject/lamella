# PARTS table for the nRF51 family. The pin present-list is PARTIAL: this family is
# identity-first, and a pin joins it when a binding or a wired line is written against a read
# pinout.

[table]
kind = "parts"
family = "nrf51"

[[parts]]
part = "nrf51822"
package = "QFN"
flash = 0x40000
ram = 0x4000
dp_idcode = 0x0BB11477
identity_source = "The debug port a BBC micro:bit v1 answers with, read through a CMSIS-DAP probe; the nRF flashing backend refuses a deploy whose target part answers a different one, which is the difference between nothing happening and the wrong board being erased. 0x0bb11477 is Arm's generic Cortex-M0 SW-DP and an STM32F0 answers the same, so it narrows a search and names no part. The reading that names a Nordic die is FICR."
pins = ["P0.00", "P0.04-P0.15", "P0.21-P0.25", "P0.30"]
source = "nRF51822 PS v3.4 (256 KB flash / 16 KB RAM; GPIO is one port of up to 32 I/Os depending on package, section 3.7). The pin list is PARTIAL rather than the package's full set: P0.04-P0.15 are the display matrix, P0.00 + P0.30 are the two-wire bus (QFN pins 4 and 3), P0.21-P0.23 are the edge connector's SPI (QFN pins 40 to 42), and P0.24 + P0.25 are the serial link to the board's interface chip (QFN pins 43 and 44) -- each confirmed as general-purpose I/O on the QFN pin assignment table."
