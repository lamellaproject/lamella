# The SAMC21 PORT block: the pin-mux and pin-config machinery, one PORT group per port letter
# (the porta/portb/portc instance rows carry the group bases). PMUX and PINCFG are PER-PIN ARRAYS:
# the offsets below are the n = 0 element; element addresses derive as
#   PMUX[n]   = group_base + 0x30 + n        (n = pin / 2; even pin = PMUXE nibble, odd = PMUXO)
#   PINCFG[p] = group_base + 0x40 + p        (p = the pin index within the group)
# The generator owns those derivations; drivers receive resolved addresses through their bindings.
#
# THE REGISTER LAYOUT IS THE SAM D21 LINE'S AND THE BASE IS NOT. Every offset below matches the
# samd20, samda1, samha1 and samr21 blocks value for value -- but this family's PORT sits at
# 0x41000000 where theirs sit at 0x41004400, and the group bases follow from that. The layout
# agreeing is what makes the driver code the same shape; the base differing is why not one address
# may be carried across.
#
# THREE GROUPS ON THE DIE, AND THE COUNT COMES FROM THE PAD SET. This document bounds the group
# count nowhere, as its D20 and DA1 siblings do not; Table 6-1's 100-pin column reaches PC28, which
# is what puts a group 2 on this part. The 64-pin package bonds none of it -- see parts.toml.

[table]
kind = "block"
family = "samc21"
block = "port"
sources = [
    "SAM C20/C21 Family Data Sheet DS60001479M ch 28 (PORT) register descriptions, each stating its own offset: DIR 0x00, DIRCLR 0x04, DIRSET 0x08, DIRTGL 0x0C, OUT 0x10, OUTCLR 0x14, OUTSET 0x18, OUTTGL 0x1C, IN 0x20, CTRL 0x24, WRCONFIG 0x28",
    "DS60001479M ch 28 PMUX (Offset: 0x30 + n*0x01 [n=0..15]) and PINCFG (Offset: 0x40 + n*0x01 [n=0..31])",
]
notes = [
    "PMUX[n] covers pins 2n (PMUXE, low nibble) and 2n+1 (PMUXO, high nibble); function values A..I = 0..8.",
    "NINE FUNCTION LETTERS ON THIS FAMILY, NOT EIGHT. Table 6-1's header runs A through I, and column I is CCL -- the Configurable Custom Logic, which the SAM D21 line does not have. So FUNC_I = 8 is a legal nibble here and would name nothing on a samd20, which is why the constant table below is this family's rather than shared.",
    "PINCFG: PMUXEN hands the pin to the muxed function; INEN enables the input buffer (required for any pin the peripheral READS -- an RX line, MISO).",
    "THE GROUP COUNT IS THE PAD SET'S, and the group bases are enumerated in instances.toml rather than derived by a consumer that assumes a number.",
    "DRVSTR is transcribed because it is stated, not because a driver uses it: the field list is what a reader checks a write against, and a register described with a hole where a documented bit lives invites the assumption that the hole is reserved.",
]

[registers.DIR]
offset = 0x00
width = 32
fields = { DIR = [0, 32] }
notes = "The direction word, readable: 1 = output. A driver reporting a pin's CURRENT mode reads this rather than shadowing it, so a pin another driver configured is described honestly."

[registers.DIRCLR]
offset = 0x04
width = 32
fields = { DIRCLR = [0, 32] }
notes = "Write 1s to make pins INPUTS."

[registers.DIRSET]
offset = 0x08
width = 32
fields = { DIRSET = [0, 32] }
notes = "Write 1s to make pins outputs."

[registers.OUT]
offset = 0x10
width = 32
fields = { OUT = [0, 32] }
notes = "The output drive level, readable. Load-bearing beyond writing a level: with PINCFG.PULLEN set on an INPUT pin, this bit SELECTS THE PULL DIRECTION (1 = pull-up, 0 = pull-down), so a driver offering InputPullUp/InputPullDown cannot be written without it."

[registers.OUTCLR]
offset = 0x14
width = 32
fields = { OUTCLR = [0, 32] }
notes = "Write 1s to drive pins low."

[registers.OUTSET]
offset = 0x18
width = 32
fields = { OUTSET = [0, 32] }
notes = "Write 1s to drive pins high."

[registers.IN]
offset = 0x20
width = 32
fields = { IN = [0, 32] }
notes = "The input samples (INEN pins only)."

[registers.PMUX0]
offset = 0x30
width = 8
fields = { PMUXE = [0, 4], PMUXO = [4, 4] }
notes = "Element 0 of the per-pin-pair mux array; see the block header for the element derivation."

[registers.PINCFG0]
offset = 0x40
width = 8
fields = { PMUXEN = [0, 1], INEN = [1, 1], PULLEN = [2, 1], DRVSTR = [6, 1] }
notes = "Element 0 of the per-pin config array; see the block header for the element derivation."

# Function-letter values for PMUX nibbles (family-wide; the pin-map rows name letters).
# NOTE: THIS TABLE RUNS TO I AND THE SAM D21 LINE'S STOPS AT H. The values are still 0..n in
# letter order; what is new is that there is a ninth column at all. A pin-map row carries the
# letter and this table turns it into a nibble; what the letter SELECTS is Table 6-1's or 6-2's
# business, and WHICH of those two depends on the package.
[constants]
FUNC_A = 0
FUNC_B = 1
FUNC_C = 2
FUNC_D = 3
FUNC_E = 4
FUNC_F = 5
FUNC_G = 6
FUNC_H = 7
FUNC_I = 8
