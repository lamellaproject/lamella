# The SAMC21 instance map: every placed block copy, its base, and its per-instance ids.
# Layout truth lives in blocks/*.toml; wiring truth lives in bsp/<board>/board.toml. The record
# schema is uniform across rows; -1 marks a field that does not apply to a row and emits nothing.
#
# THE RECORD IS NOT THE SAM D21 LINE'S, AND THE DIFFERENCE IS THE POINT. Those families carry
# `apbc_bit` -- the APB gate is always APBC there, so the register is a constant and only the bit
# varies. On this family it is not: the SERCOMs are gated from APBCMASK, PORT from APBBMASK, and
# SERCOM6/7 from APBDMASK. So a row states `apb_mask_offset` -- WHICH mask register, as an offset
# from MCLK's base -- alongside its bit. That is the same record `csp/same54` uses, and the
# generator's PCHCTRL arm reads it.
#
# EIGHT SERCOM ROWS, AND ONLY SIX EXIST ON THE 64-PIN PART. SERCOM6 and SERCOM7 are behind
# AHB-APB Bridge D at 0x43000000 and are present only on the N. They are rowed because they are
# real placed silicon on the part that has them; parts.toml states which package carries what.

[table]
kind = "instances"
family = "samc21"
record = ["base", "gclk_core_id", "apb_mask_offset", "apb_bit", "irq"]
sources = [
    "SAM C20/C21 Family Data Sheet DS60001479M Table 12-1 (Peripherals Configuration Summary SAM C21 N) for base address, IRQ line, APB index and generic-clock index -- the N table, because it is the one that carries SERCOM6 and SERCOM7",
    "DS60001479M Table 12-3 (Peripherals Configuration Summary SAM C21 E/G/J), compared row by row against the N's: identical for MCLK, GCLK, PORT and SERCOM0..5",
    "DS60001479M section 17.8.9 (APBC Mask) and 17.8.10 (APBD Mask) for the gate bit positions, stated one bit at a time in prose rather than read out of the register-summary table",
    "DS60001479M section 17.8 for the mask register offsets: AHBMASK 0x10, APBAMASK 0x14, APBBMASK 0x18, APBCMASK 0x1C, APBDMASK 0x20",
]
notes = [
    "SERCOM0..5 stride 0x400 from 0x42000400 and are gated from APBCMASK bits 1..6. SERCOM6 and SERCOM7 are at 0x43000000 and 0x43000400 and are gated from APBDMASK bits 0 and 1. Each row is still stated explicitly -- a table is data, not a formula.",
    "THE GENERIC-CLOCK IDS DO NOT STRIDE CLEANLY AND A FORMULA WOULD BE WRONG. SERCOM0..4 take CORE ids 19,20,21,22,23 and SERCOM5 takes 25 -- not 24. Table 12-1 also gives SERCOM0..4 a SLOW id of 18 and SERCOM5 a SLOW id of 24, so the number a formula would have predicted for SERCOM5's core is that instance's slow clock. Only the CORE id belongs in the record below.",
    "SERCOM6 AND SERCOM7 SHARE NVIC LINES WITH SERCOM0 AND SERCOM1. Table 12-1 gives SERCOM6 IRQ 9 and SERCOM7 IRQ 10, which are SERCOM0's and SERCOM1's. The irq column below therefore holds duplicate values on purpose; see parts.toml.",
    "THREE PORT GROUPS ON THE DIE. The 100-pin package bonds pads in all three; the 64-pin package bonds none in group C. That is a package fact and lives in parts.toml.",
]

[[instances]]
name = "sercom0"
block = "sercom"
base = 0x42000400
gclk_core_id = 19
apb_mask_offset = 0x1C
apb_bit = 1
irq = 9

[[instances]]
name = "sercom1"
block = "sercom"
base = 0x42000800
gclk_core_id = 20
apb_mask_offset = 0x1C
apb_bit = 2
irq = 10

[[instances]]
name = "sercom2"
block = "sercom"
base = 0x42000C00
gclk_core_id = 21
apb_mask_offset = 0x1C
apb_bit = 3
irq = 11

[[instances]]
name = "sercom3"
block = "sercom"
base = 0x42001000
gclk_core_id = 22
apb_mask_offset = 0x1C
apb_bit = 4
irq = 12

[[instances]]
name = "sercom4"
block = "sercom"
base = 0x42001400
gclk_core_id = 23
apb_mask_offset = 0x1C
apb_bit = 5
irq = 13

# CORE 25, NOT 24. Table 12-1 prints "25: CORE" over "24: SLOW" against this row where every other
# SERCOM prints its own core over a shared "18: SLOW". The 24 a stride would predict is this
# instance's slow clock, so a formula gets a real channel id that clocks the wrong thing.
[[instances]]
name = "sercom5"
block = "sercom"
base = 0x42001800
gclk_core_id = 25
apb_mask_offset = 0x1C
apb_bit = 6
irq = 14

# THE 100-PIN PART'S TWO EXTRA SERCOMS, BEHIND BRIDGE D. Absent from the 64-pin package entirely.
# Their gate is APBDMASK (0x20), not APBCMASK, and their NVIC lines are SERCOM0's and SERCOM1's.
[[instances]]
name = "sercom6"
block = "sercom"
base = 0x43000000
gclk_core_id = 41
apb_mask_offset = 0x20
apb_bit = 0
irq = 9

[[instances]]
name = "sercom7"
block = "sercom"
base = 0x43000400
gclk_core_id = 42
apb_mask_offset = 0x20
apb_bit = 1
irq = 10

[[instances]]
name = "mclk"
block = "mclk"
base = 0x40000800
gclk_core_id = -1
apb_mask_offset = -1
apb_bit = -1
irq = -1

[[instances]]
name = "gclk"
block = "gclk"
base = 0x40001C00
gclk_core_id = -1
apb_mask_offset = -1
apb_bit = -1
irq = -1

[[instances]]
name = "porta"
block = "port"
base = 0x41000000
gclk_core_id = -1
apb_mask_offset = -1
apb_bit = -1
irq = -1

[[instances]]
name = "portb"
block = "port"
base = 0x41000080
gclk_core_id = -1
apb_mask_offset = -1
apb_bit = -1
irq = -1

# GROUP 2. Bonded only on the 100-pin package, where it carries 26 pads including this roster's
# N board's LED. Its base is the PORT base plus two 0x80 strides, and both halves come from the
# register descriptions rather than from a separately printed address.
[[instances]]
name = "portc"
block = "port"
base = 0x41000100
gclk_core_id = -1
apb_mask_offset = -1
apb_bit = -1
irq = -1
