# INSTANCE map: where each RP2040 block copy sits + its reset-release bit
# (reset bits are per-instance bus-gate facts). The pll rows are
# verified against RP2040 datasheet 2.2 (address map) + 2.14 (RESETS list) with the
# datasheet open.
# `resets_clr` is the chip's atomic write-1-to-CLEAR alias of `resets` (base + 0x3000).
# -1 = not applicable. Rows are added evidence-first, uart1 (0x40038000 per the SVD) joins
# when a binding first needs it, verified against the datasheet with the datasheet open.

[table]
kind = "instances"
family = "rp2040"
record = ["base", "reset_bit"]
sources = ["raspberrypi/pico-sdk RP2040.svd (bases)", "RP2040 datasheet 2.14 (RESETS bits), 2.2 (address map)", "RP2040 datasheet 2.3.1.7 (SIO_BASE 0xd0000000: 'The SIO registers start at a base address of 0xd0000000')"]

[[instances]]
name = "xosc"
block = "xosc"
base = 0x40024000
reset_bit = -1

[[instances]]
name = "clocks"
block = "clocks"
base = 0x40008000
reset_bit = -1

[[instances]]
name = "resets"
block = "resets"
base = 0x4000C000
reset_bit = -1

[[instances]]
name = "resets_clr"
block = "resets"
base = 0x4000F000
reset_bit = -1

[[instances]]
name = "io_bank0"
block = "io-bank0"
base = 0x40014000
reset_bit = 5

[[instances]]
name = "pads_bank0"
block = "pads-bank0"
base = 0x4001C000
reset_bit = 8

[[instances]]
name = "pll_sys"
block = "pll"
base = 0x40028000
reset_bit = 12

[[instances]]
name = "pll_usb"
block = "pll"
base = 0x4002C000
reset_bit = 13

[[instances]]
name = "uart0"
block = "uart"
base = 0x40034000
reset_bit = 22

# The single-cycle IO block, which is what a board's GPIO device rows resolve through on this
# family (a `GPnn` control pin reads its group base from here, not from a port instance).
# reset_bit = -1: SIO is not on the RESETS bus at all -- it is core-local IO, so there is no
# reset bit to state and inventing a plausible one would be a fact this chip does not have.
[[instances]]
name = "sio"
block = "sio"
base = 0xd0000000
reset_bit = -1
