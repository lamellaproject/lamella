# BLOCK layout: the RP2040 subsystem resets block.
# PER-PERIPHERAL reset bit positions are per-instance
# facts (`reset_bit` in ../instances.toml -- one legal home); this block carries
# only the register geometry.

[table]
kind = "block"
family = "rp2040"
block = "resets"
sources = ["raspberrypi/pico-sdk RP2040.svd", "RP2040 datasheet 2.14 (RESETS)"]
notes = [
    "The chip's atomic register aliases apply: RESET at the CLR alias base (instances row `resets_clr`) is write-1-to-CLEAR -- clearing a bit releases the peripheral's reset.",
]

[registers.RESET]
offset = 0x0
width = 32
notes = "1 = held in reset. Write through the resets_clr alias to release; the fields are the instance rows' reset_bit values."

[registers.RESET_DONE]
offset = 0x8
width = 32
notes = "A released peripheral's bit reads 1 once it is out of reset."
