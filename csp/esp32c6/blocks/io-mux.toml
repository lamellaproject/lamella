# BLOCK layout: the ESP32-C6 IO_MUX (per-pin function select).
# The per-pin register ARRAY is
# GPIO<n> = base + GPIO0 offset + GPIO_STRIDE * n -- the esp-family pin derivation the
# generator implements. The field layout is shared across pins. MCU_SEL selects the pin's IO_MUX
# function (the pin-map function column); function 0 is each pin's NATIVE signal -- no GPIO
# matrix involved. Matrix routing (U0TXD_OUT/U0RXD_IN signals) is the named growth path
# when a board binds a non-native pin; nothing consumes it today, so it is not stated.

[table]
kind = "block"
family = "esp32c6"
block = "io-mux"
sources = ["esp-idf v5.3 soc io_mux_reg.h + gpio_sig_map.h"]

[registers.GPIO0]
offset = 0x4
width = 32
fields = { FUN_WPD = [7, 1], FUN_WPU = [8, 1], FUN_IE = [9, 1], FUN_DRV = [10, 2], MCU_SEL = [12, 3] }
notes = "The array base pin (GPIO0). Per-pin stride is 4 (GPIOn = 0x04 + 4*n)."

[constants]
GPIO_STRIDE = 4
FUN_DRV_DEFAULT = 2
