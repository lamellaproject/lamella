# PIN map: pin x function -> (instance, signal) for the ESP32-C6.
# PARTIAL, evidence-only. Function ids are IO_MUX MCU_SEL values (F0..F4);
# F0 is each pin's NATIVE function. GPIO<n> is the bank-less spelling.

[table]
kind = "pins"
family = "esp32c6"
sources = ["esp-idf v5.3 soc io_mux_reg.h (the IO_MUX function table)"]

[[pins]]
pin = "GPIO16"
function = "F0"
instance = "uart0"
signal = "tx"
source = "io_mux_reg.h (GPIO16 function 0 = U0TXD)"

[[pins]]
pin = "GPIO17"
function = "F0"
instance = "uart0"
signal = "rx"
source = "io_mux_reg.h (GPIO17 function 0 = U0RXD)"
