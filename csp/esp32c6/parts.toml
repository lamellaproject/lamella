# PARTS table for the esp32c6 family. PARTIAL.
#
# part id: the family-generic chip name, deliberately -- a board carries the chip
# inside a module (e.g. ESP32-C6-WROOM-1) whose exact order code (and the bare chip's) is
# deferred to the module CSP, to be transcribed from that module's datasheet.
# flash = 0: code XIPs from module/external QSPI flash through the cache
# window -- a board/module fact, not chip truth (same class as the rp2040
# board-memory record). ram: the 512 KB HP SRAM (TRM ch 4), mapped
# 0x40800000..0x40880000 with a bootloader carve-out at the base.

[table]
kind = "parts"
family = "esp32c6"

[[parts]]
part = "esp32c6"
package = "module-carried (order code lands with the module CSP)"
flash = 0
ram = 0x80000
pins = ["GPIO16", "GPIO17"]
source = "ESP32-C6 TRM ch 4 (internal memory: 512 KB HP SRAM) -- the pin list is PARTIAL rather than the package's full set"
