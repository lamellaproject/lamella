# The SAMD21 pin-function map: pin x function -> (instance, signal). PARTIAL and
# append-only: rows exist for every binding a board package uses, each with its source;
# grow the table with the boards, never from recall. A binding whose (pin, function) row
# is missing REFUSES.

[table]
kind = "pins"
family = "samd21"
sources = [
    "SAMD21 datasheet DS40001882 Table 7-1 (I/O multiplexing and considerations)",
]

[[pins]]
pin = "PA12"
function = "C"
instance = "sercom2"
signal = "pad0"
source = "DS40001882 Table 7-1 (WINC MOSI)"

[[pins]]
pin = "PA12"                # the SAME pin's other SERCOM: column C is SERCOM, column D is
function = "D"              # SERCOM-ALT, and PA12 carries a pad0 of each -- so this
instance = "sercom4"        # row is the SERCOM-ALT alternative to the sercom2 row above.
signal = "pad0"
source = "DS40001882D Table 7-1 as printed on page 29. The column HEADERS carry the distinction that matters -- column C is SERCOM and column D is SERCOM-ALT -- and they are what separates this row from the sercom2 one above it, so the two rows can only be told apart by reading the headers alongside the cells. Corroborated by Adafruit ArduinoCore-samd variants/feather_m0/variant.cpp ('MISO: SERCOM4/PAD[0]', PIO_SERCOM_ALT = function D)."

[[pins]]
pin = "PA13"
function = "C"
instance = "sercom2"
signal = "pad1"
source = "DS40001882 Table 7-1 (WINC SCK)"

[[pins]]
pin = "PA14"
function = "C"
instance = "sercom2"
signal = "pad2"
source = "DS40001882 Table 7-1 (unused by the module wiring: PA14 stays a soft CS PORT output)"

[[pins]]
pin = "PA15"
function = "C"
instance = "sercom2"
signal = "pad3"
source = "DS40001882 Table 7-1 (WINC MISO)"

[[pins]]
pin = "PA22"
function = "C"
instance = "sercom3"
signal = "pad0"
source = "DS40001882 Table 7-1"

[[pins]]
pin = "PA23"
function = "C"
instance = "sercom3"
signal = "pad1"
source = "DS40001882 Table 7-1"

[[pins]]
pin = "PB10"
function = "D"
instance = "sercom4"
signal = "pad2"
source = "DS40001882 Table 7-1"

[[pins]]
pin = "PB11"
function = "D"
instance = "sercom4"
signal = "pad3"
source = "DS40001882 Table 7-1"

[[pins]]
pin = "PB22"
function = "D"
instance = "sercom5"
signal = "pad2"
source = "DS40001882 Table 7-1"

[[pins]]
pin = "PB23"
function = "D"
instance = "sercom5"
signal = "pad3"
source = "DS40001882 Table 7-1"

# --- EIC: the COMPLETE pad-to-EXTINT map for this die ------------------------------------------
#
# EVERY PAD ON THE DIE IS HERE, AND THAT IS THE WHOLE POINT OF THE SECTION. Which EXTINT a pad can
# raise is a property of the silicon, so it does not depend on any board and must not be limited to
# the pads some particular board happens to wire. This part appears on a great many designs -- more
# than any catalog enumerates -- and an engineer who prototypes on an evaluation kit and then lays
# out their own hardware needs every pad, not the subset somebody else used first.
#
# The rest of this table is grown as bindings appear, because a pin x function map has hundreds of
# combinations and most are never used. THIS SECTION IS DIFFERENT AND CHEAPLY SO: a pad has exactly
# one function-A entry and the set is bounded at 52, so completeness costs one transcription and
# spares every future design a refusal it could do nothing about.
#
# FUNCTION A IS THE EIC COLUMN, so a pad raises its EXTINT only with PINCFG.PMUXEN set and PMUX
# selecting A.
#
# THE LINE IS NOT THE PAD AND A DERIVATION IS WRONG ON SIX PADS. For 45 of the 51 the line is the
# pad index modulo sixteen, which is exactly enough to make the rule look right; PA24 raises
# EXTINT[12] where that says 8, PA25 raises 13 for 9, PA27 raises 15 for 11, PA28 raises 8 for 12,
# PA30 raises 10 for 14 and PA31 raises 11 for 15.
#
# PA08 IS NMI AND NOT AN EXTINT, alone on this die. A consumer treating function A as "the external
# interrupt line" arms the non-maskable interrupt there: unmaskable, absent from INTFLAG, and not
# serviced by the handler the other sixteen share.
#
# SIXTEEN LINES ACROSS 51 PADS MEANS PADS SHARE, and only one of a line's pads can be the live
# source. Nothing in the chip reports the competition.
#
# Every row: DS40001882D Table 7-1 (A/B/C/D variants), column A
# Anchored three ways -- the 52 pads are exactly the atsamd21j18a pad set in parts.toml, all sixteen
# lines 0 to 15 occur, and exactly one pad carries NMI. Table 7-2 states the L variants separately
# and its EIC column agrees on every pad the two tables share.

[[pins]]
pin = "PA00"
function = "A"
instance = "eic"
signal = "extint0"
source = "DS40001882D Table 7-1, column A (EIC)"

[[pins]]
pin = "PA01"
function = "A"
instance = "eic"
signal = "extint1"
source = "DS40001882D Table 7-1, column A (EIC)"

