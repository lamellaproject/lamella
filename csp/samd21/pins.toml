# --- ADC: the COMPLETE pad-to-AIN map for this die ---------------------------------------------
#
# EVERY PAD THE CONVERTER CAN SAMPLE IS HERE, for the reason the EIC section below gives for its
# lines: which AIN a pad carries is a property of the silicon, not of a board, and the set is bounded
# -- twenty inputs, one pad each -- so completeness costs one transcription. A board still offers
# only the pads it wires, by naming them in its adc binding.
#
# FUNCTION B IS THE ANALOG COLUMN, and it serves several analog peripherals at once: the ADC's
# inputs, the analog comparators' (PA04-PA07 also carry AC AIN[0]-AIN[3]), the touch controller's X
# and Y lines, the references and the DAC output. So the letter does not say which block a pad
# reaches; the instance does. Only the ADC's cells are transcribed here, and the rest join when a
# binding needs them. Selecting function B also does something no other column does: "Peripheral
# function B must be selected to disable the digital control of the pin" (Table 7-1, note 2).
#
# The signal is ain<N>, and N is the ADC channel: INPUTCTRL.MUXPOS selects AIN N with the code N.
# Every row: DS40001882D Table 7-1, the ADC cell of column B, read by word coordinates -- the column
# the header prints ADC over, apart from the comparator's cell beside it. Anchored twice: each of
# AIN0 to AIN19 occurs exactly once, and every pad is in the atsamd21j18a pad set in parts.toml --
# both checked by crates/lamella-bsp-gen/tests/samd21_adc_binding.rs.

[[pins]]
pin = "PA02"
function = "B"
instance = "adc"
signal = "ain0"
source = "DS40001882D Table 7-1 as printed on page 28: the ADC cell of column B reads AIN[0]"

[[pins]]
pin = "PA03"
function = "B"
instance = "adc"
signal = "ain1"
source = "DS40001882D Table 7-1 as printed on page 28: the ADC cell of column B reads AIN[1]"

