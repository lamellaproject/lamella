# The SAMD21 pin-function map: pin x function -> (instance, signal). PARTIAL and
# append-only: rows exist for every binding the in-tree boards use,
# each with its source; grow the table with the boards, never from memory. A binding whose
# (pin, function) row is missing REFUSES.

[table]
kind = "pins"
family = "samd21"
sources = [
    "SAMD21 datasheet DS40001882 Table 7-1 (I/O multiplexing and considerations)",
]


pin = "PA12"
function = "C"
instance = "sercom2"
signal = "pad0"
source = "DS40001882 Table 7-1; silicon-proven by samd21_wifi.rs (WINC MOSI)"


pin = "PA13"
function = "C"
instance = "sercom2"
signal = "pad1"
