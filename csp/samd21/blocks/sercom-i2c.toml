# SERCOM in I2C MASTER mode on the Microchip SAMD21 family -- the BLOCK layout: register offsets
# are SERCOM-instance-relative; nothing in this file names an instance, a pin, a board, or a clock
# plan. Instance bases/ids live in ../instances.toml; board wiring lives in bsp/<board>/board.toml.
#
# Authored 2026-07-20 from the datasheet, NOT from the sibling sercom-usart.toml: the two modes
# share a SERCOM and a CTRLA.MODE field position, and share nothing else worth assuming. Every
# offset below is taken from the per-register DESCRIPTION headings in 28.10 ("Offset: 0x.."), which
# is deliberate -- the first note below says why, and which value it changes.

[table]
kind = "block"
family = "samd21"
block = "sercom"
mode = "i2c-master"
sources = [
    "SAMD21 datasheet DS40001882D ch 28 (SERCOM I2C): 28.10 Register Description - I2C Master, per-register Offset headings",
    "DS40001882D 28.10.1 CTRLA: 'These bits must be written to 0x5 to select the I2C master serial communication interface'",
    "DS40001882D 28.10.2 CTRLB Table 28-8 Command Description (CMD encoding) + ACKACT",
    "DS40001882D 28.10.7 STATUS (BUSSTATE encoding) + 28.10.8 SYNCBUSY",
    "DS40001882D 28.6.2.4.1 Master Clock Generation, figure/page DS40001882D-page 557 (the SCL frequency formula)",
]
notes = [
    "THE OFFSETS HERE COME FROM THE 28.10 DESCRIPTION HEADINGS, one register at a time, and NOT from the ch 28.9 'Register Summary - I2C Master' table -- the two disagree, and the disagreement changes a value. The summary places BAUD at 0x10; BAUD is at 0x0C, per its own register description AND per the sibling USART block, which places BAUD at the same offset. Do not re-derive these from the summary table.",
    "The SCL frequency relation, as printed with its subscripts: f_SCL = f_GCLK / (10 + 2*BAUD + f_GCLK*T_RISE) when BAUDLOW = 0. Solving for the divisor, and taking T_RISE as negligible for internal pull-ups: BAUD = f_GCLK/(2*f_SCL) - 5. At the family's 8 MHz plan that is BAUD = 35 for 100 kHz.",
    "MODE = 5 selects I2C master. The field sits at CTRLA[4:2], the same position the USART block uses -- shared because it is the SERCOM's own mode selector, not because the modes resemble each other.",
    "ENABLE, SWRST and every enable-protected write must wait on the matching SYNCBUSY bit (28.6.6). Issuing a CMD or forcing BUSSTATE sets SYNCBUSY.SYSOP, so a driver waits on that too.",
    "A command may only be issued while INTFLAG.MB or INTFLAG.SB is set (28.10.2). After ENABLE the bus state is UNKNOWN; writing 0x1 to STATUS.BUSSTATE forces IDLE, and that is the only state software may force.",
    "Addressing: ADDR.ADDR carries the 7-bit slave address SHIFTED LEFT ONE with bit 0 as the read/write direction (0 = write). Writing ADDR starts the transaction.",
    "SMEN (smart mode) sends the acknowledge action automatically when DATA is read. A driver that wants explicit control of the last-byte NACK leaves it off and sets ACKACT before each CMD.",
    "DECLARED SUBSET: the FIFO fields (INTFLAG.RXFF/TXFE, CTRLB.FIFOCLR, FIFOSPACE 0x34, FIFOPTR 0x36) and the high-speed fields (HSBAUD/HSBAUDLOW, CTRLA.SCLSM/SPEED beyond Sm) exist on this part but are NOT declared here, because nothing consumes them yet and an undeclared field cannot be silently wrong. Adding one obliges re-reading its description.",
]

[registers.CTRLA]
offset = 0x0
width = 32
fields = { SWRST = [0, 1], ENABLE = [1, 1], MODE = [2, 3], RUNSTDBY = [7, 1], PINOUT = [16, 1], SDAHOLD = [20, 2], MEXTTOEN = [22, 1], SEXTTOEN = [23, 1], SPEED = [24, 2], SCLSM = [27, 1], INACTOUT = [28, 2], LOWTOUT = [30, 1] }
notes = "MODE 5 = I2C master. SPEED 0 = standard/fast (Sm/Fm, up to 400 kHz). PINOUT 0 = 2-wire (no 4-wire). SDAHOLD sets the SDA hold time; 0 is the reset value and is adequate at Sm."

[registers.CTRLB]
offset = 0x4
width = 32
fields = { SMEN = [8, 1], QCEN = [9, 1], CMD = [16, 2], ACKACT = [18, 1] }
notes = "CMD is a strobe and always reads zero: 0 = no action, 1 = ack action then repeated start, 2 = ack action then a byte read (master read only; no operation while writing), 3 = ack action then stop. ACKACT 0 = ACK, 1 = NACK, and it is only meaningful in master read mode."

[registers.BAUD]
offset = 0xC
width = 32
fields = { BAUD = [0, 8], BAUDLOW = [8, 8] }
notes = "With BAUDLOW = 0 the BAUD field times both the SCL high and low periods; see the block formula note. T_HIGH = (BAUD + 5) / f_GCLK."

[registers.INTENCLR]
offset = 0x14
width = 8
fields = { MB = [0, 1], SB = [1, 1], ERROR = [7, 1] }
notes = "A polled driver clears these so no interrupt is ever asserted."

[registers.INTENSET]
offset = 0x16
width = 8
fields = { MB = [0, 1], SB = [1, 1], ERROR = [7, 1] }

[registers.INTFLAG]
offset = 0x18
width = 8
fields = { MB = [0, 1], SB = [1, 1], ERROR = [7, 1] }
notes = "MB = master on bus (an address or a written byte completed); SB = slave on bus (a byte was received). Both are the gate on issuing a CMD. ERROR is set when any of STATUS's error bits set, and is cleared by writing 1."

[registers.STATUS]
offset = 0x1A
width = 16
fields = { BUSERR = [0, 1], ARBLOST = [1, 1], RXNACK = [2, 1], BUSSTATE = [4, 2], LOWTOUT = [6, 1], CLKHOLD = [7, 1], MEXTTOUT = [8, 1], SEXTTOUT = [9, 1], LENERR = [10, 1] }
notes = "RXNACK 0 = the slave ACKed the last address or data byte, 1 = it did not -- this is how an absent device is detected, and it is a STATUS rather than an error. BUSSTATE: 0 UNKNOWN, 1 IDLE, 2 OWNER (we hold the bus), 3 BUSY (another master does)."

[registers.SYNCBUSY]
offset = 0x1C
width = 32
fields = { SWRST = [0, 1], ENABLE = [1, 1], SYSOP = [2, 1] }
notes = "SYSOP covers a system operation: writing ADDR, writing DATA, issuing a CMD, or forcing BUSSTATE."

[registers.ADDR]
offset = 0x24
width = 32
fields = { ADDR = [0, 11], LENEN = [13, 1], HS = [14, 1], TENBITEN = [15, 1], LEN = [16, 8] }
notes = "Writing ADDR issues a start (or a repeated start if the bus is already owned) followed by the address. For 7-bit addressing the address occupies ADDR[7:1] and ADDR[0] is the direction bit."

[registers.DATA]
offset = 0x28
width = 8
fields = { DATA = [0, 8] }
notes = "Writing transmits a byte; reading takes the received byte. With SMEN off, the acknowledge action is whatever ACKACT held when the CMD was issued."

[registers.DBGCTRL]
offset = 0x30
width = 8
fields = { DBGSTOP = [0, 1] }
notes = "0 = the baud generator keeps running while the CPU is halted in debug."

[constants]
MODE_I2C_MASTER = 5
BUSSTATE_UNKNOWN = 0
BUSSTATE_IDLE = 1
BUSSTATE_OWNER = 2
BUSSTATE_BUSY = 3
CMD_NONE = 0
CMD_REPEATED_START = 1
CMD_BYTE_READ = 2
CMD_STOP = 3
ACKACT_ACK = 0
ACKACT_NACK = 1
DIRECTION_WRITE = 0
DIRECTION_READ = 1
