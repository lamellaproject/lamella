# SERCOM in USART mode on the Microchip SAMD21 family -- the BLOCK layout: register
# offsets are SERCOM-instance-relative; nothing in this file names an instance, a pin, a board,
# or a clock plan. Instance bases/ids live in ../instances.toml;
# board wiring lives in bsp/<board>/board.toml.
#
# Register offsets and bit widths are transcribed from the datasheet (ch 26).

[table]
kind = "block"
family = "samd21"
block = "sercom"
mode = "usart"
sources = [
    "SAMD21 datasheet DS40001882: SERCOM USART register summary + descriptions (ch 26)",
    "Microchip AT11626 (SAMD21 SERCOM USART)",
]
notes = [
    "Every write to an enable-protected register (CTRLB, ENABLE, SWRST) must wait SYNCBUSY for that bit before the config is live (26.6.6).",
    "16x async arithmetic mode: BAUD = 65536 - (65536 * 16 * baud_hz) / f_core_hz (f_core_hz = the routed GCLK generator's rate, a PLAN fact).",
    "The RX pin needs PORT PINCFG.INEN as well as PMUXEN; the TX pin (peripheral output) needs only PMUXEN (the classic SAMD21 UART gotcha -- port block truth, restated here because every USART bring-up trips it).",
    "DORD = LSB-first (1), MODE = USART with internal clock (1), CHSIZE = 8-bit (0), one stop bit, no parity = 8N1.",
]

[registers.CTRLA]
offset = 0x0
width = 32
fields = { SWRST = [0, 1], ENABLE = [1, 1], MODE = [2, 3], RUNSTDBY = [7, 1], SAMPR = [13, 3], TXPO = [16, 2], RXPO = [20, 2], FORM = [24, 4], CMODE = [28, 1], CPOL = [29, 1], DORD = [30, 1] }
notes = "MODE 1 = USART with internal clock. TXPO/RXPO select the TX/RX pads (binding-derived). DORD 1 = LSB-first. SAMPR 0 = 16x oversampling."

[registers.CTRLB]
offset = 0x4
width = 32
fields = { CHSIZE = [0, 3], SBMODE = [6, 1], SFDE = [8, 1], PMODE = [13, 1], TXEN = [16, 1], RXEN = [17, 1] }
notes = "CHSIZE 0 = 8-bit. SBMODE 0 = 1 stop bit. PMODE unused (no parity). TXEN | RXEN enable the transmitter/receiver."

[registers.BAUD]
offset = 0xC
width = 16
fields = { BAUD = [0, 16] }
notes = "16x async arithmetic mode divisor; see the block formula note."

[registers.INTENSET]
offset = 0x16
width = 8
fields = { DRE = [0, 1], TXC = [1, 1], RXC = [2, 1] }
notes = "Set RXC for interrupt-driven receive; a polled driver ignores it."

[registers.INTFLAG]
offset = 0x18
width = 8
fields = { DRE = [0, 1], TXC = [1, 1], RXC = [2, 1] }
notes = "DRE = Data Register Empty (TX has room). RXC = Receive Complete (a byte is in DATA). TXC = Transmit Complete (shift register empty)."

[registers.STATUS]
offset = 0x1A
width = 16
fields = { PERR = [0, 1], FERR = [1, 1], BUFOVF = [2, 1] }
notes = "Frame/parity/overflow errors, write-1-to-clear."

[registers.SYNCBUSY]
offset = 0x1C
width = 32
fields = { SWRST = [0, 1], ENABLE = [1, 1], CTRLB = [2, 1] }
notes = "Read-only. Wait the relevant bit clear after writing SWRST / ENABLE / CTRLB."

[registers.DATA]
offset = 0x28
width = 16
fields = { DATA = [0, 9] }
notes = "Write to transmit, read to receive (low 8 bits at 8-bit CHSIZE)."

# Block-scoped mode magic only (nothing composed from a binding or a plan may live here).
[constants]
CTRLA_MODE_USART_INTCLK = 1

[parameters]
baud = "16x async arithmetic: BAUD = 65536 - (65536 * 16 * baud_hz) / f_core_hz; the shipped rounding adds one (115200 over 8 MHz = 0xC505)."
tx_byte = "the byte to transmit (write to DATA once INTFLAG.DRE is set)."

# Block-LOCAL sequences only: every step touches a SERCOM register. Cross-block bring-up
# (PM gate, GCLK route, PORT mux) is driver code per language.

[[sequences.tx_byte]]
op = "poll"
reg = "INTFLAG"
mask = 0x1
note = "DRE: the data register has room"

[[sequences.tx_byte]]
op = "write"
reg = "DATA"
value = "$tx_byte"

[[sequences.rx_poll]]
op = "poll"
reg = "INTFLAG"
mask = 0x4
note = "RXC: a byte arrived"

[[sequences.rx_poll]]
op = "read"
reg = "DATA"
mask = 0xFF
