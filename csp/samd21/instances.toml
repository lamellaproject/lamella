# The SAMD21 instance map: every placed block copy, its base, and its per-instance ids.
# Layout truth lives in blocks/*.toml; wiring truth lives in bsp/<board>/board.toml. The record
# schema is uniform across rows; -1 marks a field that does not
# apply to a row and emits nothing.

[table]
kind = "instances"
family = "samd21"
record = ["base", "gclk_core_id", "apbc_bit", "irq"]
sources = [
    "SAMD21 datasheet DS40001882: peripheral base addresses (product mapping, ch 12), GCLK CLKCTRL IDs (ch 15), PM APBCMASK bits (ch 16), NVIC line assignments (ch 11)",
]
notes = [
    "SERCOM bases stride 0x400 from 0x42000800; GCLK core-clock IDs stride 1 from 0x14; APBCMASK bits stride 1 from bit 2; NVIC lines stride 1 from 9 -- each row is still stated explicitly (a table is data, not a formula).",
    "THE RECORD NAMES AN APB *C* BIT AND THE EIC IS ON APB A, so its clock gate cannot be expressed in a row here. It is PM.APBAMASK bit 6, stated in blocks/eic.toml, and that bit is SET at reset -- the reset value is 0x0000007F -- so nothing has to enable it and nothing currently reads it. The gap is recorded rather than closed because widening the record touches every row in this file and changes what every samd21 board emits; the sibling family csp/same54 carries a general apb_mask_offset plus apb_bit pair and has no such limitation, which is where the shape should come from when this is widened.",
]

[[instances]]
name = "sercom0"
block = "sercom"
base = 0x42000800
gclk_core_id = 0x14
apbc_bit = 2
irq = 9

[[instances]]
name = "sercom1"
block = "sercom"
base = 0x42000C00
gclk_core_id = 0x15
apbc_bit = 3
irq = 10

[[instances]]
name = "sercom2"
block = "sercom"
base = 0x42001000
gclk_core_id = 0x16
apbc_bit = 4
irq = 11

[[instances]]
name = "sercom3"
block = "sercom"
base = 0x42001400
gclk_core_id = 0x17
apbc_bit = 5
irq = 12

[[instances]]
name = "sercom4"
block = "sercom"
base = 0x42001800
gclk_core_id = 0x18
apbc_bit = 6
irq = 13

[[instances]]
name = "sercom5"
block = "sercom"
base = 0x42001C00
gclk_core_id = 0x19
apbc_bit = 7
irq = 14

[[instances]]
name = "pm"
block = "pm"
base = 0x40000400
gclk_core_id = -1
apbc_bit = -1
irq = -1

[[instances]]
name = "gclk"
block = "gclk"
base = 0x40000C00
gclk_core_id = -1
apbc_bit = -1
irq = -1

[[instances]]
name = "porta"
block = "port"
base = 0x41004400
gclk_core_id = -1
apbc_bit = -1
irq = -1

[[instances]]
name = "portb"
block = "port"
base = 0x41004480
gclk_core_id = -1
apbc_bit = -1
irq = -1

# --- the external interrupt controller ------------------------------------------------------------
#
# ON APB A RATHER THAN APB C, which is why `apbc_bit` is -1 on this row and not an omission: the
# gate exists and this record cannot name it. See the table note above and blocks/eic.toml.

[[instances]]
name = "eic"
block = "eic"
base = 0x40001800          # DS40001882D Figure 9-1, AHB-APB Bridge A
gclk_core_id = 0x05        # GCLK_EIC. Needed only for filtering and synchronous sensing; asynchronous
                           # edge detection runs without it.
apbc_bit = -1              # NOT ABSENT: PM.APBAMASK bit 6, which this record cannot express
irq = 4                    # DS40001882D Table 11-3. ONE line for all sixteen EXTINTs; NMI is separate
                           # and is not an NVIC line at all.
