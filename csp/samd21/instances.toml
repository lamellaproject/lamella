# --- the external interrupt controller ------------------------------------------------------------
#
# ON APB A RATHER THAN APB C, which is why `apbc_bit` is -1 on this row and not an omission: the
# gate exists and this record cannot name it. See the table note above and blocks/eic.toml.

[[instances]]
name = "eic"
block = "eic"
base = 0x40001800          # DS40001882D Figure 9-1, AHB-APB Bridge A
gclk_core_id = 0x05        # GCLK_EIC. Needed for the filter and for every edge sense; only level
                           # sensing without the filter runs without it.
apbc_bit = -1              # NOT ABSENT: PM.APBAMASK bit 6, which this record cannot express
irq = 4                    # DS40001882D Table 11-3. ONE line for all sixteen EXTINTs; NMI is separate
                           # and is not an NVIC line at all.
wo_count = -1
cc_count = -1
counter_bits = -1
gclk_max_hz = -1

# --- the analog-to-digital converter ------------------------------------------------------------

[[instances]]
name = "adc"
block = "adc"
base = 0x42004000          # DS40001882D Figure 9-1 and Table 12-1
gclk_core_id = 0x1E        # GCLK_ADC
apbc_bit = 16              # SET at reset: APBCMASK resets to 0x00010000, this bit alone
irq = 23
wo_count = -1
cc_count = -1
counter_bits = -1
gclk_max_hz = -1

# --- the system controller ----------------------------------------------------------------------
#
# Placed for one register: VREF, whose BGOUTEN bit routes the bandgap to an ADC input. SYSCTRL is
# on APB A, so its gate is not an APBC bit, and no driver takes its interrupt.

[[instances]]
name = "sysctrl"
block = "sysctrl"
base = 0x40000800
gclk_core_id = -1
apbc_bit = -1
irq = -1
wo_count = -1
cc_count = -1
counter_bits = -1
gclk_max_hz = -1

# --- the timer/counters -------------------------------------------------------------------------
#
# TCC0-TCC2 and TC3-TC7, each with its outputs, its compare channels, a TCC's counter size and its
# generic clock's ceiling. Every bus clock here is off at reset (APBCMASK resets to 0x00010000).

[[instances]]
name = "tcc0"
block = "tcc"
base = 0x42002000
gclk_core_id = 0x1A
apbc_bit = 8
irq = 15
wo_count = 8
cc_count = 4
counter_bits = 24
gclk_max_hz = 96000000

