# INSTANCE map for the SAM4S family -- identity-first: ONLY the placed block copies a current
# binding references, with the sam3x-shaped record: the peripheral id is one number serving as
# both the PMC clock-gate bit and the NVIC line; system controllers (PMC, EEFC) have no id
# (-1 emits nothing). Block layouts arrive with the family's first generated driver.
#
# THE PORT ROWS SAY WHICH GROUP THEY ARE, RATHER THAN LEAVING IT TO THEIR NAMES. A pin named
# PC10 has to resolve to the base address of the port group that backs it, and this vendor calls
# that group PIOC where others call theirs PORTC, GPIOC or PORT0. `port` states the answer as
# data, so nothing has to recognize the spelling.

[table]
kind = "instances"
family = "sam4s"
record = ["base", "pid"]

[[instances]]
name = "uart1"
block = "uart"
base = 0x400E0800
pid = 9

[[instances]]
name = "pmc"
block = "pmc"
base = 0x400E0400   # PMC_SCER at the block base; PCER1 +0x100
pid = -1

[[instances]]
name = "pioa"
block = "pio"
port = "A"          # this instance IS the group pins named PA<n> resolve to
base = 0x400E0E00
pid = 11

[[instances]]
name = "piob"
block = "pio"
port = "B"          # this instance IS the group pins named PB<n> resolve to
base = 0x400E1000
pid = 12

[[instances]]
name = "pioc"
block = "pio"
port = "C"          # this instance IS the group pins named PC<n> resolve to
base = 0x400E1200
pid = 13

[[instances]]
name = "eefc0"
block = "eefc"
base = 0x400E0A00   # plane-0 flash controller
pid = -1

[[instances]]
name = "eefc1"
block = "eefc"
base = 0x400E0C00   # plane-1 flash controller
pid = -1
