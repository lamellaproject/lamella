# The SAML21 pin-function map: pin x function -> (instance, signal). PARTIAL and append-only:
# rows exist for every binding a board package uses, each with its source; grow the table with
# the boards, never from recall. A binding whose (pin, function) row is missing REFUSES.

[table]
kind = "pins"
family = "saml21"
sources = [
    "SAM L21 Family Data Sheet DS60001477E Table 7-1 (PORT Function Multiplexing). The distinction between column C (SERCOM) and column D (SERCOM-ALT) lives in the table's header row, so a cell in this table does not carry its own meaning and every row below records the letter alongside the pad",
]
notes = [
    "COLUMN C IS SERCOM AND COLUMN D IS SERCOM-ALT. A pin carrying a pad of each has two rows here and they are told apart only by the letter, so a row without its function letter is not a fact.",
    "NINE FUNCTION LETTERS ON THIS FAMILY, A THROUGH I. Column I is CCL -- Configurable Custom Logic -- and column A is EIC/RSTC rather than the SAM D21 line's plain EIC, because this part can wake from a reset controller input on the same pads.",
    "THE VCP PADS CARRY A SERCOM IN BOTH C AND D, so the letter is a real choice here rather than a formality. PA22 and PA23 are SERCOM3 in column C and SERCOM5 in column D; naming the wrong letter binds the instance behind Bridge D instead of the one the kit wires.",
]

# ---- the SAM L21 Xplained Pro's EDBG virtual COM port -------------------------------------------
#
# Atmel-42405 Table 4-10 names SERCOM3 PAD[0] on PA22 and SERCOM3 PAD[1] on PA23 and does not name
# a function column. Table 7-1 places SERCOM3 in column C on both pads and SERCOM5 in column D, so
# the guide's instance is right and the letter it omits is C -- and getting that wrong would bind
# SERCOM5, which on this part lives behind a different APB bridge with a different gate register.

[[pins]]
pin = "PA22"
function = "C"
instance = "sercom3"
signal = "pad0"
source = "DS60001477E Table 7-1: the PA22 row (SAML21J pin 43) carries SERCOM3/PAD[0] in column C and SERCOM5/PAD[0] in column D, SERCOM-ALT. Corroborated on the instance and pad by SAM L21 Xplained Pro user guide Atmel-42405 Table 4-10, which names SERCOM3 PAD[0] for the EDBG's TX line without naming the column."

[[pins]]
pin = "PA23"
function = "C"
instance = "sercom3"
signal = "pad1"
source = "DS60001477E Table 7-1: the PA23 row (SAML21J pin 44) carries SERCOM3/PAD[1] in column C and SERCOM5/PAD[1] in column D, SERCOM-ALT. Corroborated by Atmel-42405 Table 4-10 for the EDBG's RX line."
