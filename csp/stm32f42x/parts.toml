# PARTS table for the STM32F42x family.
#
# A pin present-list is PARTIAL and is PER ROW, so a consumer must not read either one as the
# package: both rows below are LQFP144 parts and they name forty pins and four. The difference is
# not silicon, it is how much of each part a board here has reached. Each entry is either one pin
# or an inclusive same-port run, and every pin inside a run is a pin that part is established to
# carry -- a range reaching over a pin that is not would claim the package rather than state what
# the part is known to have.
#
# flash = 0x200000 (2 MB) is DUAL BANK -- 2 x 1 MB, with 128 KB sectors in each bank's upper part.
# That is not decoration: a firmware and the image it loads have to tile ONE bank rather than the
# whole part, so the linker gate holds that arithmetic. RM0090 gives the layout as a 2-Mbyte dual
# bank organization for this line and states that dual bank exists only on its 1 MB and 2 MB devices.
#
# ram = 0x30000 (192 KB) is the CONTIGUOUS SRAM, which these parts reach as three blocks at one
# base -- SRAM1 112 KB, SRAM2 16 KB, SRAM3 64 KB, running 0x2000 0000 to 0x2002 FFFF with no gap.
# The 64 KB CCM data RAM is NOT in that figure: it sits at 0x1000 0000 on the Cortex-M4's own data
# bus, so a linker script cannot treat the two as one region. The 4 KB backup SRAM is excluded for
# the same reason -- it lives in the backup domain.
#
# THE FAMILY NAME COVERS TWO LINES THAT SHARE A DEVICE ID AND DIFFER IN PERIPHERALS, and it now
# holds one part from each of them. RM0090 gives DEV_ID 0x419 for STM32F42xxx and STM32F43xxx alike,
# and its boundary-scan section gives BOTH the same JTAG ID code 0x06419041 -- so neither identity
# register separates the two rows below, and a program that needs to know which part it is running
# on cannot ask the silicon. What separates them is the peripheral set, and the manual draws that
# line per section: its cryptographic-processor (23) and hash-processor (25) sections each state
# that they apply to "STM32F415/417xx and STM32F43xxx devices", which is to say to the stm32f439zi
# row and not to the stm32f429zi one.
# A CONSEQUENCE WORTH STATING OUTRIGHT: a part is named by the board that carries it and is never
# probed for. On most families probing would merely be redundant; on this one it cannot work.

[table]
kind = "parts"
family = "stm32f42x"

[[parts]]
part = "stm32f429zi"
package = "LQFP144"
flash = 0x200000
ram = 0x30000
dp_idcode = 0x2BA01477
device_id_reg = 0xE0042000
device_id_mask = 0xFFF
device_id = 0x419
device_id_identifies = "class"
identity_source = "The fitted part answered DBGMCU_IDCODE 0x20036419 at 0xE0042000, which is DEV_ID 0x419 in bits 11:0 with REV_ID 0x2003 in bits 31:16 -- so the mask keeps the DEV_ID field and drops the revision. IDENTIFIES A CLASS RATHER THAN A PART: RM0090 gives DEV_ID 0x419 to STM32F42xxx and STM32F43xxx alike, so this register cannot separate this row from the stm32f439zi one beside it, and neither can the JTAG ID code 0x06419041 the same manual gives both. What separates them is the peripheral set. The DP IDCODE was measured on this part and is Arm's M3/M4-class SW-DP, shared with every STM32 M3 or M4 and with the nRF52833."
pins = [
    "PA0",
    "PA9-PA10",
    "PB5-PB6",
    "PB0", "PB7", "PB14",
    "PC0", "PC1", "PC13",
    "PD0-PD1", "PD8-PD10", "PD14-PD15",
    "PE0-PE1", "PE7-PE15",
    "PF0-PF5", "PF7-PF9", "PF11-PF15",
    "PG0-PG1", "PG4-PG5", "PG8", "PG13-PG15",
]
source = "STM32F427xx/STM32F429xx datasheet (production data): STM32F429ZI is an order code of the STM32F429xx line, LQFP144 is one of its packages, and the line carries flash memory up to 2 Mbyte with up to 256 Kbytes of SRAM and up to 4 Kbytes of backup SRAM. RM0090 gives that SRAM as main SRAM1 112 KB plus auxiliary SRAM2 16 KB plus auxiliary SRAM3 64 KB, and its embedded-SRAM memory map places SRAM1 at 0x20000000 to 0x2001BFFF and SRAM2 at 0x2001C000 to 0x2001FFFF, leaving the three contiguous to 0x2002FFFF. The fitted part answers F_SIZE 0x0800 at 0x1FFF7A22, which is 2048 Kbytes, and DBGMCU_IDCODE 0x20036419 at 0xE0042000, which is DEV_ID 0x419 with REV_ID 0x2003; the image the board shipped with placed its initial stack pointer at 0x2002F080, inside the third block and 3968 bytes below the top of the contiguous region. The pin list is PARTIAL rather than the package's 144: it names the pins a binding or a pin-map row reaches -- PC1 among them, as the motion sensor's chip select, and PB0/PB7/PB14/PC13 as a second carrier's three user LEDs and its user button, which UM1670 Rev 6 Table 7 gives as the NCS_MEMS_SPI net and the board schematic rev D-02 lands on that device's own select pin. DS9405 Rev 13 Table 12 carries a row for every one of them, and UM1670 Rev 6 Table 7 gives each an LQFP144 pin number -- PA9 is 101 and PA10 is 102, while the memory controller's thirty-eight run from PF0 at pin 10 to PE1 at pin 142, which is why no arithmetic over pin numbers reproduces this list either."

[[parts]]
part = "stm32f439zi"
package = "LQFP144"
flash = 0x200000
ram = 0x30000
pins = [
    "PB0", "PB7", "PB14",
    "PC13",
]
source = "STM32F437xx/STM32F439xx datasheet DS9484 Rev 14 (production data, 241 pages): Table 1 lists STM32F439ZI among the part numbers of the STM32F439xx line, and the ordering scheme in Section 8 gives I = 2048 Kbytes of Flash memory. The pin-count letter does NOT settle the package on its own -- that same scheme reads Z = 143 and 144 pins, covering both the LQFP144 and the WLCSP143 -- so what settles it is the package letter T = LQFP, and UM1974 Rev 11's product history names this carrier's part STM32F439ZIT6. The flash is TWO BANKS, not one: the datasheet's own feature list gives up to 2 MB of flash memory organized into two banks allowing read-while-write, which is the arithmetic a firmware and the image it loads have to tile. The SRAM figure is DERIVED and the datasheet's headline number is the wrong one to take: Section 3.6 states up to 256 Kbytes of system SRAM INCLUDING 64 Kbytes of CCM data RAM, plus 4 Kbytes of backup SRAM, and the CCM sits at 0x10000000 on the Cortex-M4's own data bus where a linker script cannot join it to the rest. RM0090 Rev 22 gives the remainder as SRAM1 112 KB plus SRAM2 16 KB plus SRAM3 64 KB, running 0x20000000 to 0x2002FFFF with no gap, which is the 192 KB stated here; a script that took 256 would overrun the contiguous region by exactly the size of the block it cannot reach. That is the same derivation the stm32f429zi row states at length, reached independently from this part's own documents rather than copied across. The four pins are DS9484 Table 10's LQFP144 column, which is the second of the eight package columns that table carries side by side: PC13 is pin 7, PB0 is 46, PB14 is 75 and PB7 is 137. The MB1137 schematic's own MCU symbol carries those same four numbers against those same four names, so the carrier's footprint and this part's package agree on every one -- a check nothing derives, since no arithmetic relates 7, 46, 75 and 137."
