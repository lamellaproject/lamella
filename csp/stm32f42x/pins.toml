# --- FMC bank address: two lines that share their pins with two address lines ------------------

[[pins]]
pin = "PG4"
function = "AF12"
instance = "fmc"
signal = "ba0"
source = "DS9405 Rev 13 Table 12 page 81: PG4's AF12 cell reads FMC_A14/FMC_BA0 -- one cell naming two signals, and an SDRAM configuration makes it the bank-address line"

[[pins]]
pin = "PG5"
function = "AF12"
instance = "fmc"
signal = "ba1"
source = "DS9405 Rev 13 Table 12 page 81: PG5's AF12 cell reads FMC_A15/FMC_BA1 -- the bank-address reading, as for PG4"

# --- FMC control: byte lanes, the three SDRAM strobes, clock, clock enable and chip select -----
#
# THE LAST THREE ARE THE ONLY ROWS HERE THAT NAME A CONTROLLER BANK, and they name the SECOND one.
# A device's chip select and clock enable are per-bank signals, so these three rows are the whole
# difference between a memory that answers at one window and one that answers at another; the other
# thirty-five signals are shared by both banks and say nothing about which is wired.

[[pins]]
pin = "PE0"
function = "AF12"
instance = "fmc"
signal = "nbl0"
source = "DS9405 Rev 13 Table 12 page 79: PE0's AF12 cell is FMC_NBL0"

[[pins]]
pin = "PE1"
function = "AF12"
instance = "fmc"
signal = "nbl1"
source = "DS9405 Rev 13 Table 12 page 79: PE1's AF12 cell is FMC_NBL1"

[[pins]]
pin = "PF11"
function = "AF12"
instance = "fmc"
signal = "sdnras"
source = "DS9405 Rev 13 Table 12 page 81: PF11's AF12 cell is FMC_SDNRAS"

[[pins]]
pin = "PG15"
function = "AF12"
instance = "fmc"
signal = "sdncas"
source = "DS9405 Rev 13 Table 12 page 82: PG15's AF12 cell is FMC_SDNCAS"

[[pins]]
pin = "PG8"
function = "AF12"
instance = "fmc"
signal = "sdclk"
source = "DS9405 Rev 13 Table 12 page 81: PG8's AF12 cell is FMC_SDCLK"

[[pins]]
pin = "PC0"
function = "AF12"
instance = "fmc"
signal = "sdnwe"
source = "DS9405 Rev 13 Table 12 page 77: PC0's AF12 cell is FMC_SDNWE. The signal is also on PH5 (page 82); which one exists is a board fact. Unlike its two neighbors below it belongs to NEITHER bank -- one write-enable line serves both"

[[pins]]
pin = "PB5"
function = "AF12"
instance = "fmc"
signal = "sdcke1"
source = "DS9405 Rev 13 Table 12 page 76: PB5's AF12 cell is FMC_SDCKE1. The signal is also on PH7 (page 83). Bank 1's clock enable is a different pin entirely -- SDCKE0 is on PC3 and PH2 -- so the two banks cannot be confused at the mux"

[[pins]]
pin = "PB6"
function = "AF12"
instance = "fmc"
signal = "sdne1"
source = "DS9405 Rev 13 Table 12 page 76: PB6's AF12 cell is FMC_SDNE1. The signal is also on PH6 (page 82). SDNE1 and SDCKE1 together are what make a fitted device the controller's SDRAM BANK 2 rather than its bank 1, whose SDNE0 is on PC2 and PH3. PB6's AF9 cell is CAN2_TX and its AF7 cell is USART1_TX, so a wrong function number here leaves a driven pin rather than a dead one and the memory is simply never selected"
