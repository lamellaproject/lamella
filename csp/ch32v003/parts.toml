pins = ["PD6"]
source = "CH32V003 Datasheet V1.8 chapter 4 ordering information (SOP16, 3.9*10.0mm body, 1.27mm pitch, order model CH32V003A4M6). Table 2-1 gives PD6 as SOP16 pin 10."

