# BLOCK layout: the CH32V003 reset and clock control block. Transcribed from the CH32V003
# Reference Manual V1.9 (WCH), sections 3.4.1 through 3.4.8, with the document open.
#
# THE CLOCK-ENABLE REGISTERS AND THE RESET CLOCK STATE. A GPIO port does nothing until its clock is
# enabled, so the enable registers are what a board's first control line needs. Beyond that, any
# program that times anything -- a delay, a pulse, a baud rate -- needs to know what the core is
# actually running at before a clock plan has run, and that is what the oscillator and prescaler
# registers below state. The PLL's own configuration and the reset/interrupt registers join when a
# clock plan or a driver needs them.
#
# THE ONE FACT TO CARRY AWAY: HCLK AT RESET IS 8 MHz, NOT 24 MHz. The core comes up on the internal
# 24 MHz oscillator with the bus prescaler ALREADY DIVIDING BY THREE, because HPRE's reset value is
# 0010b rather than zero. A cycle count scaled for 24 MHz runs three times slow, and nothing about
# it looks wrong -- the program works, at the wrong speed.

[table]
kind = "block"
family = "ch32v003"
block = "rcc"
sources = [
    "CH32V003 Reference Manual V1.9 (WCH): Table 3-1 register list, section 3.4.1 RCC_CTLR, section 3.4.2 RCC_CFGR0, section 3.4.7 RCC_APB2PCENR, section 3.4.8 RCC_APB1PCENR",
    "CH32V003 Reference Manual V1.9 (WCH) section 3.3.2 (HSI is generated by the internal 24 MHz RC oscillator), section 3.3.5.1 (after a controller reset the default HSI clock is selected as the system clock source) and section 3.3.5.2 (HCLK is SYSCLK through the HPRE prescaler)",
]
notes = [
    "A peripheral's clock is off at reset: both enable registers reset to 0x00000000, so the very first thing any driver on this part does is set its bit here. Section 3.4 states the general rule that a module's registers are unreachable while its clock is off.",
    "THE GAPS IN THE BIT NUMBERING ARE THE PARTS THAT ARE NOT THERE. APB2PCENR bit 1 and bit 3 are Reserved, sitting exactly where the enables for a port B and a second port would fall on the larger family members this register's layout is shared with. So the enable bits are NOT the port index: PA is bit 2, PC is bit 4, PD is bit 5. A driver that computed 'bit = port number' would enable the wrong peripheral and read a port that never woke.",
    "HPRE CARRIES TWO ENCODINGS IN ONE FOUR-BIT FIELD, and its reset value sits in the half a reader is least likely to check. Codes 0000 to 0111 divide by the code PLUS ONE -- 0000 is no division, 0010 is division by three, 0111 is division by eight -- while codes 1000 to 1111 divide by powers of two from 2 to 256. So two codes mean division by two, two more mean division by eight, and the field cannot be read as one arithmetic rule. The layout resembles a widely known ARM part's, where the top bit distinguishes 'not divided' from 'divided' and every 0xxx code means no division at all; read that way, this part's reset value 0010b says no division when it says division by three.",
    "THE RESET VALUE OF RCC_CTLR CANNOT BE WRITTEN DOWN, and that is a property of the part rather than a gap here. Its HSICAL field is a factory calibration loaded at startup and differs per device, so a driver that wants to change one bit of this register must read-modify-write it; composing a whole word would overwrite a trim the part was calibrated with.",
    "ADCPRE IS A FIVE-BIT FIELD THAT IS NOT FIVE CONTIGUOUS BITS. The manual numbers it {13:11, 15:14}: its low three bits are at [13:11] and its high two at [15:14], with the field's own bit order running across the split. It is stated below as the two pieces the silicon actually has rather than as one field, because a contiguous five-bit mask at either position would address bits that belong to something else.",
]

[registers.CTLR]
offset = 0x00
width = 32
fields = { HSION = [0, 1], HSIRDY = [1, 1], HSITRIM = [3, 5], HSICAL = [8, 8], HSEON = [16, 1], HSERDY = [17, 1], HSEBYP = [18, 1], CSSON = [19, 1], PLLON = [24, 1], PLLRDY = [25, 1] }
notes = "Clock control. At reset HSION and HSIRDY are both 1 -- the internal 24 MHz oscillator is running and stable before any code executes -- HSITRIM is 10000b (16, the value that trims HSI to 24 MHz plus or minus 1%, moving about 60 kHz per step), and HSICAL holds a per-device factory calibration. HSEON, HSEBYP, CSSON and PLLON reset to 0. Clearing HSION or HSEON takes six cycles of that clock before the matching ready bit falls, so a poll that expects the flag to drop immediately sees a clock that is still running."

[registers.CFGR0]
offset = 0x04
width = 32
fields = { SW = [0, 2], SWS = [2, 2], HPRE = [4, 4], ADCPRE_LOW = [11, 3], ADCPRE_HIGH = [14, 2], PLLSRC = [16, 1], MCO = [24, 3] }
notes = "Clock configuration. SW selects the system clock source (00 HSI, 01 HSE, 10 PLL) and the read-only SWS reports the one in force; both reset to 00, so the system clock is HSI. HPRE divides SYSCLK into HCLK and RESETS TO 0010b, which is division by three -- see the encoding note on this table. PLLSRC picks the PLL's input (0 HSI undivided, 1 HSE undivided) and MCO picks what the clock-output pin carries (0xx none, 100 SYSCLK, 101 HSI, 110 HSE, 111 PLL); both reset to 0. ADCPRE is split across two fields here because the silicon splits it."

[registers.APB2PCENR]
offset = 0x18
width = 32
fields = { AFIOEN = [0, 1], IOPAEN = [2, 1], IOPCEN = [4, 1], IOPDEN = [5, 1], ADC1EN = [9, 1], TIM1EN = [11, 1], SPI1EN = [12, 1], USART1EN = [14, 1] }
notes = "APB2 peripheral clock enable; 1 = module clock on. Reset 0x00000000. Bits 1, 3, [8:6], 10, 13 and [31:15] are Reserved."

[registers.APB1PCENR]
offset = 0x1C
width = 32
fields = { TIM2EN = [0, 1], WWDGEN = [11, 1], I2C1EN = [21, 1], PWREN = [28, 1] }
notes = "APB1 peripheral clock enable; 1 = module clock on. Reset 0x00000000."

[registers.AHBPCENR]
offset = 0x14
width = 32
notes = "AHB peripheral clock enable. Reset 0x00000004 -- NOT zero: one bit comes up already set, so this is the one enable register a driver must not assume it can build from scratch with a plain write."

[constants]
APB2PCENR_IOPD = 0x20
APB2PCENR_IOPC = 0x10
APB2PCENR_IOPA = 0x4

# THE RESET CLOCK, STATED AS ITS THREE PARTS AND THE RATE THEY PRODUCE, so the composition is
# checkable rather than a single number nobody can re-derive: the oscillator's frequency, the
# divisor its prescaler reset value selects, and the bus clock that leaves. A program timing
# anything before it has configured a clock is running at HCLK_RESET_HZ.
HSI_HZ = 24000000
CFGR0_HPRE_RESET = 0x2
HCLK_RESET_DIVISOR = 3
HCLK_RESET_HZ = 8000000
