# PARTS table for the nrf52833 family. The row's `pins` list is the aQFN73 package's whole GPIO set
# (pins_complete), which its product specification states twice, and the two agree.
#
# part id: the family-generic chip name (the rp2040 precedent -- the vendor's part IS
# nRF52833; the package variant letters follow from the datasheet when a binding needs them).
# Sizes are PS-exact: "512 kB flash and 128 kB RAM" (4452_021 v1.7 front matter; the
# INFO.FLASH/INFO.RAM enumerations state K512/K128).

[table]
kind = "parts"
family = "nrf52833"

[[parts]]
part = "nrf52833"
package = "aQFN73"
flash = 0x80000
ram = 0x20000
dp_idcode = 0x2BA01477
identity_source = "The debug port a BBC micro:bit v2 answers with, read through a CMSIS-DAP probe; the nRF flashing backend distinguishes a v1 from a v2 on it before erasing anything. 0x2ba01477 is Arm's M3/M4-class SW-DP and every STM32 M3 or M4 answers the same, so it narrows a search and names no part. The reading that names a Nordic die is FICR."
pins = ["P0.00-P0.31", "P1.00-P1.09"]
pins_complete = true
source = "nRF52833 PS 4452_021 v1.7 (512 kB flash / 128 kB RAM; INFO K512/K128). The pin list is the aQFN73 package's WHOLE GPIO set, stated twice in the specification and the two agree: the feature list's '42 general purpose I/O pins', and section 7.1.1's aQFN73 ball assignments (Figure 194 and Table 62), which name P0.00 to P0.31 and P1.00 to P1.09 and no other GPIO. The BBC micro:bit v2 carries this package."
