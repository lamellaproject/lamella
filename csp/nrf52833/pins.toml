# PIN map: pin x function -> (instance, signal) for the nRF52833.
# PARTIAL, evidence-only. The nRF has no mux-table functions: a peripheral's
# PSEL registers claim any GPIO, so the function id here is the claiming block ("twi") and
# the signal is the PSEL register the pin routes through.

[table]
kind = "pins"
family = "nrf52833"
sources = ["Schematic (I2C_INT: SCL P0.08 / SDA P0.16, 1k pulls R51/R52)"]

[[pins]]
pin = "P0.08"
function = "twi"
instance = "twi0"
signal = "psel_scl"
source = "Schematic (I2C_INT SCL); PSEL_SCL = 8 on this pin"

[[pins]]
pin = "P0.16"
function = "twi"
instance = "twi0"
signal = "psel_sda"
source = "Schematic (I2C_INT SDA); PSEL_SDA = 16 on this pin"

[[pins]]
pin = "P0.17"
function = "spi"
instance = "spi2"
signal = "psel_sck"
source = "PS 7.1.1 aQFN73 ball AD12 = P0.17, general purpose I/O; PSEL.SCK takes (port << 5) | pin, so this pin routes as 17"

[[pins]]
pin = "P0.13"
function = "spi"
instance = "spi2"
signal = "psel_mosi"
source = "PS 7.1.1 aQFN73 ball AD8 = P0.13, general purpose I/O; PSEL.MOSI routes it as 13"

[[pins]]
pin = "P0.01"
function = "spi"
instance = "spi2"
signal = "psel_miso"
source = "PS 7.1.1 aQFN73 ball F2 = P0.01, general purpose I/O (also XL2, the 32.768 kHz crystal pin); PSEL.MISO routes it as 1"
