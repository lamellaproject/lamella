# BLOCK layout: the nRF52833 SPI, the LEGACY polled SPI master. It is chosen over SPIM for the
# reason the legacy TWI is chosen over TWIM: SPIM moves data only through EasyDMA buffer pointers,
# which the Mmio register seam does not hand out, while this master is register-per-byte (TXD/RXD)
# with one event, the polled shape a table-driven driver wants. The product specification marks each
# instance deprecated and describes the section as added for legacy support; it is fully specified
# and instantiated on this part.
#
# The peripheral SHARES its ID and its registers with the other serial personalities at the same
# base: SPI0 with SPIM0, SPIS0, TWI0, TWIM0 and TWIS0 (ID 3), SPI1 likewise (ID 4), and SPI2 with
# SPIM2 and SPIS2 only (ID 35). ENABLE selects the personality, and disabling a sibling resets none of
# the shared registers, so a bring-up writes every register it relies on (6.22.1.2).
#
# The register map transcribes 6.22.2 with the document open. Every bit position was placed from the
# printed table's column coordinates, and the INTENSET and INTENCLR tables were required to agree.

[table]
kind = "block"
family = "nrf52833"
block = "spi"
sources = [
    "Nordic nRF52833 Product Specification 4452_021 v1.7, section 6.22 SPI -- Serial peripheral interface master (pp. 614-621): 6.22.1 functional description, Table 43 SPI modes, Table 44 GPIO configuration, 6.22.1.2 shared resources, 6.22.1.3 transaction sequence, 6.22.2 registers (EVENTS_READY, INTENSET, INTENCLR, ENABLE, PSEL.SCK, PSEL.MOSI, PSEL.MISO, RXD, TXD, FREQUENCY, CONFIG), 6.22.3 electrical specification; Table 3 instantiation (pp. 22-23)",
]
notes = [
    "Config envelope: FREQUENCY is enumerated -- 125 kbps, 250 kbps, 500 kbps, 1, 2, 4 and 8 Mbps, and nothing between. It resets to 250 kbps (0x04000000), not to the slowest rate. The rate is timed from HFCLK, and its accuracy follows the HFCLK source (6.22.2.10).",
    "Frames are 8 bits. CONFIG selects the bit order (ORDER: 0 most significant bit first, 1 least significant first) and SPI modes 0 to 3 (CPOL bit 2 and CPHA bit 1: mode 0 = 0,0; mode 1 = 0,1; mode 2 = 1,0; mode 3 = 1,1, Table 43).",
    "The master drives no chip select; a GPIO the caller owns selects the slave (6.22.1).",
    "PSEL.SCK, PSEL.MOSI and PSEL.MISO are used only while the master is enabled and are retained only in ON mode, and must be written only while it is DISABLED (6.22.1.1): route pins first, ENABLE last.",
    "Table 44 GPIO configuration, set before ENABLE and held while enabled: SCK an output whose OUT level equals CONFIG.CPOL, MOSI an output at 0, MISO an input. SCK's input buffer must stay connected for the master to work, and PIN_CNF resets with the buffer disconnected, so the bring-up writes it (6.22.1.1). PIN_CNF_SPI_OUTPUT and PIN_CNF_SPI_INPUT are those two PIN_CNF words: DIR output or input, INPUT connected, no pull, standard drive, no sensing (gpio block, PIN_CNF[n]).",
    "TXD and RXD are double buffered: a second byte may be written to TXD immediately after the first, and the master sends them in order. READY fires each time a byte is moved into RXD; a byte waiting behind it moves in, raising READY again, only after RXD is read. The master stops when TXD and its second buffer are both empty (6.22.1.3).",
    "READY is raised a short delay after the last SCK period of a byte, so a driver clears it on every byte, even when the received data is not used (6.22.1.3).",
    "RXD is cleared on read and advances the receive buffer: read it exactly once per READY.",
    "High bit rates may need the pins set to high drive (6.22.3, footnote 27); the maximum usable rate also depends on the slave's timing.",
]

[registers.EVENTS_READY]
offset = 0x108
width = 32
fields = { EVENTS_READY = [0, 1] }
notes = "1 = a byte was moved into RXD (TXD byte sent and RXD byte received). Write 0 to clear, on every byte."

[registers.INTENSET]
offset = 0x304
width = 32
fields = { READY = [2, 1] }
notes = "Write 1 to enable the READY interrupt. A polled driver leaves it disabled."

[registers.INTENCLR]
offset = 0x308
width = 32
fields = { READY = [2, 1] }
notes = "Write 1 to disable the READY interrupt; bit 2 in both INTENSET and INTENCLR (6.22.2.2, 6.22.2.3)."

[registers.ENABLE]
offset = 0x500
width = 32
fields = { ENABLE = [0, 4] }
notes = "0 = disabled, 1 = SPI master enabled. One register shared with every personality at this base, so the value selects the SPI and writing 0 disables them all."

[registers.PSEL_SCK]
offset = 0x508
width = 32
fields = { PIN = [0, 5], PORT = [5, 1], CONNECT = [31, 1] }
notes = "Reset 0xFFFFFFFF (disconnected). CONNECT 0 = connected. Write only while disabled."

[registers.PSEL_MOSI]
offset = 0x50C
width = 32
fields = { PIN = [0, 5], PORT = [5, 1], CONNECT = [31, 1] }
notes = "Reset 0xFFFFFFFF (disconnected). Write only while disabled."

[registers.PSEL_MISO]
offset = 0x510
width = 32
fields = { PIN = [0, 5], PORT = [5, 1], CONNECT = [31, 1] }
notes = "Reset 0xFFFFFFFF (disconnected). Write only while disabled."

[registers.RXD]
offset = 0x518
width = 32
fields = { RXD = [0, 8] }
notes = "The received byte. Cleared on read; the buffer pointer advances."

[registers.TXD]
offset = 0x51C
width = 32
fields = { TXD = [0, 8] }
notes = "The next byte to send. Writing it starts a transfer when the master is idle."

[registers.FREQUENCY]
offset = 0x524
width = 32
fields = { FREQUENCY = [0, 32] }
notes = "Enumerated; see the FREQUENCY_* constants. Resets to 250 kbps."

[registers.CONFIG]
offset = 0x554
width = 32
fields = { ORDER = [0, 1], CPHA = [1, 1], CPOL = [2, 1] }
notes = "ORDER 1 = least significant bit first. CPHA 1 = sample on the trailing edge. CPOL 1 = clock idles high."

[constants]
ENABLE_DISABLED = 0
ENABLE_SPI = 1
FREQUENCY_K125 = 0x02000000
FREQUENCY_K250 = 0x04000000
FREQUENCY_K500 = 0x08000000
FREQUENCY_M1 = 0x10000000
FREQUENCY_M2 = 0x20000000
FREQUENCY_M4 = 0x40000000
FREQUENCY_M8 = 0x80000000
PIN_CNF_SPI_OUTPUT = 0x1
PIN_CNF_SPI_INPUT = 0x0

[parameters]
tx_byte = "The byte to send."

# One full-duplex byte: send it, wait for its echo in RXD, clear READY, take the byte.

[[sequences.transfer_byte]]
op = "write"
reg = "TXD"
value = "$tx_byte"

[[sequences.transfer_byte]]
op = "poll"
reg = "EVENTS_READY"
mask = 0x1
note = "the byte clocked out and the received byte reached RXD"

[[sequences.transfer_byte]]
op = "write"
reg = "EVENTS_READY"
value = 0x0

[[sequences.transfer_byte]]
op = "read"
reg = "RXD"
mask = 0xFF
note = "exactly one read per READY"
