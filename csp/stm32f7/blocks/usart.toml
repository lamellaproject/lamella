# BLOCK layout: the STM32F7 USART, asynchronous use. Offsets are instance-base-relative; instance
# bases + RCC enable routing live in ../instances.toml. Every register is 32-bit word-accessible
# (no sub-word access).
#
# Cross-block bring-up (RCC enables, GPIO muxing) is DRIVER code per language; only block-local
# sequences ride here.
#
# THIS IS THE SAME USART DESIGN OTHER ST LINES CARRY, and every offset and field below was still
# read from THIS part's own manual. ST shares the design but not bit-for-bit: the design is shared
# but the lines are not bit-for-bit identical -- one line implements CR3.UCESM where another
# reserves that bit, and some fields exist only on particular part numbers. The register map and
# every field a polled 8N1 driver touches did agree here, which is a result rather than an
# assumption.

[table]
kind = "block"
family = "stm32f7"
block = "usart"
sources = [
    "STM32F7 reference manual RM0385 Rev 9: USART register map + per-register descriptions (section 31.8) -- CR1 0x00, CR2 0x04, CR3 0x08, BRR 0x0C, ISR 0x1C, ICR 0x20, RDR 0x24, TDR 0x28; bit positions from the per-bit descriptions (CR1 UE 0, RE 2, TE 3, PS 9, PCE 10, M0 12, OVER8 15, M1 28; CR2 STOP 13:12; ISR RXNE 5, TC 6, TXE 7)",
]
notes = [
    "8N1 = CR1.M[1:0] = 00 (8 data bits), CR2.STOP = 00 (1 stop bit), CR1.PCE = 0 (no parity), CR1.OVER8 = 0 (16x oversampling). All are reset values, so CR1 = UE | TE | RE is a complete 8N1 config.",
    "M/OVER8/PS may only be written while UE = 0, but their 8N1 values are the reset values, so no separate disabled-write is needed.",
    "TX: poll ISR.TXE (transmit data register empty), write the byte to TDR. RX: poll ISR.RXNE, read RDR. ISR.TC = transmission complete (the shift register has drained), which is the flag to wait on before cutting power or changing the baud rate.",
    "Word length is split across two non-adjacent bits: M[1:0] = {M1 (bit 28), M0 (bit 12)}. 00 selects 8 data bits.",
]

[registers.CR1]
offset = 0x0
width = 32
fields = { UE = [0, 1], RE = [2, 1], TE = [3, 1], IDLEIE = [4, 1], RXNEIE = [5, 1], TCIE = [6, 1], TXEIE = [7, 1], PEIE = [8, 1], PS = [9, 1], PCE = [10, 1], WAKE = [11, 1], M0 = [12, 1], OVER8 = [15, 1], M1 = [28, 1] }
notes = "UE = USART enable, TE/RE = transmitter/receiver enable. Word length M[1:0] = {M1(28), M0(12)}: 00 = 8 data bits. OVER8 0 = 16x oversampling. PCE 0 = no parity."

[registers.CR2]
offset = 0x4
width = 32
fields = { STOP = [12, 2] }
notes = "STOP[1:0] at bits 13:12: 00 = 1 stop bit, 10 = 2 stop bits. Reset 00 is 8N1's one stop bit."

[registers.CR3]
offset = 0x8
width = 32
fields = { EIE = [0, 1], HDSEL = [3, 1], DMAR = [6, 1], DMAT = [7, 1], RTSE = [8, 1], CTSE = [9, 1] }
notes = "Flow/DMA control. 0 for a basic polled 8N1 (no RTS/CTS, no DMA, no half-duplex)."

[registers.BRR]
offset = 0xC
width = 32
fields = { BRR = [0, 16] }
notes = "Baud rate. With OVER8 = 0, BRR = USARTDIV = round(fck / baud). fck is the SELECTED USART kernel clock rather than a fixed one, and the APB it sits on differs by instance -- USART1 is on APB2 where USART2/3 and the UARTs are on APB1. So the rate is a plan fact established per board; this block states the arithmetic only."

[registers.ISR]
offset = 0x1C
width = 32
fields = { PE = [0, 1], FE = [1, 1], NF = [2, 1], ORE = [3, 1], IDLE = [4, 1], RXNE = [5, 1], TC = [6, 1], TXE = [7, 1], BUSY = [16, 1], TEACK = [21, 1], REACK = [22, 1] }
notes = "Status. TXE = TDR empty (room to write), TC = transmission complete, RXNE = RDR holds a received byte."

[registers.ICR]
offset = 0x20
width = 32
fields = { PECF = [0, 1], FECF = [1, 1], NCF = [2, 1], ORECF = [3, 1], IDLECF = [4, 1], TCCF = [6, 1] }
notes = "Interrupt flag clear, write-1-to-clear the matching ISR flag."

[registers.RDR]
offset = 0x24
width = 32
fields = { RDR = [0, 9] }
notes = "Receive data (read). Low 8 bits at 8-bit word length; bit 8 is the 9th data/parity bit."

[registers.TDR]
offset = 0x28
width = 32
fields = { TDR = [0, 9] }
notes = "Transmit data (write once TXE = 1). Low 8 bits at 8-bit word length."

[parameters]
baud = "16x oversampling (OVER8 = 0): BRR = round(f_ck / baud). The rate comes from the board plan; the divisor is generated."
tx_byte = "the byte to transmit (write to TDR once ISR.TXE is set)."

[[sequences.tx_byte]]
op = "poll"
reg = "ISR"
mask = 0x80
note = "TXE: the transmit data register has room"

[[sequences.tx_byte]]
op = "write"
reg = "TDR"
value = "$tx_byte"

[[sequences.rx_poll]]
op = "poll"
reg = "ISR"
mask = 0x20
note = "RXNE: a byte has been received"

[[sequences.rx_poll]]
op = "read"
reg = "RDR"
mask = 0xFF
