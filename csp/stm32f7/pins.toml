# PIN map: pin x function -> (instance, signal) for the STM32F7.
# PARTIAL, evidence-only. Function ids are the ST alternate-function numbers (AF0..AF15) that the
# AFRL/AFRH nibbles select.
#
# THE ALTERNATE-FUNCTION TABLE IS SIXTEEN FUNCTION COLUMNS WIDE, and a cell means nothing without
# its column header: the header is the only thing that says which AF NUMBER the signal belongs to.
#
# AND THE NUMBER IS NOT UNIFORM PER PERIPHERAL, WHICH IS WHY THAT MATTERS HERE. The quad-SPI
# interface appears in TWO function columns on this part: AF9 carries its clock and its four data
# lines, and AF10 carries its chip select. Muxing all six at AF9 leaves chip select on a CAN
# transmit function instead -- a pin that drives, so nothing is obviously dead, and the flash is
# simply never selected. The memory controller, by contrast, IS uniform at AF12 across all
# thirty-eight of its signals below -- but a number belongs to a CELL, so a thirty-ninth signal has
# to be taken from its own pin's row rather than from that uniformity.

[table]
kind = "pins"
family = "stm32f7"
sources = [
    "STM32F745xx/STM32F746xx datasheet DS10916 Rev 5, Table 12 'alternate function mapping' (pages 78-87): the AF7 column is headed SPI2/3/USART1/2/3/UART5/SPDIFRX, AF4 is I2C1/2/3/4/CEC, AF9 is CAN1/2/TIM12/13/14/QUADSPI/LCD, AF10 is SAI2/QUADSPI/OTG2_HS/OTG1_FS, and AF12 is FMC/SDMMC1/OTG2_FS",
    "Every quad-SPI, memory-controller and I2C row here was also exercised on silicon: the flash answered its JEDEC identity and executed code from its memory-mapped window, all eight accessible Mbytes of the SDRAM were swept and held across a refresh, and a device on the I2C bus reported its own part number",
]
notes = [
    "A cell may name more than one signal. The memory controller's bank-address lines share their pins with two of its high address lines (PG4 is FMC_A14/FMC_BA0), and which one the pin carries is decided by the memory type the controller is configured for, not by the mux. The SDRAM rows below state the bank-address reading, which is what an SDRAM configuration makes it.",
    "The rows are the pins a board here wires, not every cell the part offers. Several signals have alternatives -- SDCKE0 is on PC3 and PH2, and the quad-SPI data lines are on PC9/PC10 as well as PD11/PD12 -- and the board picks; a pin map that listed both would have to be read with a board file in the other hand.",
]

# --- USART1: the virtual COM port ------------------------------------------------------------

[[pins]]
pin = "PA9"
function = "AF7"
instance = "usart1"
signal = "tx"
source = "DS10916 Rev 5 Table 12: PA9's AF7 cell is USART1_TX. Corroborated by Table 10 (pin and ball definition), which lists USART1_TX among PA9's alternate functions"

[[pins]]
pin = "PB7"
function = "AF7"
instance = "usart1"
signal = "rx"
source = "DS10916 Rev 5 Table 12: PB7's AF7 cell is USART1_RX"

# --- QUADSPI: five signals at AF9 and ONE AT AF10 ---------------------------------------------

[[pins]]
pin = "PB2"
function = "AF9"
instance = "quadspi"
signal = "clk"
source = "DS10916 Rev 5 Table 12 page 79: PB2's AF9 cell is QUADSPI_CLK"

[[pins]]
pin = "PB6"
function = "AF10"
instance = "quadspi"
signal = "bk1_ncs"
source = "DS10916 Rev 5 Table 12 page 79: PB6's AF10 cell is QUADSPI_BK1_NCS. THE ONLY AF10 OF THE SIX -- PB6's AF9 cell is CAN2_TX, so a uniform AF9 mux drives a CAN transmitter onto chip select and the flash is never addressed"

[[pins]]
pin = "PD11"
function = "AF9"
instance = "quadspi"
signal = "bk1_io0"
source = "DS10916 Rev 5 Table 12 page 82: PD11's AF9 cell is QUADSPI_BK1_IO0"

[[pins]]
pin = "PD12"
function = "AF9"
instance = "quadspi"
signal = "bk1_io1"
source = "DS10916 Rev 5 Table 12 page 82: PD12's AF9 cell is QUADSPI_BK1_IO1"

[[pins]]
pin = "PE2"
function = "AF9"
instance = "quadspi"
signal = "bk1_io2"
source = "DS10916 Rev 5 Table 12 page 83: PE2's AF9 cell is QUADSPI_BK1_IO2"

[[pins]]
pin = "PD13"
function = "AF9"
instance = "quadspi"
signal = "bk1_io3"
source = "DS10916 Rev 5 Table 12 page 82: PD13's AF9 cell is QUADSPI_BK1_IO3. The four data lines are NOT in pin order -- IO2 sits in another port entirely, between IO1 and IO3"

