# PARTS table for the stm32f7 family. A part's `pins` list is its package's whole GPIO set, read
# off the datasheet's ballout, and says so with `pins_complete`: a pin that is not listed is not
# on the part, and is refused rather than assumed.
#
# ram: SRAM1 only. This part's RAM is three banks that happen to ABUT -- DTCM (64 KB) at
# 0x20000000, SRAM1 (240 KB) at 0x20010000, SRAM2 (16 KB) at 0x2004C000, 320 KB in one unbroken
# span -- but they are different memories on different buses: DTCM is tightly coupled to the core
# and is not on the bus matrix for every master. The row states the main internal SRAM the manual
# names; the other two banks are stated when the schema describes banks and something consumes it.

[table]
kind = "parts"
family = "stm32f7"
sources = [
    "STM32F7 reference manual RM0385 Rev 9: memory map -- DTCM (64 KB) 0x20000000-0x2000FFFF, SRAM1 (240 KB) 0x20010000-0x2004BFFF, SRAM2 (16 KB) 0x2004C000-0x2004FFFF; 2.1 names SRAM1 the 'main internal SRAM'",
    "STM32F745xx/STM32F746xx datasheet DS10916 Rev 5: the ordering-information scheme -- pin count N = 216 pins, flash size G = 1024 Kbytes, package H = TFBGA -- which is what decodes the STM32F746NGH6 order code",
]

[[parts]]
part = "stm32f746ng"
package = "216-pin TFBGA"
flash = 0x100000
ram = 0x3C000
source = "DS10916 Rev 5 ordering information (N = 216 pins, G = 1024 Kbytes flash, H = TFBGA) + RM0385 Rev 9 memory map (SRAM1 240 KB). The pin list is the package's complete GPIO set, every pad DS10916 Rev 5 figure 18 (the STM32F74xNx TFBGA216 ballout) draws: ports A to J whole and PK0 to PK7, 168 pads, as many as the datasheet's features list gives the line at most ('up to 168 I/O ports with interrupt capability'). UM1907 Table 6 assigns pads of ports A, B, C, F, G, H and I to the board's Arduino connectors, each among the pads listed here."
# The package's WHOLE general-purpose I/O set: every pad figure 18 draws, so a pin missing here is
# missing from the part.
pins = [
    "PA0-PA15", "PB0-PB15", "PC0-PC15", "PD0-PD15", "PE0-PE15", "PF0-PF15", "PG0-PG15", "PH0-PH15", "PI0-PI15",
    "PJ0-PJ15",
    "PK0-PK7",
]
pins_complete = true
