# PIN map for the STM32L073: pin x function -> (instance, signal). Function ids are the ST
# alternate-function numbers AF0..AF7 that the AFRL and AFRH nibbles select.
#
#
#

[table]
kind = "pins"
family = "stm32l073"
sources = [
    "STM32L073x8/xB/xZ datasheet DS10685 Rev 7 table 17 (alternate functions port A): PA2 AF4 = USART2_TX, PA3 AF4 = USART2_RX, PA5 AF0 = SPI1_SCK",
    "STM32L0x3 reference manual RM0367 Rev 8 section 9.4.10 for the AF0..AF7 encoding",
]
notes = [
    "PA5 IS SPI1_SCK AND IS ALSO THE NUCLEO-L073RZ's GREEN USER LED, wired to that board's Arduino D13. The two uses are mutually exclusive and nothing in the chip reports the conflict. It is recorded here as a chip fact; the board file records the LED.",
    "PA13 and PA14 are SWDIO and SWCLK at AF0 and are held by the debug port. They carry no row because nothing binds them.",
    "PC13 CARRIES AN INTERRUPT ROW RATHER THAN AN ALTERNATE-FUNCTION ONE. An external interrupt is not muxed onto the pad: the pad stays a GPIO and SYSCFG routes it. So its `function` is EXTI and its `signal` is the line, and a consumer must not read the row as a mux setting.",
]

[[pins]]
pin = "PA2"
function = "AF4"
instance = "usart2"
signal = "tx"
source = "DS10685 Rev 7 table 17, port A row PA2, AF4 column = USART2_TX. The rest of the row: AF0 TIM21_CH1, AF1 LCD_SEG1, AF2 TIM2_CH3, AF3 TSC_G1_IO3, AF5 empty."

[[pins]]
pin = "PA3"
function = "AF4"
instance = "usart2"
signal = "rx"
source = "DS10685 Rev 7 table 17, port A row PA3, AF4 column = USART2_RX."


[[pins]]
pin = "PC13"
function = "EXTI"
instance = "exti"
signal = "line13"
source = "RM0367 Rev 8 section 10.2.7: EXTI line 13's source is selected by SYSCFG_EXTICR4's EXTI13 field, whose 0010 code selects PC[13]. The line number IS the pin index on this vendor, which the manual states rather than leaves to be derived. Delivered on NVIC position 7, EXTI[15:4], per table 55. This is the pad the NUCLEO-L073RZ wires its user button B1 to."

[[pins]]
pin = "PA5"
function = "AF0"
instance = "spi1"
signal = "sck"
source = "DS10685 Rev 7 table 17, port A row PA5, AF0 column = SPI1_SCK. On the NUCLEO-L073RZ this pad is also the green user LED LD2 on header signal D13, so a design driving the LED cannot also clock SPI1 through it."
