# The SAML1X Generic Clock Controller block: the channel-routing registers the peripheral bring-up
# paths touch (partial, append-only). Offsets are GCLK-base-relative; the base lives in
# ../instances.toml. WHICH generator runs at WHAT rate is a PLAN fact (board.toml), never here.
#
# TWO ARRAYS, INDEXED BY DIFFERENT THINGS -- GENCTRL[n] by GENERATOR and PCHCTRL[m] by PERIPHERAL
# CHANNEL. A peripheral is clocked by writing ITS channel with the generator number it should
# listen to, and both numbers are small integers in the same range. The SAM D21 line has neither
# array: it has ONE CLKCTRL register whose ID field selects the channel, so there the channel id is
# a value and here it is an address.

[table]
kind = "block"
family = "saml1x"
block = "gclk"
sources = [
    "SAM L10/L11 Family Data Sheet DS60001513J section 18.8.3 (Peripheral Channel Control): 'Name: PCHCTRLm', 'Offset: 0x80 + m*0x04 [m=0..20]', with WRTLOCK at bit 7, CHEN at bit 6 and GEN[3:0] at bits 3:0",
    "DS60001513J Table 18-9 (PCHCTRLm Mapping), whose printed rows run 0 to 20 and independently corroborate the array bound stated in the offset heading",
]
notes = [
    "THE ARRAY BOUND IS THIS FAMILY'S AND IT IS THE SMALLEST ON THIS ARM: m runs to 20 here, to 28 on the saml22, to 34 on the saml21 and samr30, to 45 on the samc21 and to 47 on the same54. Five families, five bounds. The stride and the bound are both printed in the offset heading rather than derived, and a bound carried across would let a consumer address a channel the part does not have.",
    "THIS FAMILY HAS FIVE GENERIC CLOCK GENERATORS, 0 THROUGH 4, where its relatives have more. Table 1-1's 'GCLK I/Os' column gives 5 for the 32-pin parts and 4 for the 24-pin ones. Nothing here declares a generator -- see the declared subset below -- and the count is recorded because PCHCTRL.GEN is a 4-bit field that can name generators this part does not have.",
    "A CHANNEL IS NOT ENABLED BY SELECTING A GENERATOR. PCHCTRL.GEN chooses which generator feeds the channel and PCHCTRL.CHEN turns the channel on; writing GEN alone leaves the peripheral unclocked while the register reads back the generator that was asked for.",
    "WRTLOCK IS ONE-WAY. Once set, further writes to that channel are discarded and the generator it names is locked with it. A driver that writes the whole register without masking can lock a peripheral's clock for the life of the power cycle.",
    "DECLARED SUBSET: GENCTRL is NOT transcribed. Nothing here configures a generator -- a driver selecting a peripheral's generator is choosing among generators a clock plan has already set up -- and an undeclared register cannot be silently mis-strided.",
]

[registers.PCHCTRL0]
offset = 0x80
width = 32
fields = { GEN = [0, 4], CHEN = [6, 1], WRTLOCK = [7, 1] }
notes = "Element 0 of the peripheral channel array; element m is at 0x80 + m*0x04, for m up to 20. The instance rows carry each peripheral's channel id, so a driver names the peripheral it means rather than an integer."
