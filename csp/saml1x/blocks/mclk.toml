# The SAML1X Main Clock block: the peripheral-bus gate registers. Offsets are MCLK-base-relative;
# the base lives in ../instances.toml.
#
# THREE APB MASK REGISTERS ON THIS FAMILY, A THROUGH C -- the fewest on this arm. The samc21 has
# four and the saml21 five. There is no APBD and no APBE, and Table 12-1 agrees from the other
# side: it names AHB-APB Bridge A, B and C and stops. Which register gates an instance is still a
# per-instance fact and the instance rows carry `apb_mask_offset` for it -- PORT is in APBA and
# SERCOM0..2 are in APBC.

[table]
kind = "block"
family = "saml1x"
block = "mclk"
sources = [
    "SAM L10/L11 Family Data Sheet DS60001513J section 19.8 (MCLK Register Description), per-register Offset headings: AHBMASK 0x10, APBAMASK 0x14, APBBMASK 0x18, APBCMASK 0x1C",
    "DS60001513J sections 19.8.9 (APBA Mask) and 19.8.11 (APBC Mask) per-bit prose, one numbered paragraph per bit naming the peripheral it gates",
]
notes = [
    "PORT IS GATED FROM APBAMASK BIT 12 ON THIS FAMILY. Read from the per-bit prose and corroborated by Table 12-1's APB index column, which also reads 12. The SAM D21 line, the SAM C21 and the SAM L22 all gate PORT from an APB bit that is neither this register nor this number.",
    "SERCOM0..2 ARE APBCMASK BITS 1..3, NOT 0..2. Bit 0 is EVSYS, which also takes the base address ahead of SERCOM0. The numbering origin differs on every family here -- the SAM D21 line starts its SERCOMs at APBCMASK bit 2, the SAM C21 at bit 1, the SAM L21 at bit 0, and this family at bit 1 for a different reason than the C21's. A bit carried across produces a peripheral that never clocks while every register reads back what was written.",
    "THE BIT POSITIONS WERE TAKEN FROM THE PER-BIT PROSE, NOT FROM THE BIT-FIELD DIAGRAM. The diagram's rows extract with Access and Reset lines interleaved between the bit numbers and the names, which is how a name comes to sit under the wrong number; the numbered paragraphs each name one bit and one peripheral and cannot desynchronize.",
    "DECLARED SUBSET: APBBMASK is transcribed as a register with no fields, because it is part of the offset set a reader checks an address against and nothing below names a bit in it. AHBMASK likewise. APBBMASK bit 0 is IDAU on this family -- the TrustZone attribution unit -- which is present in the map for both parts and is not something this schema binds.",
]

[registers.AHBMASK]
offset = 0x10
width = 32
fields = { }
notes = "AHB bus clock gates. Transcribed for completeness of the offset set; no instance row names a bit in it today."

[registers.APBAMASK]
offset = 0x14
width = 32
fields = { PORT = [12, 1] }
notes = "APB-A gates, and on this family that includes PORT at bit 12. Table 12-1 marks PORT's APB clock 'Enabled at Reset: Y', so a GPIO driver that assumes the reset state is correct today; the bit is stated so that a consumer which ever gates it has the register rather than a guess."

[registers.APBBMASK]
offset = 0x18
width = 32
fields = { }
notes = "APB-B gates -- IDAU, DSU, NVMCTRL and HMATRIXHS on this family. No instance row names a bit in it today."

[registers.APBCMASK]
offset = 0x1C
width = 32
fields = { SERCOM0 = [1, 1], SERCOM1 = [2, 1], SERCOM2 = [3, 1] }
notes = "APB-C gates. SERCOM0..2 are bits 1..3; bit 0 is EVSYS. SERCOM2 is absent from the 24-pin packages -- see ../instances.toml -- and the field is declared because both parts this family holds are 32-pin. Read-modify-write in drivers, since other peripherals share the register."
