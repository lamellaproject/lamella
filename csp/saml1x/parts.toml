# The SAML1X parts table. ONE family holds BOTH the SAM L10 and the SAM L11, and that is the
# outcome of a check rather than a convenience. The vendor documents them in one book, and the
# book's own difference table settles it:
#
#     Table 1-2 (SAM L10/L11 Family Features), L10 -> L11
#         MPU                             1 -> 2
#         TrustZone for ARMv8-M           No -> Yes
#         Secure Boot                     No -> Yes
#         Address and Data Scrambling     TrustRAM -> TrustRAM, Data Flash
#         Secure Pin Multiplexing         No -> Yes
#         TrustRAM, DMA channels, EVSYS channels, EXTINT lines, TC, RTC   IDENTICAL
#
# NOT ONE OF THOSE ROWS ADDS, MOVES OR REMOVES A PERIPHERAL INSTANCE. Table 12-1 carries a single
# base-address column for both parts, and every base, IRQ line, generic-clock id and gate bit in
# ../instances.toml is shared. What the L11 adds is security BEHAVIOR on the same silicon map.
#
# THE NAME IS A WILDCARD BECAUSE THE PART LINE IS TWO. `csp/stm32f42x` is the precedent: it holds
# `stm32f429zi` and `stm32f439zi`, and nothing requires a part id to begin with its family id.
#
# THE ARCHITECTURE IS THE MCLK/PCHCTRL ONE AND NOT ONE ADDRESS FOLLOWS FROM THAT. This is the fifth
# family on that arm and the fifth distinct PORT base:
#
#     family      PORT          MCLK          GCLK
#     SAM D21     0x41004400    (SYSCTRL)     0x40000C00
#     SAM C21     0x41000000    0x40000800    0x40001C00
#     SAM L21     0x40002800    0x40000400    0x40001800
#     SAM L22     0x41006000    0x40000400    0x40001800
#     SAM L10/L11 0x40003000    0x40000800    0x40001C00   <- MCLK and GCLK match the C21's
#                                                             and PORT matches nothing
#
# ONE PORT GROUP. Every pad in Table 4-1 is a PA pad; the table reaches PA31 and there is no PB.
# That is a first on this arm -- its relatives carry two groups or three.
#
# THE DATA FLASH IS NOT IN THE `flash` FIGURE. Table 1-1's column is "Flash + Data Flash Memory
# (KB)" and reads "64+2" for the parts below. The `flash` field is the 64 KB main array alone,
# which is the contiguous span a linker can believe; the 2 KB Data Flash is a separate array with
# its own address and its own erase granularity, and summing them would describe a region that
# does not exist. Same shape as the SAM L21's Low-power SRAM, recorded for the same reason.

[table]
kind = "parts"
family = "saml1x"
sources = [
    "SAM L10/L11 Family Data Sheet DS60001513J (2023): ch 1 (configuration summary, Table 1-1 and Table 1-2), ch 4 (pinouts, Table 4-1), ch 12 (peripherals configuration summary, Table 12-1), ch 13 (SAM L11 specific security features)",
]
notes = [
    "THE PAD LIST IS COMPLETE FOR THE 32-PIN PACKAGE AND IS CHECKED AGAINST AN INDEPENDENTLY PRINTED COUNT, TWICE. Table 4-1's TQFP32/VQFN32 column numbers each pad below, and Table 1-1's 'I/O Pins' column gives 25 for every 32-pin part. The list counts 25. The same table's SSOP24/VQFN24 column yields 17 pads and Table 1-1 gives 17 for every 24-pin part, so the reading method is confirmed on a package this roster does not use.",
    "THE 24-PIN PACKAGES CARRY ONLY TWO SERCOM INSTANCES. Table 4-1's note 3: '24-pin packages only have two SERCOM instances: SERCOM0 and SERCOM1', and Table 1-1's SERCOM column reads 2 for every D part against 3 for every E part. No part row here is a D part; recorded because ../instances.toml rows SERCOM2 unconditionally and a D part would not have it.",
    "FIVE PADS ARE HIGH SINK AND THE REST ARE NOT. Table 4-1's note 4 names PA16, PA17, PA22, PA23 and PA31 as High Sink pins with different properties from standard pins. Nothing here acts on that; recorded because it is a per-pad electrical fact that no other field in this schema carries.",
    "PA14 AND PA15 ARE THE XOSC PADS AND ARE ORDINARY I/O UNTIL A BOARD FITS A CRYSTAL. Table 4-2 gives XIN on PA14 and XOUT on PA15. Both roster boards leave that footprint EMPTY -- see the board files.",
    "THE PERIPHERAL FUNCTION LETTERS SKIP F, AND THE NIBBLE VALUES DO NOT COMPACT. See blocks/port.toml, where it is stated with the register evidence: writing 0x5 for a 'function F' names a Reserved encoding on this family.",
    "THE DATA FLASH IS NOT IN THE `flash` FIGURE -- see the header.",
]

[[parts]]
part = "atsaml10e16a"
package = "32-pin"
flash = 0x10000
ram = 0x4000
pins = [
    "PA00-PA11", "PA14-PA19", "PA22-PA25", "PA27", "PA30-PA31",
]
source = "DS60001513J Table 4-1 (Pinout Multiplexing), whose TQFP32/VQFN32 column gives a package pin number for each pad above: PA00 1, PA01 2, PA02 3, PA03 4, PA04 5, PA05 6, PA06 7, PA07 8, PA08 11, PA09 12, PA10 13, PA11 14, PA14 15, PA15 16, PA16 17, PA17 18, PA18 19, PA19 20, PA22 21, PA23 22, PA24 23, PA25 24, PA27 25, PA30 31, PA31 32. The list counts 25 and Table 1-1's 'I/O Pins' column states 25 for the 32-pin parts. Flash 64 KB and SRAM 16 KB are Table 1-1's SAML10E16 row, whose 'Flash + Data Flash Memory (KB)' cell reads 64+2 -- the 2 KB Data Flash is a separate array and is deliberately not summed here."

# THE SAM L11 IS THE SAME MAP AND THE SAME PADS. Its row exists because a board names a PART and
# these are two different order codes, not because anything below differs from the row above.
# Everything the L11 adds -- TrustZone, Secure Boot, a second MPU, Data Flash scrambling, secure
# pin multiplexing -- is behavior on the shared map, and Table 1-1 gives the two parts identical
# flash, SRAM, pin count, SERCOM count and I/O pin count.
[[parts]]
part = "atsaml11e16a"
package = "32-pin"
flash = 0x10000
ram = 0x4000
pins = [
    "PA00-PA11", "PA14-PA19", "PA22-PA25", "PA27", "PA30-PA31",
]
source = "DS60001513J Table 4-1, the same TQFP32/VQFN32 column as the row above -- the table has ONE pin-name column for both parts and its header reads 'SAML10/SAML11'. Flash 64 KB and SRAM 16 KB are Table 1-1's SAML11E16 row, identical to the SAML10E16 row in every column including the 64+2 Flash + Data Flash cell."

