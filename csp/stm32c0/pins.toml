# PIN map for the STM32C0 series. It has no rows, so a binding that routes a pad through a
# peripheral is refused on this family.
#
# A pin map pairs a pad with an alternate-function number and the peripheral signal that function
# routes to. NONE OF THAT IS IN A REFERENCE MANUAL. RM0490 describes the die -- its peripherals,
# their registers, their memory map -- and says nothing about which pads a package bonds out or
# which AF number reaches them. The alternate-function tables in the part's DATASHEET are what
# fill this file.
#
# AN EMPTY MAP IS NOT A PAD SPACE AND MUST NOT BE READ AS ONE. Zero rows does not mean the part has
# no pins, and it does not mean no controller reaches a given pad. A consumer that treats the
# absence as a negative gets a confident, complete-looking wrong answer.
#
# A ROW NEEDS TWO DIFFERENT DOCUMENTS. It names an INSTANCE and a SIGNAL, which the datasheet's
# alternate-function tables give, and a PIN, which some part's `pins` list must carry. A `pins`
# list says which pads a PACKAGE bonds out; the alternate-function tables say which signals a DIE
# routes. Those are not the same statement, and on some parts they genuinely differ, so a pad is
# never added to a `pins` list on the strength of appearing in an AF table.
#
# THE BINDING CHECKER REFUSES A BOARD THAT CLAIMS A PIN THIS FILE DOES NOT CARRY, and its refusal
# says to grow the map from the datasheet rather than from the binding. A row is read from the
# datasheet's table, never written to satisfy a board.
#

[table]
kind = "pins"
family = "stm32c0"
sources = [
    "STM32C071x8/xB datasheet DS14693 Rev 2, Tables 13 to 20 (alternate function mapping), which a row in this file is read from; each row also needs its pin in a part's `pins` list, which comes from the package pinout rather than from those tables.",
]
