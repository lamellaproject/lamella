# INSTANCE map for the STM32C0 series: where each block copy sits, and how RCC gates its clock.
#
# One instance, and the shortness is the point: this family carries its flash controller and
# nothing else. Adding a GPIO or USART row here would oblige a `blocks/gpio.toml` and
# a `blocks/usart.toml` -- a full register map each, transcribed from a manual. An instance naming a
# block nobody has written is worse than an absent instance, because it looks like coverage.
#
# The GPIO ports are on the IOPORT bus at 0x50000000, not at the 0x48000000 an STM32F0 uses.
# Two Cortex-M0-class ST families with the same flash page size, and their I/O ports are 128 MB
# apart. A base carried across from the F0 map would address nothing.

[table]
kind = "instances"
family = "stm32c0"
record = ["base", "rcc_en_off", "rcc_en_bit"]
sources = [
    "STM32C0 series reference manual RM0490 Rev 6 section 2.2.2, the peripheral memory map: FLASH interface register block at 0x40022000",
    "RM0490 Rev 6 section 4.7: the FLASH register block's own offsets are KEYR 0x008, SR 0x010, CR 0x014 from that base",
]

[[instances]]
name = "flash"
block = "flash"
base = 0x40022000
rcc_en_off = -1
rcc_en_bit = -1
