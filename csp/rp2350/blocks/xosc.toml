# BLOCK layout: the RP2350 crystal oscillator. Starting this block is idempotent when the
# crystal is already running. The crystal
# FREQUENCY is a BOARD fact: plans state `xosc_hz`.

[table]
kind = "block"
family = "rp2350"
block = "xosc"
sources = ["raspberrypi/pico-sdk RP2350.svd", "RP2350 datasheet ch 8.2 (XOSC)"]

[registers.CTRL]
offset = 0x0
width = 32
fields = { FREQ_RANGE = [0, 12], ENABLE = [12, 12] }
notes = "ENABLE magic 0xFAB | 1..15 MHz range 0xAA0 -> the 0x00FABAA0 enable word (identical to the RP2040)."

[registers.STATUS]
offset = 0x4
width = 32
fields = { STABLE = [31, 1] }

[registers.STARTUP]
offset = 0xC
width = 32
fields = { DELAY = [0, 14] }
notes = "0xC4 = the datasheet's ~1 ms startup delay at 12 MHz."

[constants]
CTRL_ENABLE_MAGIC = 0xFAB
CTRL_FREQ_RANGE_1_15MHZ = 0xAA0
STARTUP_DELAY_1MS = 0xC4
