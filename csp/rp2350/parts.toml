# PARTS table for the rp2350 family. PARTIAL pin present-list; complete from the datasheet
# pinout. A binding whose pin is absent here refuses.
#
# flash = 0: the RP2350 has NO internal flash -- code executes in place from an EXTERNAL QSPI
# part through the XIP window, so a board's flash size is BOARD truth (its soldered chip,
# the board [memory] record). GATE-PINNED as the permanent floor.
#
# ram = 0x80000 (512 KB): the CONTIGUOUS eight-bank striped window at 0x20000000..0x2007ffff.
# The chip's total is 520 kB in 10 banks -- eight 64 kB banks plus two 4 kB banks above the
# watermark (RP2350 datasheet 4.2) -- the two 4 kB banks are DOCUMENTED-EXCLUDED until the
# schema states banks.

[table]
kind = "parts"
family = "rp2350"

[[parts]]
part = "rp2350a"
package = "QFN-60"
flash = 0
ram = 0x80000
pins = ["GP0-GP1", "GP4-GP5", "GP16-GP19", "GP23-GP29"]
# TWO PROCESSOR SOCKETS, AND EACH ONE RUNS EITHER ARCHITECTURE. This is why the field below lists
# architectures per socket rather than naming one: the ARCHSEL register "has one bit for each
# processor socket", so which core sits in a socket is SELECTED rather than fixed, and the part
# offers four combinations. Both Arm and both RISC-V are the ones a single image can use.
#
# AND THE MIXED COMBINATIONS SHOW THAT SHARED MEMORY IS NOT THE WHOLE TEST. The manual
# permits "either Arm core 0 and RISC-V core 1, or RISC-V core 0 and Arm core 1", and says of them:
# "this requires two separate program images". The two still share memory -- "a shared variable can
# be safely, concurrently accessed by an Arm processor performing ldrex, strex instructions and a
# RISC-V processor performing amoadd.w instructions" -- so one address space with two ISAs is a
# real arrangement on real silicon, and it is exactly the case that needs two images rather than
# threading. Same architecture AND shared memory is the condition; either alone is not.
cores = { core0 = ["cortex-m33", "hazard3"], core1 = ["cortex-m33", "hazard3"] }
cores_share_memory = true
source = "RP2350 datasheet 4.2 (520 kB SRAM = 8 x 64 kB striped to 0x2007ffff + 2 x 4 kB; this row states the contiguous 512 KB window) + ch 1 (QFN-60/RP2350A, external QSPI flash) -- PARTIAL pin list: GP0/1 uart, GP4/5 i2c, GP16-19 spi, GP23-25 + GP29 the wireless-module control lines a board may wire, GP26-29 the ADC channel pads (adc block channel map). The pin list is PARTIAL rather than the package's full set"

[[parts]]
part = "rp2350b"
package = "QFN-80"
flash = 0
ram = 0x80000
pins = ["GP0-GP47"]
# THE SAME TWO SOCKETS AS THE A ROW, and for the same reason: the package changes how many pads are
# bonded out, not what is behind them.
cores = { core0 = ["cortex-m33", "hazard3"], core1 = ["cortex-m33", "hazard3"] }
cores_share_memory = true
# THE PIN LIST IS COMPLETE HERE RATHER THAN PARTIAL, which is the one place this row differs in kind
# from the A above: the datasheet states the whole range in one sentence, so there is nothing to add
# to it later.
#
# ANALOGUE INPUT MOVES WITH THE PACKAGE AND IS THE TRAP IN THIS PART. On the QFN-60 the ADC reads
# GPIO26-29; on the QFN-80 it reads GPIO40-47 and NOT GPIO26-29, so a GPIO number that is analogue on
# one package is digital-only on the other, and an ADC channel number is not derivable from it.
source = "RP2350 datasheet Table 1: RP2350B is the QFN-80 (10 x 10 mm) member, no internal flash, 48 GPIO, 8 analogue inputs. Chapter 1 NOTE: GPIOs 0 through 29 are available in all package variants, GPIOs 30 through 47 only in QFN-80 (RP2350B) -- so GP0-GP47 is the whole bonded set. Second NOTE, same chapter: analogue input is on GPIOs 26 through 29 in QFN-60 for four inputs, and on GPIOs 40 through 47 in QFN-80 for eight. Section 4.2 gives the SRAM, unchanged across the family: 520 kB as 8 x 64 kB striped to 0x2007ffff plus 2 x 4 kB above the watermark, and this row states the contiguous 512 KB window the A row states."
