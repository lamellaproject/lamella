# INSTANCE map: where each RP2350 block copy sits + its reset-release bit
# (reset bits are per-instance bus-gate facts).
# `resets_clr` is the chip's atomic write-1-to-CLEAR
# alias of `resets` (base + 0x3000); the SET view rides the resets block's RESET_SET offset.
# `sio` is the single-cycle IO block (the CPU-direct GPIO drive; processor-attached, never
# through RESETS). -1 = not applicable.
# Rows are added evidence-first: spi1 (0x40088000) joins when a binding or a pin-map cell first
# needs it, verified against the RP2350 datasheet, as uart1 and i2c1 did.

[table]
kind = "instances"
family = "rp2350"
record = ["base", "reset_bit"]
sources = ["raspberrypi/pico-sdk RP2350.svd (bases)", "RP2350 datasheet ch 7 (RESETS bits), ch 2.2 (address map)"]

[[instances]]
name = "xosc"
block = "xosc"
base = 0x40048000
reset_bit = -1

[[instances]]
name = "clocks"
block = "clocks"
base = 0x40010000
reset_bit = -1

[[instances]]
name = "resets"
block = "resets"
base = 0x40020000
reset_bit = -1

[[instances]]
name = "resets_clr"
block = "resets"
base = 0x40023000
reset_bit = -1

[[instances]]
name = "io_bank0"
block = "io-bank0"
base = 0x40028000
reset_bit = 6

[[instances]]
name = "pads_bank0"
block = "pads-bank0"
base = 0x40038000
reset_bit = 9

[[instances]]
name = "sio"
block = "sio"
base = 0xd0000000
reset_bit = -1

[[instances]]
name = "pll_sys"
block = "pll"
base = 0x40050000
reset_bit = 14

[[instances]]
name = "pll_usb"
block = "pll"
base = 0x40058000
reset_bit = 15

[[instances]]
name = "uart0"
block = "uart"
base = 0x40070000
reset_bit = 26

# UART1 carries a module plugged into a board's header on GP8 and GP9 (function F2). RP2350
# datasheet 2.2 address map: UART1_BASE 0x40078000; 7.5 Table 535 (RESETS: RESET): bit 27 UART1.
[[instances]]
name = "uart1"
block = "uart"
base = 0x40078000
reset_bit = 27

[[instances]]
name = "spi0"
block = "spi"
base = 0x40080000
reset_bit = 18

[[instances]]
name = "i2c0"
block = "i2c"
base = 0x40090000
reset_bit = 4

# I2C1 carries a board's I2C bus on GP2 and GP3 (function F3). RP2350 datasheet 2.2 address map:
# I2C1_BASE 0x40098000; 7.5 Table 535 (RESETS: RESET): bit 5 I2C1.
[[instances]]
name = "i2c1"
block = "i2c"
base = 0x40098000
reset_bit = 5

[[instances]]
name = "adc"
block = "adc"
base = 0x400a0000
reset_bit = 0

[[instances]]
name = "timer0"
block = "timer"
base = 0x400b0000
reset_bit = 23

[[instances]]
name = "ticks"
block = "ticks"
base = 0x40108000
reset_bit = -1

[[instances]]
name = "trng"
block = "trng"
base = 0x400f0000
reset_bit = 25

# The PWM block's registers start at 0x400a8000 (datasheet 12.5.3); RESETS bit 16 releases it
# (Table 535).
[[instances]]
name = "pwm"
block = "pwm"
base = 0x400a8000
reset_bit = 16

# The QSPI memory interface, which serves the external memory windows: 0x10000000 for chip select 0's
# flash, and 0x11000000 for chip select 1, where a board fits PSRAM (datasheet 2.2.2 and 4.4.1). Its
# registers are XIP_QMI_BASE in the APB address map (2.2), and the RESET register has no bit for it
# (Table 535). A board's PSRAM region names it as the controller that brings the window up.
[[instances]]
name = "qmi"
block = "qmi"
base = 0x400d0000
reset_bit = -1
