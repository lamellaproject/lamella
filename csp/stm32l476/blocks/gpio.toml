# BLOCK layout: the STM32L476 GPIO port block, the registers a uart binding muxes through
# (PARTIAL -- MODER/AFRL fields grow as bindings demand
# them). Offsets are instance-base-relative; port instance bases live in
# ../instances.toml.

[table]
kind = "block"
family = "stm32l476"
block = "gpio"
sources = [
    "STM32L4 reference manual RM0351 Rev 11: GPIO MODER/AFRL (8.5.1/8.5.9)",
]
notes = [
    "GPIO config is read-modify-write: MODER holds 2 bits/pin and AFRL 4 bits/pin, so clear a pin's field span before OR-ing the set value.",
    "AFRL covers pins 0..7; pins 8..15 ride AFRH (offset 0x24) -- AFRH joins this table when a binding first needs it.",
    "L4 reset leaves most pins analog (MODER 11), so the alternate-function set must clear first.",
]

[registers.MODER]
offset = 0x0
width = 32
fields = { MODER2 = [4, 2], MODER3 = [6, 2] }
notes = "Port mode, 2 bits/pin (PARTIAL: pins 2/3 stated). 10 = alternate function."

[registers.AFRL]
offset = 0x20
width = 32
fields = { AFSEL2 = [8, 4], AFSEL3 = [12, 4] }
notes = "Alternate function low (pins 0..7), 4 bits/pin (PARTIAL: pins 2/3 stated)."

[constants]
MODER_MODE_AF = 2
