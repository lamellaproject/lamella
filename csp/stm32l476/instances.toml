# INSTANCE map: where each STM32L476 block copy sits, plus its RCC clock-enable routing.
# The record carries the enable REGISTER OFFSET as data because ST spreads the gates across
# banked enable registers that differ per line (the L4's GPIOAEN is AHB2ENR bit 0 where the
# F0's IOPAEN is AHBENR bit 17), so [base, rcc_en_off, rcc_en_bit] states each gate in full.
# `-1` = the row gates nothing (the RCC itself).

[table]
kind = "instances"
family = "stm32l476"
record = ["base", "rcc_en_off", "rcc_en_bit"]
sources = [
    "STM32L4 reference manual RM0351 Rev 11: memory map (RCC 0x40021000, GPIOA 0x48000000, USART2 0x40004400); RCC AHB2ENR 6.4.17 (GPIOAEN bit 0), APB1ENR1 6.4.19 (USART2EN bit 17)",
]

[[instances]]
name = "usart2"
block = "usart"
base = 0x40004400
rcc_en_off = 0x58
rcc_en_bit = 17

[[instances]]
name = "gpioa"
block = "gpio"
base = 0x48000000
rcc_en_off = 0x4C
rcc_en_bit = 0

[[instances]]
name = "rcc"
block = "rcc"
base = 0x40021000
rcc_en_off = -1
rcc_en_bit = -1
