# BLOCK: the STM32F76x/F77x embedded flash controller, stated only as far as the facts consumers
# outside the controller need. Its unlock sequence, its sector geometry and its command bits are not
# described here.
#
# Two facts, and each `sources` entry names the one it backs.
#
# THE WRITE UNIT IS A SOFTWARE CHOICE ON THIS PART, AND THE VALUE HERE IS THE ONE A BOARD AT AN
# ORDINARY SUPPLY CAN TAKE. PSIZE selects x8, x16, x32 or x64 -- one, two, four or eight bytes per
# program operation -- capped by supply voltage. x64 needs an external VPP of 8 to 9 V; at 2.7-3.6 V
# without it the cap is x32, so four bytes is the largest unit this part can be programmed in on a
# board that does not supply VPP.
#
# WARNING: RM0410 TABLE 8 HAS FIVE VOLTAGE COLUMNS AND FOUR PARALLELISM VALUES, because the x16 cell
# SPANS two of the columns. A reader who pairs them off one by one is wrong for two of the five.
#
# READ IN RM0410 RATHER THAN CARRIED ACROSS FROM RM0090 OR RM0385. All three reach the same answer
# and each was checked in its own manual, because a value taken from a sibling family is right until
# the day it is not and nothing marks the day. This part in particular is NOT the same flash as its
# F74x sibling -- it is twice the size and can be split into two banks, which changes the sector map
# and not the write unit.

[table]
kind = "block"
family = "stm32f769"
block = "flash"
erased_value = 0xffffffff
write_unit = 4
sources = [
    "erased_value: STM32F76xxx/F77xxx reference manual RM0410 Rev 5 section 3.3.8 `Flash programming sequences`: `Successive write operations are possible without the need of an erase operation when changing bits from 1 to 0. Writing 1 requires a flash memory erase operation` -- so the state an erase leaves is all ones",
    "write_unit: RM0410 Rev 5 section 3.3.5 `Maximum program/erase parallelism`: `The maximum parallelism size is configured through the PSIZE field in the FLASH_CR register. It represents the number of bytes to be programmed each time a write operation occurs`",
    "write_unit: RM0410 Rev 5 Table 8 `Maximum program/erase parallelism`, page 93: x64 requires 2.7-3.6 V WITH external VPP, x32 is the cap at 2.7-3.6 V without it, x16 covers 2.4-2.7 V and 2.1-2.4 V, and x8 covers 1.8-2.1 V",
]
notes = [
    "x64 needs an external 8-9 V supply on the VPP pad. RM0410 advises limiting VPP to initial programming on the factory line, so it is a production-programming mode rather than one an application uses.",
    "The erase unit is not this number and is not declared here, and on this part it is not even one map: RM0410 section 3.3.1 gives a single-bank layout of 4 sectors of 32 Kbytes, 1 of 128 Kbytes and 7 of 256 Kbytes, and a dual-bank layout of two 1 Mbyte banks each of 4 sectors of 16 Kbytes, 1 of 64 Kbytes and 7 of 128 Kbytes. The nDBANK option byte decides which, so erase granularity here is not even a PART fact -- it is a fact about how the part is configured.",
    "This block declares no registers. The register map of this controller is read and owned elsewhere, and a partial transcription here would be a second spelling of somebody else's source.",
]
