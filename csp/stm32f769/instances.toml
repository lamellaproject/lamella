# INSTANCE map: where each STM32F769 block copy sits, plus its RCC clock-enable routing.
# The record carries the enable REGISTER OFFSET as data because ST spreads the gates across banked
# enable registers, so [base, rcc_en_off, rcc_en_bit] states each gate in full. `-1` = the row
# gates nothing (the RCC itself).
#
# This part gates its GPIO ports from AHB1 and USART1 from APB2 -- two different banks, which is
# exactly why the offset is data rather than a per-family constant.
#
# ELEVEN PORTS, A THROUGH K, AND THE HIGH ONES ARE NOT DECORATION. The port this board's user
# LEDs sit on is J, whose enable bit is 9 -- so a driver that derived a port's enable bit from a
# letter's position in a shorter alphabet would be right for A through H and wrong here, silently,
# on the only two pins a first program blinks.

[table]
kind = "instances"
family = "stm32f769"
record = ["base", "rcc_en_off", "rcc_en_bit"]
sources = [
    "STM32F76xxx/STM32F77xxx reference manual RM0410 Rev 5: Table 1 register boundary addresses (RCC 0x40023800, GPIOA 0x40020000, GPIOJ 0x40022400, USART1 0x40011000 on APB2, SDMMC2 0x40011C00 on APB2)",
    "STM32F76xxx/STM32F77xxx reference manual RM0410 Rev 5: RCC_AHB1ENR 5.3.10 (address offset 0x30, GPIOAEN bit 0, GPIOJEN bit 9); RCC_APB2ENR 5.3.14 (address offset 0x44, USART1EN bit 4, SDMMC2EN bit 7)",
]
notes = [
    "Every bit position here is taken from the reference manual's per-bit descriptions rather than from its register bit-map diagram: the diagram is a wide table whose columns do not survive a text conversion, and the per-bit prose states the same fact unambiguously.",
    "The bases and gates below agree with the ones the stm32f7 family read from its own manual. That agreement is two documents about two parts saying the same thing, not one fact stated twice -- had the vendor moved a peripheral between the lines, the rows would differ and both would still be right.",
    "SDMMC2EN's bit NUMBER is stated unambiguously and its two VALUE lines are not: RM0410 Rev 5 section 5.3.14 prints both 0 and 1 as 'SDMMC2 clock disabled'. The bit position 7 is what this table records and it is not in doubt. The polarity is settled by the same section's SDMMC2RST and by 5.3.16's SDMMC2LPEN, both at bit 7 of their own registers and both printed with the two values distinct, and by the convention every other enable bit in the register follows.",
]

[[instances]]
name = "usart1"
block = "usart"
base = 0x40011000
rcc_en_off = 0x44   # RCC_APB2ENR
rcc_en_bit = 4      # USART1EN

# THE SECOND SD/MMC CONTROLLER, AND IT IS NOT THE FIRST ONE. SDMMC1 is a separate peripheral at a
# separate base (0x40012C00 in the same table) reached by its own pads, so a design that names
# "the SD controller" has said nothing: which one a given socket reaches is a wiring fact, and the
# two do not share a pin.
[[instances]]
name = "sdmmc2"
block = "sdmmc"
base = 0x40011C00
rcc_en_off = 0x44   # RCC_APB2ENR
rcc_en_bit = 7      # SDMMC2EN

[[instances]]
name = "gpioa"
block = "gpio"
base = 0x40020000
rcc_en_off = 0x30   # RCC_AHB1ENR
rcc_en_bit = 0      # GPIOAEN

[[instances]]
name = "gpioj"
block = "gpio"
base = 0x40022400
rcc_en_off = 0x30   # RCC_AHB1ENR
rcc_en_bit = 9      # GPIOJEN

[[instances]]
name = "rcc"
block = "rcc"
base = 0x40023800
rcc_en_off = -1
rcc_en_bit = -1
