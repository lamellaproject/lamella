# PARTS table for the stm32f091 family. PARTIAL.
#
# ram: 32 KB, RM0091-exact ("32 Kbytes of static SRAM"). flash = 0 is a DEFERRAL, not a
# statement: RM0091 states only "up to 256 Kbyte of flash memory" for the line, and the
# exact F091RC size is deferred to the datasheet. NOTE this 0 is NOT the external-XIP
# convention -- the part has internal flash; nothing consumes the value until the real size
# lands with its citation.

[table]
kind = "parts"
family = "stm32f091"

[[parts]]
part = "stm32f091rc"
package = "64-pin (order-code package suffix deferred to the datasheet)"
flash = 0
ram = 0x8000
pins = ["PA2-PA3"]
source = "RM0091 (32 Kbytes SRAM; flash 'up to 256 Kbyte' -- exact F091RC size DEFERRED to the DS) -- PARTIAL pin list: complete from the DS as bindings demand"
