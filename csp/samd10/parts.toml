source = "Atmel-42242H ch 4.2 (20-pin SOIC pinout); ordering codes ATSAMD10D13A-SSUT and -SSNT (ch 2.2), 8K. DSU DID.DEVSEL = 0x04, DID = 0x10020r04."

[[parts]]
part = "atsamd10d14au"
package = "20-ball WLCSP"
flash = 0x4000
ram = 0x1000
pins = ["PA02-PA09", "PA14-PA16", "PA22-PA25", "PA28", "PA30-PA31"]
source = "Atmel-42242H ch 4.3 (20-ball WLCSP ball map); ordering code ATSAMD10D14A-UUT (ch 2.3), 16K. DSU DID.DEVSEL = 0x09, DID = 0x10020r09. Table 1-1 groups this with the 20-pin SOIC in one column, so the identical pin list is READ OFF THE BALL MAP rather than inherited from that grouping: the two sets were compared pad by pad and are the same 18. There is no 8K WLCSP ordering code in ch 2.3, so this package ships in one density only."

[[parts]]
part = "atsamd10c14a"
package = "14-pin SOIC"
flash = 0x4000
ram = 0x1000
pins = ["PA02", "PA04-PA05", "PA08-PA09", "PA14-PA15", "PA24-PA25", "PA28", "PA30-PA31"]
source = "Atmel-42242H ch 4.1 (14-pin SOIC pinout); table 1-1 column 3 for 12 GPIOs; ordering codes ATSAMD10C14A-SSUT and -SSNT (ch 2.1), 16K. DSU DID.DEVSEL = 0x06, DID = 0x10020r06. This is the D10C series, not D10D: it carries 2 SERCOMs where the D10D carries 3, and 5 ADC channels against 8 or 10 (table 1-1), so it is a different part rather than a smaller package of the same one."

