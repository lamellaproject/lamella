# SERCOM in SPI mode on the SAM D10 family -- the BLOCK layout: register offsets are
# SERCOM-instance-relative; nothing in this file names an instance, a pin, a board, or a clock
# plan. Instance bases/ids live in ../instances.toml; board wiring lives in bsp/<board>/board.toml.
#
# ONE SERCOM, THREE REGISTER MAPS. This mode shares its offsets with the USART and I2C maps at the
# same base -- CTRLA 0x00, CTRLB 0x04, INTFLAG 0x18, DATA 0x28 in all three -- and the FIELDS
# inside them differ. CTRLA.MODE is what decides which map a given instance is answering to, so a
# driver that writes an SPI field into a SERCOM still in USART mode gets no error, only a device
# that does not work.

[table]
kind = "block"
family = "samd10"
block = "sercom"
mode = "spi"
sources = [
    "SAM D10 datasheet Atmel-42242H-SAM-D10-Datasheet_09/2016 ch 26.7 (register summary) for the register set and offsets: CTRLA 0x00, CTRLB 0x04, BAUD 0x0C, INTENCLR 0x14, INTENSET 0x16, INTFLAG 0x18, STATUS 0x1A, SYNCBUSY 0x1C, ADDR 0x24, DATA 0x28, DBGCTRL 0x30",
    "SAM D10 datasheet Atmel-42242H ch 26.8 per-register field lists for every bit position stated below",
]
notes = [
    "READ FROM THIS FAMILY'S OWN DATASHEET AND THEN COMPARED: every offset and bit position below was taken from Atmel-42242H ch 26.7 / 26.8, and each one turned out to equal the SAM D11's. That agreement is a MEASUREMENT rather than an inheritance -- the two families are separate documents and separate dies (0x1002rXX against 0x1003rXX), and the SAM D10 has no USB where the D11 does, so agreement was never safe to assume. A future revision that diverges should fail a reader's expectation here, not slip through it.",
    "MODE selects master (3) or slave (2) SPI; DOPO and DIPO select which pads carry MOSI/SCK/SS and MISO, and those are binding-derived rather than fixed.",
    "CPOL and CPHA together are the SPI transfer mode: mode 0 is CPOL 0 / CPHA 0. The datasheet states them as two independent bits and never as a mode number, which is why no MODE0..3 constant appears here.",
    "BAUD is 8 bits on this family, not 16: f_sck = f_core / (2 * (BAUD + 1)) for master mode, where f_core is the routed GCLK generator's rate -- a PLAN fact, never stated here.",
    "RXEN is write-synchronized through SYNCBUSY.CTRLB. There is no matching TXEN: in SPI the transmitter follows from writing DATA, so an SPI bring-up that mirrors the USART's TXEN|RXEN step is looking for a bit this mode does not have.",
    "MSSEN turns the hardware slave-select on. A driver driving SS as a plain GPIO instead must leave it clear, and the two approaches are mutually exclusive rather than additive.",
]

[registers.CTRLA]
offset = 0x0
width = 32
fields = { SWRST = [0, 1], ENABLE = [1, 1], MODE = [2, 3], RUNSTDBY = [7, 1], IBON = [8, 1], DOPO = [16, 2], DIPO = [20, 2], FORM = [24, 4], CPHA = [28, 1], CPOL = [29, 1], DORD = [30, 1] }
notes = "MODE 3 = SPI master, 2 = SPI slave. DOPO/DIPO select the data pads. DORD 1 = LSB-first; CPOL/CPHA are the transfer mode."

[registers.CTRLB]
offset = 0x4
width = 32
fields = { CHSIZE = [0, 3], PLOADEN = [6, 1], SSDE = [9, 1], MSSEN = [13, 1], AMODE = [14, 2], RXEN = [17, 1] }
notes = "CHSIZE 0 = 8-bit. RXEN enables the receiver and is write-synchronized. MSSEN enables hardware slave-select; AMODE and PLOADEN are slave-mode addressing and preload."

[registers.BAUD]
offset = 0xC
width = 8
fields = { BAUD = [0, 8] }
notes = "Master-mode divisor; see the block formula note. Eight bits wide on this family."

[registers.INTENCLR]
offset = 0x14
width = 8
fields = { DRE = [0, 1], TXC = [1, 1], RXC = [2, 1], SSL = [3, 1], ERROR = [7, 1] }
notes = "Write 1 to disable an interrupt; reading returns the enable mask."

[registers.INTENSET]
offset = 0x16
width = 8
fields = { DRE = [0, 1], TXC = [1, 1], RXC = [2, 1], SSL = [3, 1], ERROR = [7, 1] }
notes = "Write 1 to enable an interrupt; reading returns the enable mask."

[registers.INTFLAG]
offset = 0x18
width = 8
fields = { DRE = [0, 1], TXC = [1, 1], RXC = [2, 1], SSL = [3, 1], ERROR = [7, 1] }
notes = "DRE is cleared by WRITING DATA and RXC by READING it, not by writing the flag. A polled full-duplex transfer waits DRE, writes, then waits RXC and reads -- the read is what frees the receiver, so a driver that ignores the returned byte still has to take it."

[registers.STATUS]
offset = 0x1A
width = 16
fields = { BUFOVF = [2, 1] }
notes = "Write-1-to-clear. BUFOVF is the only named status bit this mode defines on this family; the rest of the register reads reserved."

[registers.SYNCBUSY]
offset = 0x1C
width = 32
fields = { SWRST = [0, 1], ENABLE = [1, 1], CTRLB = [2, 1] }
notes = "Read-only. One bit per synchronized write; wait the matching bit clear before the next access to that register."

[registers.ADDR]
offset = 0x24
width = 32
fields = { ADDR = [0, 8], ADDRMASK = [16, 8] }
notes = "Slave-mode address match and mask, used with CTRLB.AMODE. Inert in master mode."

[registers.DATA]
offset = 0x28
width = 32
fields = { DATA = [0, 9] }
notes = "Nine bits wide because CHSIZE reaches 9-bit characters; an 8-bit configuration uses the low byte."
