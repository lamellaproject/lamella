# PART: Bosch BMP280 pressure and temperature sensor.
#
# The family base without humidity. THE POINT OF HOW SHORT THIS FILE IS: the base was drawn around
# what both members share rather than around the richer member, so the smaller part states only
# what it genuinely differs by. Drawn the other way, this file would have had to switch features
# back OFF -- which is the check a family of one member cannot run.
#
[table]
kind = "device"
family = "bmx280"
part = "bmp280"
base = "bmx280"
sources = [
    "Bosch BST-BME280-DS001 rev 1.24 (February 2024) ch 5.2 'Register compatibility to BMP280', table 17: the vendor's own statement that pressure and temperature control and readout are identical between the two parts, plus the complete list of exceptions.",
]
notes = [
    "The vendor states the BME280 is downward register compatible with this part: pressure and temperature control and readout are identical. Four registers are documented as differing, and all four are stated here or in the base.",
]

# --- sourcing ------------------------------------------------------------------------------------
#
# Secondary, and `derived_from` names what it is secondary TO: every fact below comes from the
# BME280 datasheet's own BMP280-compatibility section, which is a primary vendor statement about
# this part but is not this part's own datasheet. Nothing here is written from memory or inferred
# from a third-party driver, and nothing the family base states about pressure or temperature is
# contradicted by that section.
#
# WHAT THIS PART THEREFORE DOES NOT STATE, because the compatibility section does not cover it:
# power figures, timing, and the measurement-duration table a non-blocking driver would need.
# Treat those as absent rather than defaulted.
#
# Identified, and no further: a physical part has answered the identity register below against a
# negative control, and nothing beneath it has been read from silicon.
#
# THE READING BEARS ON THE SOURCING AS WELL AS ON THE VALIDATION, which is unusual enough to say
# plainly. Both facts the check used -- the register and the set of values it accepts -- are
# DERIVED ones, taken from a compatibility section rather than from this part's own datasheet, and
# both held on a device. That is the first evidence this family's secondary derivation is sound. It
# does not make the facts primary: what a physical part corroborates is the two sentences it was
# asked about, not the rest of the section they came from.

[sourcing]
facts = "secondary"
derived_from = "bme280"
validation = "identified"
evidence = "A physical part answered the identity register on a Raspberry Pi Pico 2, over I2C0 at 100 kHz, on a STEMMA QT breakout reached through a four-wire cable: register 0xD0 read 0x58 at address 0x77, the SDO-high strap this family states, repeated across consecutive passes with 0 faulted of 112 addresses walked each time. THE NEGATIVE CONTROL RAN IN THE SAME PASSES: the identical read of the identical register at 0x76, where no part was present, ABORTED every time. AND THE VALUE IS THE THIRD OF THE THREE THIS TABLE ACCEPTS, NOT THE FIRST, which is the whole reason the accepted values are a set: the instrument that took this reading compared against the first value alone until the day before it was run, and against that check this genuine part would have been reported as not a BMP280 and read as no part at all. A SECOND CONTROL CAME FREE, because the sibling in this family shares this address and this register: the same read was scored against the BME280's accepted 0x60 and did not match, and a BME280 measured on the same rig at the same address answered 0x60 and matched none of the three here. So the identity separates the two members in BOTH directions rather than merely being present in one. EVERY NUMBER IN THE CHECK -- the strap addresses, the register, and all three accepted values -- was taken from this table's own emitted artifact by a bench program that includes it, so what was tested is the row that ships and not a copy of it."

# --- identity: THREE accepted values, not one ----------------------------------------------------
#
# The identity register does NOT hold a single value for this part. Engineering samples answer
# 0x56 or 0x57 and mass-production parts answer 0x58, all three documented by the vendor as valid
# chip_id readings for a BMP280. A driver that accepts only the mass-production value rejects a
# genuine part -- so an identity is a SET, and a schema that models it as one value is wrong for
# the second part the catalogue describes rather than the hundredth.

[identity]
reg = 0xD0
width = 8
values = [0x56, 0x57, 0x58]
notes = "0x56 and 0x57 are samples; 0x58 is mass production."

# --- the burst is shorter, because there is no humidity ------------------------------------------
#
# The resolution difference is worth recording even though no register moves: on this part the
# pressure and temperature resolution depends only on osrs_p and osrs_t, whereas on the BME280 that
# holds only with the filter off. Same registers, different meaning for a given setting.

[measurement]
burst_length = 6
resolution_bits = "16..20, depending only on the oversampling setting"

# --- the standby encoding this member does NOT share ---------------------------------------------
#
# MICROSECONDS, as integers, for the same reason the sibling gives: the catalogue has to work on a
# no-float tier, and one 0.5 would force a float into every emitted language.

[enums.standby_us]
"0" = 500
"1" = 62500
"2" = 125000
"3" = 250000
"4" = 500000
"5" = 1000000
"6" = 2000000
"7" = 4000000
notes = "Codes 6 and 7 differ from the BME280's, which uses 10 ms and 20 ms for the same two codes."
