# PART: Bosch BME280 humidity, pressure and temperature sensor.
#
# A BMP280 plus humidity. Everything not stated here is inherited from the family base and is
# FLATTENED INTO THE EMITTED TABLE by the generator, so a reader of the emitted artifact never has
# to chase a base to see the whole truth.

[table]
kind = "device"
family = "bmx280"
part = "bme280"
base = "bmx280"
sources = [
    "Bosch BST-BME280-DS001 rev 1.24 (February 2024): humidity registers ch 5.4.5 / 5.4.7, trimming parameter layout table 16, humidity compensation ch 4.2.3, ctrl_hum ordering constraint ch 5.4.3, standby encoding table 27.",
]
notes = [
    "Register and readout compatible with the BMP280 for pressure and temperature; the differences are the humidity channel, the standby encoding, and the identity value.",
]

# --- sourcing ------------------------------------------------------------------------------------
#
# Primary: every fact below is read from this part's own datasheet, the document `sources` cites.
#
# Identified, and no further: a physical part has answered the identity register below, against a
# negative control. Nothing beneath the identity has been made to answer -- no register in the
# measurement path has been read from silicon, and the compensation arithmetic remains checked only
# against the vendor's own reference calculation, which is a DIFFERENT claim and raises no rank. It
# establishes that these numbers agree with the document, not that a part agrees with these numbers.
# Reaching `exercised` means decoding a measurement, and the trimming parameters this table
# describes have still never been read from a device.

[sourcing]
facts = "primary"
validation = "identified"
evidence = "A physical part answered the identity register on a Raspberry Pi Pico 2, over I2C0 at 100 kHz, on a STEMMA QT breakout reached through a four-wire cable: register 0xD0 read 0x60 -- the single value this table accepts -- at address 0x77, the SDO-high strap this table states, repeated across consecutive passes with 0 faulted of 112 addresses walked each time. THE NEGATIVE CONTROL RAN IN THE SAME PASSES: the identical read of the identical register at 0x76, the SDO-low strap, where no part was present, ABORTED every time and produced the identity value 0 times -- so the byte came from a part rather than from the state of an idle wire. A SECOND, SHARPER CONTROL CAME FREE, because the sibling in this family shares this address range and this register: the same read was scored against the BMP280's accepted set of 0x56, 0x57 and 0x58 and matched none of them, so the value distinguishes the two members rather than merely being present. EVERY NUMBER IN THE CHECK -- the two strap addresses, the register, and the accepted value -- was taken from this table's own emitted artifact by a bench program that includes it, so what was tested is the row that ships and not a copy of it."

[identity]
reg = 0xD0
width = 8
values = [0x60]

# --- what humidity adds ------------------------------------------------------------------------

[registers.ctrl_hum]
reg = 0xF2
width = 8
access = "read-write"
fields = { osrs_h = [0, 3] }
notes = "WRITE ORDER IS LOAD-BEARING: a change here takes effect only on a subsequent write to ctrl_meas, so ctrl_hum must be written FIRST. Reversing the two leaves the humidity oversampling at its previous value, which presents as a stuck reading rather than as an error."

[registers.hum]
reg = 0xFD
width = 16
access = "read-only"
fields = { hum_msb = [8, 8], hum_lsb = [0, 8] }
notes = "16 bits, MSB first: (msb << 8) | lsb. Unlike pressure and temperature it is not left justified."

[measurement]
# The burst covers pressure, temperature AND humidity -- 0xF7..0xFE.
burst_length = 8
resolution_bits = "16..20 with the filter off, always 20 with the filter enabled"

# --- the standby encoding this member does NOT share --------------------------------------------
#
# MICROSECONDS, as integers. The catalog has to work on a no-float tier, so a facts table that
# carried 0.5 as a float would force a float into every emitted language for the sake of one row.

[enums.standby_us]
"0" = 500
"1" = 62500
"2" = 125000
"3" = 250000
"4" = 500000
"5" = 1000000
"6" = 10000
"7" = 20000
notes = "Codes 6 and 7 differ from the BMP280's, which uses 2 s and 4 s for the same two codes. A shared standby table across the family would be wrong for one member or the other."

# --- humidity calibration ------------------------------------------------------------------------
#
# The humidity trimming parameters are NOT contiguous with the temperature and pressure block, and
# two of them are 12-bit values that SHARE the nibbles of a single register. That packing is the
# most error-prone read in the part and is the reason the read is described field by field rather
# than as a block plus a struct layout.

[calibration.humidity]
form = "bmx280-h-int32"
byte_order = "little"
output_scale = "q22.10-percent-relative-humidity"
depends_on = ["temperature"]
notes = "Consumes the fine-resolution temperature, so a humidity reading is meaningless unless a temperature has been compensated from the same measurement. The compensated result is clamped to the range 0..419430400 before scaling, which is part of the vendor's own calculation and not a driver's defensive choice."

[[calibration.humidity.read]]
name = "dig_H1"
reg = 0xA1
width = 8
signed = false

[[calibration.humidity.read]]
name = "dig_H2"
reg = 0xE1
width = 16
signed = true

[[calibration.humidity.read]]
name = "dig_H3"
reg = 0xE3
width = 8
signed = false

[[calibration.humidity.read]]
name = "dig_H4"
reg = 0xE4
width = 12
signed = true
packing = "high8-at-0xE4-low4-in-low-nibble-of-0xE5"

[[calibration.humidity.read]]
name = "dig_H5"
reg = 0xE6
width = 12
signed = true
packing = "high8-at-0xE6-low4-in-high-nibble-of-0xE5"

[[calibration.humidity.read]]
name = "dig_H6"
reg = 0xE7
width = 8
signed = true
