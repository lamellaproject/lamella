# PART: the Arduino Modulino Pixels node.
#
# Eight LC8822-2020 RGB LEDs, driven by the node's MCU. What answers on the bus is the node's FIRMWARE, so the interface is a property of a
# software release rather than of a part. See `modulino.toml` for what that means for every member.

[table]
kind = "device"
family = "modulino"
part = "pixels"
base = "modulino"
sources = [
    "Arduino Modulino Pixels user manual ABX00109, section 7.5 'I2C Address Reference': default address 0x6C, hardware address 0x36, editable to any custom address in software.",
]

[sourcing]
facts = "primary"
validation = "none"

[address]
bus = "i2c"
base = 0x36
notes = "Arduino ABX00109 section 7.5 prints TWO columns: 0x6C under the product's own name and 0x36 under 'Hardware I2C Address'. The second is the 7-bit address a bus scan sees and is the one stated here; the first is that value shifted up with the read/write bit appended, and writing it into a 7-bit field addresses something else. A node of this type answered address 0x36 on an I2C walk of a Raspberry Pi Pico 2. That establishes only that SOMETHING acknowledged that address: these nodes carry no identity register, so nothing read can say which one it was, and the address is software-assignable so it is not evidence of type either. It matches the manual's 'Hardware I2C Address' column (0x36) and not its headline column (0x6C)."
