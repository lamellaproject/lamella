# PART: the Arduino Modulino LED Matrix node.
#
# An 8x12 LED matrix, driven by the node's MCU. What answers on the bus is the node's FIRMWARE, so the interface is a property of a
# software release rather than of a part. See `modulino.toml` for what that means for every member.

[table]
kind = "device"
family = "modulino"
part = "led-matrix"
base = "modulino"
sources = [
    "Arduino Modulino LED Matrix user manual ABX00152, section 7.5 'I2C Address Reference': default address 0x32, hardware address 0x19, editable to any custom address in software.",
]

[sourcing]
facts = "primary"
validation = "none"

# --- a disagreement worth carrying ------------------------------------------------------------
#
# MEASURED AT AN ADDRESS NEITHER COLUMN LISTS: 0x39 on this bench against 0x32 and 0x19 in the manual.

[address]
bus = "i2c"
base = 0x19
notes = "Arduino ABX00152 section 7.5 prints TWO columns: 0x32 under the product's own name and 0x19 under 'Hardware I2C Address'. The second is the 7-bit address a bus scan sees and is the one stated here; the first is that value shifted up with the read/write bit appended, and writing it into a 7-bit field addresses something else. A node of this type answered address 0x39 on an I2C walk of a Raspberry Pi Pico 2. That establishes only that SOMETHING acknowledged that address: these nodes carry no identity register, so nothing read can say which one it was, and the address is software-assignable so it is not evidence of type either. It matches NEITHER column of the manual, which gives 0x32 and 0x19."
