[package]
name = "lamella-cmsis-dap-stm32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "STMicroelectronics STM32 flash programming over a Lamella CMSIS-DAP debug probe: the device-specific flash controller (STM32F4 embedded flash) layered on the chip-agnostic lamella-cmsis-dap, the same way lamella-cmsis-dap-sam adds the SAM controllers."
publish = false

[lints]
workspace = true

[dependencies]
# The probe-neutral seam. These flash routines are written against `TargetAccess`, so they drive a
# target through any probe family the seam supports, not just a CMSIS-DAP one.
lamella-probe-core = { path = "../lamella-probe-core" }
lamella-cmsis-dap = { path = "../lamella-cmsis-dap" }

[dev-dependencies]
# Real ST-Link access for the examples -- the probe most STM32 boards ship with.
lamella-stlink = { path = "../lamella-stlink" }
# Probe discovery, so the same example can also run over CMSIS-DAP and prove the flash path is
# probe-portable rather than merely claimed to be. `usbbulk` because a probe's TRANSPORT is not a
# property of the probe MODEL: an MCU-Link Pro presents CMSIS-DAP over USB-HID on its V2.x firmware
# and over USB BULK on its V3.x firmware, so the same physical probe needs both paths available and
# the tool has to pick at run time.
lamella-probe = { path = "../lamella-probe", features = ["usbbulk"] }
lamella-cmsis-dap = { path = "../lamella-cmsis-dap", features = ["usbbulk", "test-util"] }
# Real-probe HID access for the examples (native USB-HID; e.g. an Atmel-ICE, or an MCU-Link Pro on
# firmware older than V3).
lamella-usbhid = { path = "../lamella-usbhid" }
lamella-usbbulk = { path = "../lamella-usbbulk" }
