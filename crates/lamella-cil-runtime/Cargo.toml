[package]
name = "lamella-cil-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The Lamella virtual execution system: a CIL interpreter implemented from ECMA-335."
publish = false

[dependencies]
lamella-cil = { path = "../lamella-cil" }
# The shared block point. A leaf crate rather than a module here, so a sibling language runtime can
# park on the SAME reactor without depending on this interpreter.
lamella-reactor = { path = "../lamella-reactor" }
# The shared socket seam, re-exported as this crate's `net` module. A leaf for the same reason as
# the reactor, and with a second consequence: a BACKEND (smoltcp, a Wi-Fi module, the host) now
# implements the trait without depending on this interpreter either.
lamella-net-core = { path = "../lamella-net-core" }
# The shared code-point byte codec. A leaf like the reactor: the WTF-8 BYTE form is a format a
# sibling language runtime writes too, and one definition is the only way two writers stay identical.
lamella-wtf8 = { path = "../lamella-wtf8" }
lamella-token = { path = "../lamella-token" }
# Accurate no_std transcendental math (sqrt/sin/cos/pow/log/exp), behind `math-transcendental`.
# A MUSL/fdlibm port (the accurate option; a fast/approximate alternative is a future knob).
libm = { version = "0.2.16", optional = true }

[features]
default = ["bcl", "NETMFv4_4", "exceptions", "float", "gc", "finalizers", "math-transcendental", "generics"]
# The base BCL intrinsics (System.Console / System.String core / Object..ctor): the
# ECMA-335 Kernel Profile floor. Off => the minimal interpreter core (arithmetic,
# control flow, the object model) with no BCL surface -- the smallest build for a
# constrained target. The runtime side of a capability-profile surface knob.
bcl = []
# The additional NETMFv4_4-profile BCL surface beyond the Kernel Profile
# (richer String, Math, Char, parsing). Off => the Kernel-only floor. A surface knob.
NETMFv4_4 = ["bcl", "reflection", "text", "collections"]
# The COLLECTION types beyond the array: ArrayList, Hashtable, Stack, Queue and the generic
# List and Dictionary, together with the Comparer they order through. A capability rather
# than a profile: a program that only needs arrays should not carry the rest.
collections = []
# The richer TEXT surface: System.Char's classification and casing predicates, and the
# String search, trim, pad, split, join, replace and case members beyond the kernel floor.
# A capability rather than a profile: text handling composes with any BCL tier.
#
# It does not gate String itself, its length, indexer, concatenation or equality -- those are
# floor surface at every tier. It is also independent of the string-utf8 knobs, which choose
# how a string is STORED rather than which members exist.
text = []
# The metadata INSPECTION surface: System.Type's names, predicates and member lookup,
# System.Reflection's MethodBase / FieldInfo / PropertyInfo / EventInfo / ParameterInfo /
# Assembly, and System.Activator. A capability rather than a profile: it composes with any
# BCL tier, and a build that does not inspect metadata should not carry the machinery.
#
# `typeof(T)`, type identity and casts are NOT here -- they are floor surface at every tier.
# Off means those seams have no reachable implementation rather than a defaulting one, which
# matters because every gated member is runtime-provided with no managed fallback: a build
# that cannot synthesize them would otherwise answer null, false, or an empty array into
# callers that act on the result.
reflection = []
# Structured exception handling (throw / try-catch / finally). Off => those opcodes
# are unsupported and the unwinder is stripped under LTO -- the smallest tier, where a
# fault terminates rather than unwinds. A capability-profile knob.
exceptions = []
# The moving (mark-compact) garbage collector. Off (the `gc = none/marshal` tiers) =>
# the bump arena with no collector, root machinery compiled out -- the no-GC driver /
# tiny-target profile. A capability-profile knob.
gc = []
# Object finalization: destructors / Finalize via an f-reachable queue run at a GC
# safepoint, plus GC.SuppressFinalize / ReRegisterForFinalize and resurrection. Requires
# `gc` (only a collector detects unreachability). Off => no finalization machinery, the
# embedded default. A capability-profile knob.
finalizers = ["gc"]
# Floating-point support: the `Value::Float` value, the float CIL opcodes (ldc.r4/r8, conv.r*,
# float arithmetic / comparison, ckfinite) and the float BCL (Double.ToString, the Math double
# overloads). Off => the no-float tier: those opcodes trap and the float code is compiled out --
# for the smallest targets that have no FPU and use no float. A capability-profile knob.
float = []
# Code loading (the `code_loading` capability knob), three levels over the one ManagedBody seam.
# Default (both features OFF) = `on_use`: keep the raw CIL and decode a method body lazily on first
# call, so an uncalled method never decodes -- lighter resident RAM and faster startup. `code-preload`
# = `preload`: decode every body once at load and hold it resident for a direct per-instruction read,
# where RAM is ample and deterministic timing matters. `code-in-place` = `in_place` (XIP): decode one
# instruction per step straight from the flash-resident code bytes -- ZERO decoded-body RAM, the
# instruction pointer a CIL byte offset -- paying per-step decode; requires `flash-image` (the body
# must be a flash slice). The two features are mutually exclusive (compile_error otherwise).
code-preload = []
code-in-place = ["flash-image"]
# Execute-in-place foundation (XIP): the loader borrows each method's raw CIL as a `&'static [u8]`
# straight from the flash-resident PE instead of copying it into an owned `Box` (see `RawCil`), so the
# raw IL costs zero RAM. Off (the default) => the owned copy, byte-identical to a non-XIP build. On =>
# the borrow; requires the load API's `Assembly` to be `'static` (device flash ROM, or a host
# `Box::leak`). Composes with `on_use` (lazy decode from flash) and underpins `code-in-place`
# (decode per step from the slice, no decoded body ever resident).
flash-image = []
# String storage encoding (a developer knob; .NET UTF-16 String semantics hold either way).
# Default (feature off) = UTF-16 (O(1) indexing). On = UTF-8 (~half the ASCII-text memory,
# O(n) UTF-16 indexing). The WELL-FORMED tier: a lone surrogate cannot be represented, so it is
# the one place a String is not preserved byte-for-byte -- see string-utf8-wtf8 for the tier that
# keeps it. Its guarantee in exchange: the backing bytes are ALWAYS valid UTF-8, so they can be
# handed to a UTF-8-native consumer (a socket write, an LPUTF8Str marshal) with no validation pass.
string-utf8 = []
# WTF-8 storage: UTF-8's size with UTF-16's surrogate parity. A lone surrogate is stored as its own
# 3-byte code point, so every String round-trips; a well-formed surrogate PAIR still combines to one
# 4-byte supplementary code point (WTF-8, not CESU-8). Byte-identical to UTF-8 for any well-formed
# string, so egress is a copy in the normal case -- but the bytes are NOT guaranteed valid UTF-8, so
# a UTF-8-native consumer needs the check `string-utf8` makes unnecessary. Wins when both are set,
# matching lamella-aot's convention so the interpreter previews the tier an AOT build would use.
string-utf8-wtf8 = []
# The instruction-set rules ECMA-335 gives `System.Nullable<T>` and no other type: `box` (III.4.1)
# yields a null reference or a boxed T, `unbox` / `unbox.any` (III.4.32, III.4.33) recover an
# instance FROM a boxed T, and `castclass` / `isinst` (III.4.3, III.4.6) succeed on one.
#
# Coupled to the monomorphizer rather than chosen per profile: a `Nullable<T>` is an INSTANTIATION,
# and only `lamella-load`'s generics pass creates one, so without that pass these arms are
# unreachable by construction rather than merely unused. `lamella-load`'s own `generics` feature
# turns this on, which is what keeps the two from being set independently. Off is the tiny-target
# floor, where the rules cost flash a part with no monomorphizer can never spend.
generics = []
# Typed references (System.TypedReference): the mkrefany / refanyval / refanytype opcodes
# (__makeref / __refvalue / __reftype) and the Value::TypedRef they pass. Off (the default,
# the tiny-target floor) => those three opcodes trap cleanly; they are vanishingly rare in
# C# 1.0 (low-level reflection / C variadic interop). A capability-profile knob.
typed-references = []
# Varargs (the arglist opcode / __arglist): the full CLI vararg system. Off (the default, the
# tiny-target floor) => arglist traps. On => the vararg calling convention (a call site passes the
# variable arguments beyond the fixed params, recorded as the callee frame's variadic region), the
# arglist opcode builds a RuntimeArgumentHandle (an array of TypedReferences into those arg slots),
# and the System.ArgIterator BCL type walks it via the arg_iterator_* intrinsics -- a csc-compiled
# __arglist/ArgIterator program runs end to end (proven by run-with-corlib --features varargs).
# Implies typed-references (an ArgIterator iterates the handle as TypedReferences). A capability
# knob. (Note: lcsc does not yet PARSE __arglist -- that is a separate compiler csc-ism; the RUNTIME
# executes it.)
varargs = ["typed-references"]
# The floating-point transcendentals (Math.Sqrt/Sin/Cos/Tan/Pow/Log/Log10/Exp), backed by the
# `libm` crate. A floating-point knob: off => they bind nothing and libm is not compiled (the
# rounding + arithmetic float ops stay). FUTURE (for discussion): a fast/approximate backend
# (e.g. micromath) selectable against libm -- an accuracy-vs-size/speed knob.
math-transcendental = ["NETMFv4_4", "float", "dep:libm"]

[lints]
workspace = true
