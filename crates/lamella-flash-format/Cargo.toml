description = "Emit the firmware file formats a bootloader accepts by drag-and-drop: Intel HEX for DAPLink volumes (micro:bit and friends) and Microsoft UF2 for RP2040 / RP2350 BOOTSEL. Copying one file onto the board's USB mass-storage volume is the whole deployment step -- no probe, no vendor tool, no driver install."
