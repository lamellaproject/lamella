[package]
name = "lamella-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Loads an ECMA-335 assembly into a runnable lamella-cil-runtime module."

[dependencies]
lamella-cil = { path = "../lamella-cil" }
lamella-metadata = { path = "../lamella-metadata" }
lamella-token = { path = "../lamella-token" }
lamella-cil-runtime = { path = "../lamella-cil-runtime", default-features = false }
# The closed generic instantiation set and the canonical spelling that names each one. Optional
# because it is the `generics` capability's cost: a profile that refuses generics outright should
# not link a closure walk. THE SAME crate the AOT tier consumes -- one collector, one spelling, and
# the spelling is a v1-frozen wire identity that must not have a second implementation.
lamella-generics = { path = "../lamella-generics", optional = true }
[features]
# Mirror lamella-cil-runtime's BCL surface tiers + capability knobs, so a minimal loader build
# gates out the same bindings the interpreter does. The DEFAULT is the full desktop profile (the
# differential's run-with-corlib runner = full ECMA-335 1st-ed compliance, incl. typed references);
# a constrained target builds --no-default-features + an explicit subset.
default = ["NETMFv4_4", "exceptions", "float", "gc", "finalizers", "math-transcendental", "typed-references", "varargs", "real-memory", "debug-names", "generics"]
# Bake-time monomorphization: a closed generic instantiation becomes its own type identity, so a
# program naming `Pair<int,string>` runs instead of being refused. OFF turns the whole pass into the
# refusal that preceded it -- `ProfileViolation::UnloweredGeneric` still names every call site, so a
# build without this capability REFUSES a generic program rather than mis-running one.
generics = ["dep:lamella-generics"]
bcl = ["lamella-cil-runtime/bcl"]
NETMFv4_4 = ["bcl", "lamella-cil-runtime/NETMFv4_4"]
exceptions = ["lamella-cil-runtime/exceptions"]
gc = ["lamella-cil-runtime/gc"]
finalizers = ["gc", "lamella-cil-runtime/finalizers"]
# Floating-point support (Value::Float, float opcodes, float BCL). See lamella-cil-runtime.
float = ["lamella-cil-runtime/float"]
# String storage encoding (default off = UTF-16; on = UTF-8). See lamella-cil-runtime.
string-utf8 = ["lamella-cil-runtime/string-utf8"]
# WTF-8 string storage (UTF-8's size, UTF-16's surrogate parity). See lamella-cil-runtime.
string-utf8-wtf8 = ["lamella-cil-runtime/string-utf8-wtf8"]
# Typed references (mkrefany / refanyval / refanytype). Off by default. See lamella-cil-runtime.
typed-references = ["lamella-cil-runtime/typed-references"]
# Varargs (the arglist opcode; shell only). Off by default. See lamella-cil-runtime.
varargs = ["typed-references", "lamella-cil-runtime/varargs"]
# The floating-point transcendentals (Math.Sqrt/Sin/Pow/...), via libm. See lamella-cil-runtime.
math-transcendental = ["NETMFv4_4", "float", "lamella-cil-runtime/math-transcendental"]
# Host-only: compile the Real native-memory backend (the host allocator hands back real addresses --
# P/Invoke-capable + the faithful AOT behavior) and make Real the default mode.
# OFF = the Safe bounds-checked block table only (a constrained target's compile-time gate, so the
# unsafe path is never built). At runtime, LAMELLA_MEMORY_MODE=safe switches Real -> Safe.
real-memory = []
# The host-only `tls-mbedtls` feature and the tls_seam conformance test live in the separate
# lamella-host-tests crate, keeping their host-only dependencies out of this crate.
# Source-level debugger names: the loader records each method's qualified name + argument names (for
# the DAP backend / Session::this). Default ON (dev + the debugger); a constrained, non-debug profile
# omits it -- for the full corlib that drops ~300 KB of resident Strings, with only graceful loss of
# debugger name display. Nothing functional depends on the names.
debug-names = []
# Execute-in-place (XIP) foundation: forwards to lamella-cil-runtime/flash-image so the loader borrows
# each method's raw CIL as a `&'static [u8]` from the flash PE (see RawCil) instead of copying it into
# an owned Box. Off by default (the owned copy; non-XIP builds are byte-identical). On => the borrow;
# the load API then requires an `Assembly<'static>` (device flash ROM, or a host `Box::leak`), a bound
# threaded uniformly through the `FlashLifetime` seam.
flash-image = ["lamella-cil-runtime/flash-image"]
# The code_loading knob's two non-default levels, forwarded so a profile can pick the level at the
# loader crate. preload: decode every body at load, hold it resident (deterministic, RAM-rich).
# in_place (XIP): decode one instruction per step straight from the flash-resident code bytes --
# zero decoded-body RAM, ip a CIL byte offset; implies flash-image (the body must be a flash
# slice). Default (both off) = on_use lazy decode. See lamella-cil-runtime.
code-preload = ["lamella-cil-runtime/code-preload"]
code-in-place = ["lamella-cil-runtime/code-in-place", "flash-image"]
# The corlib_resolution knob's non-default level -- a composable PEER of code_loading above, not a
# level of it: code_loading picks how a METHOD BODY is represented, this picks how a submission's
# corlib MEMBERS are resolved. Default (off) = EAGER: the whole corlib loads into RAM and a
# submission binds against that resident module -- the host oracle, and right wherever RAM is ample.
# lazy: resolve each member out of the corlib PE on demand, materializing only what a submission
# actually reaches, which is a working set of kilobytes where the eager module is hundreds. The two
# tiers are observationally identical BY DESIGN -- lazy is a strategy, never a
# semantic -- so a submission must resolve to the same member either way.
#
# Lazy is only a win if the corlib PE is FLASH-RESIDENT: resolving out of a RAM copy of the corlib
# would cost more than the eager module it replaces, i.e. the knob would silently do the opposite of
# its purpose. Forwarding `flash-image` makes that structural rather than a documented hope, and the
# `compile_error!` in lib.rs catches a build that turns it back off downstream -- fail the LINK, not
# the RAM budget.
corlib-lazy = ["flash-image"]

[dev-dependencies]
# The FAT backend (with the mkfs formatter) -- so a test can install a real RAM-disk StorageProvider
# (MemoryBlockDevice + format + FatFs) and prove the mount-provider seam end to end over a real fs.
lamella-fs-fat = { path = "../lamella-fs-fat", features = ["format"] }
lamella-aot = { path = "../lamella-aot", default-features = false }

[lints]
workspace = true
