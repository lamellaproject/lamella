[package]
name = "lamella-wch-link"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "WCH-Link (RV mode) debug-probe host: the vendor USB command protocol wrapping a from-scratch RISC-V Debug Module core."

[dependencies]
# The host USB transport reuses the shared bulk backend (WinUSB on Windows, usbfs on Linux); it opens
# by VID/PID and matches any class-0xFF interface with bulk IN/OUT -- exactly the WCH-Link's interface 0.
lamella-usbbulk = { path = "../lamella-usbbulk", optional = true }

[dev-dependencies]
# Probe SELECTION for the examples, so one names WHICH WCH-Link it talks to. Opening by vendor/product
# alone takes whichever interface the OS hands over, and `ch32v003-flash` WRITES FLASH -- on someone
# else's target, successfully, with nothing in any log. `open_bulk` resolves through the ladder
# instead: explicit serial, then LAMELLA_PROBE_SERIAL, then the sole probe of that vid/pid, then
# REFUSE naming every candidate.
lamella-probe = { path = "../lamella-probe", features = ["usbbulk"] }

[features]
# The concrete host USB transport (a `Transport` impl over lamella-usbbulk). Off by default so the
# protocol + Debug Module core build + unit-test with no USB backend.
usbbulk = ["dep:lamella-usbbulk"]

[lints]
workspace = true
