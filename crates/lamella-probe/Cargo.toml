[package]
name = "lamella-probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Debug-probe discovery, selection, and capability negotiation -- the transport-neutral layer above lamella-cmsis-dap. Enumerates attached probes across transports, picks the DAP interface on a composite probe, negotiates DAP_Info, and hands back a connected Dap. CMSIS-DAP (v1 HID, v2 bulk) is the first probe family."

[lints]
workspace = true

[features]
default = []
# Also discover CMSIS-DAP v2 probes (a WinUSB vendor-bulk interface) via lamella-usbbulk, not only
# v1 HID. Off by default: the v1-HID path needs no extra transport, and v2 GUID-agnostic discovery
# is a separate slice.
usbbulk = ["dep:lamella-usbbulk"]

[dependencies]
# The probe protocol (Dap<T: Transport>, DapError, DAP_Info). No transport features: this crate
# supplies its own `Transport` over the concrete USB backends below.
lamella-cmsis-dap = { path = "../lamella-cmsis-dap", default-features = false }
lamella-usbhid = { path = "../lamella-usbhid" }
lamella-usbbulk = { path = "../lamella-usbbulk", optional = true }
