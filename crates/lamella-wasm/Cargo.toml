[package]
name = "lamella-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Embedding the Lamella interpreter (WebAssembly and other hosts): run an assembly, capture its result."

# cdylib produces the host-agnostic .wasm; rlib lets the core be used natively and tested.
publish = false
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lamella-load = { path = "../lamella-load" }
lamella-metadata = { path = "../lamella-metadata" }
lamella-cil-runtime = { path = "../lamella-cil-runtime" }
# The MethodDef token for srcmap's module.resolve (source-map export, used under `bake`).
lamella-token = { path = "../lamella-token" }
# The debugger, and a JSON codec for its wire messages: the DAP feature takes it with its
# interpreter, and the probe's debugger without one, over the device backend below.
lamella-dap = { path = "../lamella-dap", optional = true, default-features = false }
# The device debug backend, for the probe's debugger: it drives the part a probe session reaches,
# and reads the program's line table, functions, frames and variables from its debug ELF.
lamella-debug-device = { path = "../lamella-debug-device", optional = true }
# The compile feature pulls in the compiler (source -> assembly) for in-page builds.
lamella-assemble = { path = "../lamella-assemble", optional = true }
# Completion (IntelliSense) drives the binder + parser directly.
lamella-binder = { path = "../lamella-binder", optional = true }
lamella-syntax = { path = "../lamella-syntax", optional = true }
serde_json = { version = "1", optional = true }
# The AOT backend, for the in-page chip/wasm exporter (lamella_aot_build). Default features bring the
# ARM32 backend (chip images); enable lamella-aot's `wasm` feature too for the C# -> .wasm widget path.
lamella-aot = { path = "../lamella-aot", optional = true }
# The board catalog, for the bus table a linked build for a board lays into its image
# (lamella_aot_build_linked): the table the command line lays, from the same generated files.
lamella-catalog = { path = "../lamella-catalog", optional = true }
# The archive reader, so a linked build refuses a runtime-support archive that is not one by name.
lamella-elf = { path = "../lamella-elf", optional = true }
# The probe feature pulls in the CMSIS-DAP command layer, the shared MEM-AP / Cortex-M layer, and
# the per-part flash routines, so a browser drives real silicon through the SAME code a native
# deploy drives it through. `default-features = false` because the CMSIS-DAP crate defaults to its
# native USB-HID transport, which has no wasm32 backend -- here the host supplies the transport.
lamella-cmsis-dap = { path = "../lamella-cmsis-dap", optional = true, default-features = false }
lamella-probe-core = { path = "../lamella-probe-core", optional = true }
lamella-cmsis-dap-nrf = { path = "../lamella-cmsis-dap-nrf", optional = true }
lamella-cmsis-dap-rp2350 = { path = "../lamella-cmsis-dap-rp2350", optional = true }
lamella-cmsis-dap-rp2040 = { path = "../lamella-cmsis-dap-rp2040", optional = true }
# The probe feature also follows a program's console ring in a board's RAM, through the same reader
# `lamella run --manifest` follows it with, and finds the ring in the image's ELF.
lamella-probe-console = { path = "../lamella-probe-console", optional = true }
# The py feature pulls in the Python front end + runtime for the in-page Python runner.
lamella-py-frontend = { path = "../lamella-py-frontend", optional = true }
lamella-py-runtime = { path = "../lamella-py-runtime", optional = true }
# The repl feature pulls in the carrier-neutral tier-0 REPL engine for the in-page C# REPL. Its
# default features (the serial carrier + the csc `repl-host` front end) are host-only and not
# wasm-buildable, so take only the carrier-neutral core (--no-default-features); this crate supplies
# the compiler (over `compile`) and uses the engine's in-process LoopbackLink for the run side.
lamella-wire-host = { path = "../lamella-wire-host", optional = true, default-features = false }

[dev-dependencies]
# The debug agent's tests compile their programs, so a program's source sits beside what it checks.
lamella-assemble = { path = "../lamella-assemble" }
# The probe agent's console tests write the ELF a ring is found in, as the class-library build does.
lamella-elf = { path = "../lamella-elf" }

[features]
# Adds the lamella_selftest export so a wasm host can validate the module end to end
# with a single --invoke. Off by default.
selftest = []
# Adds the in-page DAP agent (lamella_dap_create/request/dispose) for browser
# debugging. Off by default so the run-only .wasm stays lean (no serde).
dap = ["dep:lamella-dap", "lamella-dap/interpreter", "dep:serde_json"]
# Adds the in-page compiler (lamella_compile: C# source -> assembly + PDB + diagnostics)
# and completion (lamella_complete) so Lamella Code builds + assists the user's
# own code client-side. Off by default.
compile = [
    "dep:lamella-assemble",
    "dep:lamella-binder",
    "dep:lamella-syntax",
    "dep:serde_json",
]
# Adds the in-page AOT exporter (lamella_aot_build: CIL -> a flashable chip image, e.g. micro:bit, or
# a .wasm widget) so Lamella Code compiles the user's C# all the way to a microcontroller image client-side.
# serde_json carries the build's `{ error }` envelope, so a failed lowering reports WHY to the page
# instead of collapsing into an empty buffer. It also adds the class-library build
# (lamella_aot_build_linked): the program linked with corlib, its libraries and a board's
# runtime-support archive, with the board's bus table, as the command line builds it for a board.
aot = [
    "dep:lamella-aot",
    "lamella-aot/linked",
    "dep:lamella-catalog",
    "dep:lamella-elf",
    "dep:serde_json",
]
# Adds the in-page debug-probe agent (lamella_probe_create/request/flash/dispose): CMSIS-DAP over a
# host-supplied packet transport, the ADIv5 MEM-AP and Cortex-M run control above it, and the
# per-part flash routines -- so a page connects a real probe, programs a chip and debugs it -- and
# follows the program's console ring in the board's RAM without halting it
# (lamella_probe_follow_console and the `consolePoll` request). This is the Debug ACCESS PORT and is
# unrelated to the `dap` feature, which is the Debug ADAPTER PROTOCOL agent for a program running in
# this module. Off by default.
probe = [
    "dep:lamella-cmsis-dap",
    "dep:lamella-probe-core",
    "dep:lamella-cmsis-dap-nrf",
    "dep:lamella-cmsis-dap-rp2350",
    "dep:lamella-cmsis-dap-rp2040",
    "dep:lamella-probe-console",
    "dep:serde_json",
]
# Adds the probe's debugger (lamella_probe_debug_create/request/poll/running/dispose): a Debug
# Adapter Protocol session over the program on the part a probe session reaches, driven through that
# same session -- breakpoints, stepping, the call stack and variables, read from the program's debug
# ELF. It is the adapter over the device debug backend, without the interpreter the `dap` feature
# carries. Pulls in `probe`. Off by default, so a probe build without it keeps its size.
probe-debug = ["probe", "dep:lamella-dap", "dep:lamella-debug-device"]
# Adds the in-page Python runner (lamella_py_run: Python source -> compile + run main() -> rendered
# result + diagnostics) so Lamella Code compiles + runs the user's Python client-side. Off by default.
py = ["dep:lamella-py-frontend", "dep:lamella-py-runtime"]
# Adds the in-page stateful C# REPL (lamella_repl_new/eval/reset) over lamella-wire-host's
# carrier-neutral tier-0 REPL engine, so Lamella Code runs the SAME read-compile-eval-print engine the
# CLI does. Pulls in `compile` (the in-wasm compiler the REPL's compile seam wraps). Off by default.
repl = ["dep:lamella-wire-host", "compile"]
# Adds the in-page baker (lamella_bake: corlib + library + app -> a self-contained .lmli flash image)
# so Lamella Code bakes a compiled app to a deployable device image client-side, between compiling in
# the page and deploying from it. Pulls the loader's baked-image (code-in-place) + kernel profile surface.
# Off by default.
bake = [
    "dep:serde_json",
    "lamella-load/code-in-place",
    "lamella-load/bcl",
    "lamella-load/exceptions",
    "lamella-load/gc",
]

[lints]
workspace = true
