[package]
name = "lamella-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Storage composition glue: brings up a memory card (SD/MMC over SPI) and mounts it as a FAT filesystem backend for the interpreter's fs seam. The native seam a managed mount call crosses -- it wires lamella-sd-spi (the block device) to lamella-fs-fat (the file system) and hands back the boxed FsBackend, naming neither a board below nor an exception above."

[dependencies]
# The fs seam the composed backend installs into. `default-features = false` keeps this glue off the
# interpreter's BCL/GC/float surface, exactly as the two crates it composes do.
lamella-cil-runtime = { path = "../lamella-cil-runtime", default-features = false }
# The block device: an SD/MMC card over a board-supplied SPI bus. `write` so the mounted volume is
# writable.
lamella-sd-spi = { path = "../lamella-sd-spi", default-features = false, features = ["write"] }
# The file system that turns the card's sectors into files and directories.
lamella-fs-fat = { path = "../lamella-fs-fat" }

[dev-dependencies]
# The integration test proves the glue over the REAL SD driver with no hardware: `sim` supplies the
# in-memory card, `format` lays a fresh FAT volume onto it through the driver's own write path.
lamella-sd-spi = { path = "../lamella-sd-spi", default-features = false, features = ["write", "sim"] }
lamella-fs-fat = { path = "../lamella-fs-fat", features = ["format"] }

[lints]
workspace = true
