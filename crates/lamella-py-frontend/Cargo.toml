[package]
name = "lamella-py-frontend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lamella's Python 3 front end: lexer, parser, our versioned bytecode, and the typed Python-to-MIR lowering."
publish = false

[dependencies]
lamella-py-bytecode = { path = "../lamella-py-bytecode" }
lamella-ir = { path = "../lamella-ir" }
# Identifier tables and NFKC, shared with the JS front end, the regexp engine and the Python runtime
# rather than restated here: PEP 3131 spells an identifier `xid_start xid_continue*` and normalizes
# it, and both halves of that are already generated from one UCD pin.
lamella-unicode = { path = "../lamella-unicode" }

[dev-dependencies]
lamella-flash-format = { path = "../lamella-flash-format" }
lamella-aot = { path = "../lamella-aot" }
lamella-asm-arm32 = { path = "../lamella-asm-arm32" }
lamella-elf = { path = "../lamella-elf" }
lamella-link = { path = "../lamella-link" }

[lints]
workspace = true
