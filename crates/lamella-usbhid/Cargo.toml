[package]
name = "lamella-usbhid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Cross-platform USB-HID transport (macOS, Linux, Windows) for CMSIS-DAP debug probes: native IOKit on macOS, hidraw on Linux, and the windows-sys Win32 bindings on Windows."
publish = false

[target.'cfg(windows)'.dependencies]
# Win32 bindings for the HID backend (SetupAPI + HID.dll + file/event I/O). windows-sys is the
# lighter, more stable of the two official options -- no proc-macro graph, fewer breaking refinements.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_HumanInterfaceDevice",
    # DEVPROPKEY / DEVPROPTYPE. The HID usage page and usage are device-interface PROPERTIES, so
    # enumeration can tell a probe from a keyboard without opening either of them -- and opening a
    # probe is what disturbs the board wired to it.
    "Win32_Devices_Properties",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# `poll(2)`, so a read can honour its timeout. Without it the hidraw read blocks forever when no
# report is queued -- which is exactly the state `Device::drained` reads in, so every open hung.
# The sibling `lamella-usbbulk` takes the same dependency on this platform for the same kind of
# reason; nothing else here needs libc, and the rest of the backend stays `std::fs` only.
libc = "0.2"

[lints]
workspace = true
