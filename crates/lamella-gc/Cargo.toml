[package]
name = "lamella-gc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A garbage-collection contract and its mark-compact collector: root reporting, the trace and allocator seams."

# A leaf: the GC contract and engine, with no dependencies of its own.
publish = false
[dependencies]

# Tests only, and one test only: `tests/the_backend_writes_what_this_crate_reads.rs` decodes bytes
# produced by the emitter itself rather than by a copy of it. A dev-dependency does not reach a
# consumer, so the crate stays the leaf its description claims.
[dev-dependencies]
lamella-aot = { path = "../lamella-aot" }

[features]
default = ["gc-collect", "host-heap"]
# The `Vec`-backed HOST heap and everything that needs a Rust global allocator: `Heap` itself, the
# `TypeDesc`/`StackMapTable` decoded forms, the allocating `mark_compact`, and the host index-ABI
# entry points in `device`. ON by default, so every existing consumer is unchanged.
#
# OFF is what lets this crate link into a binary that HAS NO GLOBAL ALLOCATOR -- the C# AOT image,
# whose only allocator is `lamella_gc_alloc` itself. That image gets `DeviceHeap`, the `TypeResolver`
# contract and `mark_compact_no_alloc`, which allocate nothing. Measured: with this feature on, the
# staticlib fails to build with "no global memory allocator found but one is required" the moment the
# crate is linked at all, whatever function is called -- an unconditional `extern crate alloc`
# reaches the final crate graph on its own.
host-heap = []
# The mark-compact COLLECTOR ENGINE (Heap/DeviceHeap collect, the frame/stack walks, the
# OOM retry-collect). Off = the `gc = bump` allocation mode: `alloc` stays (grow-only) and
# the whole tracing engine compiles out of the binary; an out-of-memory allocation is
# final (null / fail loud). The capability profile's `gc` knob selects this per target:
# none (no heap at all -- the consumer's own gate), bump (this feature off), collected
# (this feature on).
gc-collect = []

[lints]
workspace = true
