[package]
name = "lamella-wire-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Host side of the Lamella Link debug + REPL channel: a serial (USB-CDC / UART) Transport over lamella-wire, and the host-stateless REPL -- the host compiles a submission and the target runs the CIL + returns its output. The reference runner runs in-process for host-side testing; the same runner core flashes onto a device behind the wire."
publish = false

[dependencies]
lamella-clock-host = { path = "../lamella-clock-host" }
# The no_std runner core (run_program / serve_one / RunResult / repl), shared with the on-device firmware;
# it pulls in the interpreter stack (lamella-load / -cil-runtime / -metadata) transitively.
lamella-runner = { path = "../lamella-runner" }
lamella-wire = { path = "../lamella-wire" }
# Host-only: the operating system's serial port, the carrier for the USB-CDC / UART transport.
# OPTIONAL + behind the `serial` feature, so a WASM build (Lamella Code's REPL worker) compiles the
# carrier-neutral REPL core -- run_program + the driver + the protocol -- without it.
lamella-serial-port = { path = "../lamella-serial-port", optional = true }
# Host-only: the native-USB (driverless WinUSB) bulk carrier -- the fast interpreter-flash path for a
# board with a native USB device peripheral (a WinUSB vendor interface). OPTIONAL, behind the usb feature.
lamella-usbbulk = { path = "../lamella-usbbulk", optional = true }
# The project's own C# compiler (lcsc), behind `repl-host`: the engine's [`LcscCompiler`] compiles a
# submission IN-PROCESS -- the same compiler the `lamella-repl` CLI and the DAP Debug Console drive.
# (No csc: it resolves BCL types against the .NET reference assemblies, not Microsoft's compiler.)
# The interpreter's `Vm`, for the clock seam `LoopbackLink` installs through the runner's configure
# hook. Already in the tree via lamella-runner; declared so this crate can NAME the type that hook
# hands it, which is the same reason lamella-load is declared below.
lamella-cil-runtime = { path = "../lamella-cil-runtime" }
lamella-assemble = { path = "../lamella-assemble", optional = true }
lamella-metadata = { path = "../lamella-metadata", optional = true }
# Names the member a call token stands for, so a refusal names each place a baked image would stop
# (`refusal`). Already in the tree via lamella-metadata.
lamella-token = { path = "../lamella-token", optional = true }
# The `baked` link's host-side bake step (load the submission's PE, write the flash image).
# Already in the tree via lamella-runner; declared so the link can name its API.
lamella-load = { path = "../lamella-load", optional = true, default-features = false }
# The board catalog, behind `boards`: a build for a board takes that board's bus table and its chip
# family's builds, and a route to running firmware builds for the board whose product model answered.
lamella-catalog = { path = "../lamella-catalog", optional = true }
# The debug seam (the DebugBackend trait, a dependency-free leaf): WireHostBackend
# implements it over the wire's debug channel, so lamella-dap drives a DEVICE unchanged.
lamella-debug-backend = { path = "../lamella-debug-backend", optional = true }
# Host-only (debug-backend): parse the pre-built source map JSON (method_id -> source lines) so a Lamella Link debug
# session is SOURCE-LEVEL, not IL-level.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# The serial (USB-CDC / UART) transport. Default ON for a host build; a wasm32 build turns it off
# (--no-default-features) and supplies its own Transport (a Worker / in-process channel).
default = ["serial", "repl-host"]
serial = ["dep:lamella-serial-port", "carrier"]
# The native-USB (driverless WinUSB) carrier (UsbTransport), for a board with a native USB device
# peripheral. Host-only; coexists with serial (a host build can drive either).
usb = ["dep:lamella-usbbulk", "carrier"]
# The TCP carrier (TcpTransport): a board reached across a network instead of down a cable, either
# because it serves Lamella Link on its own network interface or because a relay daemon on a
# companion processor serves it on the board's behalf. std only -- no new dependency.
tcp = ["carrier"]
# "at least one carrier is present". Cargo's `required-features` is an AND, so a tool that works
# over ANY carrier cannot say so directly -- gating it on `serial` would hide it from a build that
# has only the network one, which is the whole point of having moved the dispatch out of the tools.
# Each carrier enables this, and the tools that go through `open_target` require it instead.
carrier = []
# The host REPL front-end: the interactive engine + the in-process `LcscCompiler` compile seam, and
# the host REPL integration test over them (#[ignore]'d -- it needs the .NET reference assemblies
# present). A wasm build leaves this off (the browser compiles in-process via lamella-wasm), keeping
# the carrier-neutral core.
repl-host = ["dep:lamella-assemble", "dep:lamella-metadata"]
# For TESTS ONLY: `LcscCompiler::discover` also looks at this source tree's test corlib
# (`crates/lamella-load/tests/fixtures/corlib.dll`), before the places a user's build looks. A crate
# that tests through the search turns this on in its `[dev-dependencies]`, so its tests bind that
# corlib wherever they run, and nothing built for use ever looks there: a tool that fell back to
# it would run a program against a test input instead of the class library, and say nothing.
fixture-corlib = []
# A build for a package: `LcscCompiler::discover` never looks into the source tree this crate was
# compiled from (its `managed/` and `libs/`), which a packaged tool does not have and whose path it
# must not carry. `lamella-cli`'s feature of the same name turns it on.
packaged = []
# For TESTS ONLY: `loopback`, a board's deploy serve in the test's own process over a flash region in
# memory, for the tests of a host that sends a program to firmware. A crate turns it on in its
# `[dev-dependencies]`. It exists only where `baked` is on as well, and implies nothing, so a test
# build without the bake is not given it.
loopback-board = []
# The baked-image link for PE-less targets (Capabilities::BAKED_IMAGE): each submission's
# compiled PE is loaded + baked host-side and the IMAGE crosses the wire (BakedSerialLink,
# eval_image_blocking). Forwards the runner's baked-image knob (which pins loads to
# Assembly<'static>; the link leaks one buffer per evaluation, the accepted host pattern).
baked = ["lamella-runner/baked-image", "dep:lamella-load", "dep:lamella-metadata", "dep:lamella-token", "boards"]
# A build for a board (`boards`): the reference set it compiles against, with the board's chip-family
# builds in place of the shared ones, the bus table its image carries, and the board a HELLO answers
# as. The `lamella` command builds for a board without baking (its linked tier), so this stands apart
# from `baked`, which takes it.
boards = ["repl-host", "dep:lamella-catalog"]
# WireHostBackend: the lamella-debug-backend seam over the wire's debug channel (serial
# carrier). A code location crosses the seam as an opaque address packing the wire's
# (method_id, offset) pair.
debug-backend = ["serial", "dep:lamella-debug-backend", "dep:serde", "dep:serde_json"]

# (The interactive REPL CLI lives in the dedicated `lamella-repl` crate; lamella-wire-host is
# the host library that CLI builds on.)

[lints]
workspace = true

[dev-dependencies]
lamella-flash-format = { path = "../lamella-flash-format" }
# A test compiles a library named as the corlib is, which takes the lexer's library target.
lamella-syntax = { path = "../lamella-syntax" }
