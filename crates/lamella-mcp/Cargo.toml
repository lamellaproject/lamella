[package]
name = "lamella-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native Lamella MCP server: exposes the toolchain to AI agents over stdio (JSON-RPC 2.0). Default build = check / run on this machine / boards / fit / enumerate / identify / flash. Build `--features bake` for the on-device path (size / bake / deploy / run-on-device / Lamella Link source-level debug), which needs lamella-load's non-additive `code-in-place`. A thin front-end over the SAME lamella-wire-host / lamella-dap seams the CLIs use."
publish = false

[dependencies]
# DEFAULT surface (compile / run / enumerate / identify / deploy-status): the Lamella Link REPL engine (host
# compile + run: LcscCompiler + engine::Repl), the carriers a device tool opens through `open_target` --
# serial, the board's own USB and a board on a network (tcp) -- with UsbTransport::list / list_serial, and
# the wire debug backend TYPES. NO `baked` here -- see the `bake` feature, which is the only thing that
# pulls lamella-load's `code-in-place`.
# `boards`: the reference set a program compiles against, cut to the libraries a call names, and for a
# device tool, the board that answered with its chip family's builds.
lamella-wire-host = { path = "../lamella-wire-host", features = ["repl-host", "serial", "usb", "tcp", "debug-backend", "boards"] }
# The wire protocol types: Capabilities / Negotiated / ProfileIdentity / product_model for the HELLO identify path.
lamella-wire = { path = "../lamella-wire" }
# The board/part fact tables and a board's resolution to its part row, and the RULE computed over
# them. Both are shared with the `lamella` CLI rather than restated: a board that resolved one way
# for a developer typing `lamella fit` and another way for an assistant calling `lamella_fit` is
# the drift the fact strata exist to prevent, and nobody is positioned to see both answers at once.
lamella-catalog = { path = "../lamella-catalog" }
# The flashing routes and the contract, so `lamella_flash` writes a board by exactly the mechanism
# `lamella flash` would -- one table, one set of refusals, two front ends.
lamella-flash-routes = { path = "../lamella-flash-routes" }
lamella-flash-backend = { path = "../lamella-flash-backend" }
lamella-bsp-gen = { path = "../lamella-bsp-gen" }
# The interpreter's machine, named so the process that runs a `lamella_run` program can bound what
# that program may hold (its live objects and its console) through the engine's configure hook.
lamella-cil-runtime = { path = "../lamella-cil-runtime" }
# JSON-RPC 2.0 framing, the DAP JSON, and the embedded tool contract. serde_json only -- no tokio, no MCP SDK.
serde_json = "1"

# BAKE-only deps (behind the `bake` feature). `code-in-place` is NON-ADDITIVE -- it cfg's out
# `Module::method_body` and switches `load`/`Program` to the 'static flash model -- so if it reached the SHARED
# lamella-load in a default / `--workspace` build, lamella-dap's interpreter backend + lamella-repl (which load
# from local bytes) would fail to compile. Gating these keeps the workspace green; the full server is
# `cargo build -p lamella-mcp --features bake`.
lamella-load = { path = "../lamella-load", optional = true }
lamella-dap = { path = "../lamella-dap", default-features = false, optional = true }
lamella-debug-backend = { path = "../lamella-debug-backend", optional = true }
lamella-assemble = { path = "../lamella-assemble", optional = true }
lamella-metadata = { path = "../lamella-metadata", optional = true }
lamella-token = { path = "../lamella-token", optional = true }

[dev-dependencies]
# The reference-assembly search as a TEST build makes it: it also looks at this source tree's test
# corlib, first, so these tests bind that corlib wherever they run. Nothing built for use looks there.
# And the board a test sends a program to: a board's deploy serve in the test's process, which exists
# only in a build with `bake`.
lamella-wire-host = { path = "../lamella-wire-host", default-features = false, features = ["fixture-corlib", "loopback-board"] }

[features]
# The on-device BAKE / DEPLOY / RUN-ON-DEVICE / DEBUG path: compile -> bake (`Module::write_baked`, needs
# `code-in-place`) -> `.lmli`, the baked-image run-on-device link, and the Lamella Link source-level debug session
# (drives lamella_dap::Debugger over WireHostBackend). Default-OFF so the non-additive `code-in-place` never
# reaches the workspace's shared lamella-load.
bake = [
    "dep:lamella-load", "lamella-load/code-in-place",
    "lamella-wire-host/baked",
    "dep:lamella-dap",
    "dep:lamella-debug-backend",
    "dep:lamella-assemble",
    "dep:lamella-metadata",
    "dep:lamella-token",
]

[[package.metadata.lamella.test-configuration]]
name = "bake"
args = ["--features", "bake"]
why = "the on-device path (size, bake, deploy, run on a board, source-level debug) and a .NET IoT program run on a board over stdio, which are off in a workspace build"

[lints]
workspace = true
