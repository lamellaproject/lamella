[package]
name = "lamella-cmsis-dap-sam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Microchip SAM (ATSAMD21, ...) flash programming over the Lamella CMSIS-DAP debug stack -- a device-specific extension of lamella-cmsis-dap."

[lints]
workspace = true

[dependencies]
# The probe-neutral seam. These flash routines are written against `TargetAccess`, so they drive a
# target through any probe family the seam supports, not just a CMSIS-DAP one.
lamella-probe-core = { path = "../lamella-probe-core" }
lamella-cmsis-dap = { path = "../lamella-cmsis-dap" }

[dev-dependencies]
lamella-cmsis-dap = { path = "../lamella-cmsis-dap", features = ["test-util"] }
# Real-probe HID access for the examples.
lamella-usbhid = { path = "../lamella-usbhid" }
# Probe discovery/selection, so examples targeting a board on a COMPOSITE probe (e.g. the Arduino
# Due behind an MCU-Link, whose DAP interface must be selected out of several) can open it.
lamella-probe = { path = "../lamella-probe" }
