[package]
name = "lamella-runtime-support-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The AOT image's networking + TLS runtime-support layer: C-ABI entry points over the same NetBackend (smoltcp) and TlsBackend (mbedTLS) seams the interpreter uses, so one native stack serves both tiers. Compiled into the per-target runtime-support archive (tools/runtime-support, feature `net`); the board firmware installs its phy::Device at boot."

[dependencies]
lamella-cil-runtime = { path = "../lamella-cil-runtime", default-features = false }
lamella-net-smoltcp = { path = "../lamella-net-smoltcp" }
smoltcp = { version = "0.12", default-features = false, features = ["medium-ethernet", "proto-ipv4", "socket-tcp", "alloc"] }
lamella-tls-mbedtls = { path = "../lamella-tls-mbedtls", optional = true }

[features]
# TLS entry points over the vendored mbedTLS engine. Optional: its C cross-build wants an
# ARM GCC on the path, and a plain-TCP image should not pay for it.
tls = ["dep:lamella-tls-mbedtls"]

[lints]
workspace = true
