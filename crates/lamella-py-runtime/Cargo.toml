[package]
name = "lamella-py-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lamella's Python runtime: the bytecode interpreter, the dynamic object model, and built-ins."
publish = false

[features]
default = ["gc-collect", "float", "complex", "bundled-stdlib", "introspection"]
float = ["dep:libm"]
complex = ["float"]
bundled-stdlib = []
introspection = []
gc-collect = ["lamella-gc/gc-collect"]
gc-none = []

[dependencies]
# The single shared collector; the interpreter scans its tagged-value slots by tag through this
# contract. `default-features = false` so THIS crate's `gc-collect` feature drives lamella-gc's
# collector-engine gate (the `bump` tier drops it).
lamella-gc = { path = "../lamella-gc", default-features = false }
# The shared bytecode contract (single source of truth): the interpreter executes
# what the front end emits, so both depend on this one definition of the bytecode.
lamella-py-bytecode = { path = "../lamella-py-bytecode" }
# The shared scheduler reactor: the ONE OS block point, as a leaf crate with no dependencies of its
# own so anything may take it. This runtime supplies a `ReactorEnv` (its clock, and its network seam
# when it has one) and drives that shared implementation rather than writing a second event loop --
# which is what its own charter asks for, naming "a sibling language runtime's event loop".
lamella-reactor = { path = "../lamella-reactor" }
lamella-net-core = { path = "../lamella-net-core" }
# The shared Unicode Character Database properties: str predicates (isalpha/isspace/...)
# classify code points exactly as CPython, from one tree-shakeable table.
# `normalization` is on for ONE THING IN IT -- `full_case_fold`, the `C`+`F` rows of CaseFolding.txt
# that `str.casefold()` needs. The feature name is wider than what a Python image links: measured on
# `same54-py` (thumbv7em, flash profile), turning it on grew the loadable image 495,784 -> 506,288
# bytes, +10,504, which is the fold tables and 56 bytes of code. The NFC/NFD decomposition and
# composition tables (~134 KiB) are in the same tier and the linker drops every one of them, because
# nothing here calls `normalize`. A narrower `folding` feature would name the cost honestly, and it
# would change what this line SPELLS rather than what the image WEIGHS -- the tables the linker
# already drops do not come back either way.
lamella-unicode = { path = "../lamella-unicode", default-features = false, features = ["normalization"] }
# The shared code-point byte codec. A Python `str` is a sequence of CODE POINTS and a Rust `String`
# is a sequence of SCALAR VALUES; the difference between those two sets is exactly the surrogate
# block, so the string arena holds WTF-8 bytes rather than a `String`. This crate is the ONE
# definition of that byte form, shared with the C# string tiers and with the constant pool the front
# end emits, so a `str` cannot mean different bytes in a baked image than it does on the heap.
lamella-wtf8 = { path = "../lamella-wtf8" }
# The MUSL/fdlibm port (an accurate `no_std` libm). `core` has the f64 arithmetic operators but NOT
# floor/fmod, which the float `//` and `%` need (CPython's exact float_divmod), so bind them here
# rather than hand-roll fdlibm.
# Twenty-four distinct `libm` functions are referenced, not just those three: `math` binds `pow`,
# `log`, `log2`, `log10`, `exp`, `exp2`, `sqrt`, `hypot`, `sin`, `cos`, `tan`, `asin`, `acos`,
# `atan`, `atan2`, `ldexp`, `frexp`, `modf`, `copysign`, `fabs` and `ceil` on top of them. In the
# linked micro:bit v2 firmware `libm` is about 19 KB, and none of it dead-strips while `math` is
# reachable -- `float` is the knob that drops it.
libm = { version = "0.2.16", optional = true }

[dev-dependencies]
lamella-py-frontend = { path = "../lamella-py-frontend" }

[lints]
workspace = true
