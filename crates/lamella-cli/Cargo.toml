[package]
name = "lamella-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The `lamella` command-line tool: the developer-facing surface over the toolchain. Default build = devices / run / build / boards / fit / reconcile. Build `--features bake` for the flash image and `deploy`, which needs lamella-load's non-additive `code-in-place` and so cannot be on in a workspace build."
publish = false

[[bin]]
name = "lamella"
path = "src/main.rs"

[dependencies]
# The chip/board fact strata and the fit verdict computed from them. The CLI is a CONSUMER of
# that rule, never a second implementation of it: the same function answers the MCP tool and the
# editor, so a board's budget cannot mean one thing on one surface and another elsewhere.
lamella-bsp-gen = { path = "../lamella-bsp-gen" }
# The board and part fact files, compiled in from `bsp/` and `csp/`, and how a board resolves to its
# part row. A CRATE rather than a module here so the MCP server resolves a board the SAME way: two
# surfaces over one toolchain that disagreed about a board would be the drift the fact strata exist
# to prevent, with nobody positioned to see both answers at once.
lamella-catalog = { path = "../lamella-catalog" }
# The flashing contract, and the probe-neutral target seam a backend drives its part through. The
# backends live in `backends.rs`: a per-part crate owns its flash controller, and what sequences a
# whole image onto a whole board is a separate layer with one home.
lamella-flash-backend = { path = "../lamella-flash-backend" }
# The routes: which mechanism writes which board, the backends that drive them, and the artifact
# formats each route takes. A LIBRARY rather than modules here, because the MCP server has to reach
# the same table -- a board that means one thing to `lamella flash` and another to `lamella_flash`
# is the failure that split prevents.
lamella-flash-routes = { path = "../lamella-flash-routes" }
lamella-probe-core = { path = "../lamella-probe-core" }
# The host compile-and-run seam (LcscCompiler + the REPL engine's LoopbackLink), the device
# enumeration behind `devices`, and the target grammar every verb taking `--target` shares. The
# SAME seams the MCP server and lamella-dap use.
lamella-wire-host = { path = "../lamella-wire-host", features = ["repl-host", "serial", "usb"] }
# The wire protocol types: Capabilities / Negotiated / board_model, for what `devices --identify`
# reports back off a board.
lamella-wire = { path = "../lamella-wire" }
# The C# front end, called DIRECTLY by `build` rather than through the REPL compile seam, so the
# assembly carries the FILE's name and the FILE's source path. The seam names everything `__Repl`
# against `Repl.cs`, which is right for a submission typed at a prompt and wrong for an artifact
# written to disk -- the name is what another assembly references and the path is where a debugger
# looks. `run` still uses the seam, where neither is observable.
lamella-assemble = { path = "../lamella-assemble" }
lamella-metadata = { path = "../lamella-metadata" }
# The compile options `--unsafe` sets. csc gates unsafe code behind `/unsafe` and so does lcsc, so
# a driver that parses a command line has to carry the switch rather than decide for the user --
# and a device program that writes registers through raw pointers needs it.
lamella-syntax = { path = "../lamella-syntax" }
# The ahead-of-time backend, for `flash`: a CIL assembly to a flashable bare-metal image. This is
# the FLAT, linker-free path, and it needs nothing on the board -- which is why `flash` works on a
# board that has never run Lamella.
lamella-aot = { path = "../lamella-aot", features = ["arm32"] }
# Flattening a linked ELF into the bytes a flasher writes -- the same computation as
# `objcopy -O binary`, in-tree, so taking an image somebody else's toolchain produced needs no
# external tools. A linked ELF is the ordinary output of every toolchain that is not ours, which
# is exactly the case `flash` exists for: bytes whoever built them.
lamella-elf = { path = "../lamella-elf" }
# Writing that image over a board's on-board debug probe. Its `microbit` feature is what pulls the
# probe-SELECTION ladder: these helpers WRITE FLASH, so they resolve WHICH board rather than taking
# the first `0d28:0204` the operating system offers -- a write to the wrong board succeeds and
# reports nothing. The CLI consumes that ladder; it does not select a probe itself.
lamella-cmsis-dap-nrf = { path = "../lamella-cmsis-dap-nrf", features = ["microbit"] }
# Writing an RP2350 over a GENERAL-PURPOSE probe, by the chip's own bootrom flash API. The route
# `--via probe` selects, and the only route to that part which reads the written flash back -- a
# bootloader-volume write cannot be checked at all. Never a default: a person who owns no probe has
# to be able to flash a new Pico, so the volume stays what the board takes unless asked otherwise.
lamella-cmsis-dap-rp2350 = { path = "../lamella-cmsis-dap-rp2350" }
# The UF2 container: emitting one, and RECOGNIZING one. Both verbs funnel through `write_image`,
# which wraps a flat image for a volume route -- and must not wrap one that is already wrapped,
# because a doubly-wrapped UF2 is a file the bootloader ignores without saying so.
lamella-flash-format = { path = "../lamella-flash-format" }
# Probe ENUMERATION -- for the interactive picker, so an ambiguous bench can be resolved by asking
# rather than only by refusing, and for the `devices` listing.
# `usbbulk` IS NOT OPTIONAL HERE. Without it this crate discovers CMSIS-DAP v1 (HID) probes only,
# and every RPi Debug Probe is v2 over USB bulk -- so a bench with nine of them attached would list
# none, and report that absence as though it had looked. A listing that cannot see a whole probe
# family is worse than no listing: it answers "nothing is attached" with authority.
lamella-probe = { path = "../lamella-probe", features = ["usbbulk"] }
# The Python tier: the front end that bundles a program and the interpreter that runs one, so
# `run` and `build` take a .py exactly as they take a .cs. The verbs are language-neutral from the
# first commit because that is not retrofittable -- a verb meaning C# alone, given a Python mode
# afterwards, would carry the first language's assumptions in its shape forever.
lamella-py-frontend = { path = "../lamella-py-frontend" }
lamella-py-runtime = { path = "../lamella-py-runtime" }
lamella-py-bytecode = { path = "../lamella-py-bytecode" }

# BAKE-only deps (behind the `bake` feature). `code-in-place` is NON-ADDITIVE -- it cfg's out
# `Module::method_body` and switches loading to the 'static flash model -- so reaching the shared
# lamella-load in a default or `--workspace` build stops lamella-repl and lamella-runner
# compiling. MEASURED on this tree (6 errors in lamella-repl, 2 in lamella-runner), not inherited
# from the sibling comment in lamella-mcp. Gating keeps the workspace green; the full tool is
# `cargo build -p lamella-cli --features bake`.
lamella-load = { path = "../lamella-load", optional = true }
# The debug-channel seam `run --target` drives. It is that channel and not the deploy one because
# CONSOLE OUTPUT ARRIVES THERE: the wire's terminal frames carry a program's whole output and none
# of them exists until it has finished, so streaming a running program means draining EVT_OUTPUT,
# which rides the debug session.
lamella-debug-backend = { path = "../lamella-debug-backend", optional = true }

[features]
# The flash image and the deploy path: compile -> bake (`Module::write_baked`, which needs
# `code-in-place`) -> `.lmli`, and the chunked deploy over Lamella Link. Default-OFF for the
# reason above, which means a workspace build produces a `lamella` that cannot deploy -- stated in
# the crate documentation as well, because a gate that cannot build the verb it is trusted to
# cover is worse than a missing gate.
bake = [
    "dep:lamella-load", "lamella-load/code-in-place",
    "lamella-wire-host/baked",
    "lamella-wire-host/debug-backend", "dep:lamella-debug-backend",
]

[lints]
workspace = true
