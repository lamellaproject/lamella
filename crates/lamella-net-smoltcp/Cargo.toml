[package]
name = "lamella-net-smoltcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DEVICE networking backend for the shared NetBackend seam: smoltcp (pure-Rust no_std TCP/IP) over any smoltcp phy::Device (a board's Ethernet MAC driver). The device twin of lamella-net-host."
publish = false

[dependencies]
# The seam alone. A backend is not a language runtime's dependant: it implements a leaf trait, and
# every runtime that binds that leaf gets this backend without either side knowing about the other.
lamella-net-core = { path = "../lamella-net-core" }
smoltcp = { version = "0.12", default-features = false, features = [
    "medium-ethernet",
    "proto-ipv4",
    "socket-tcp",
    "socket-udp",
    "socket-dns",
    "socket-dhcpv4",
    "alloc",
] }

[lints]
workspace = true
