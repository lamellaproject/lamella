[package]
name = "lamella-winc1500"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "DEVICE networking backend for the shared NetBackend seam, targeting the Microchip ATWINC1500 Wi-Fi network CONTROLLER. The WINC hosts its own TCP/IP stack and exposes a socket API over SPI (its HIF protocol), so socket ops map straight onto NetBackend -- no smoltcp. Generic over a board's SPI bus + control pins (e.g. a SAMD21 SERCOM-SPI on the Arduino MKR1000)."
publish = false

[dependencies]
# The seam alone. A backend is not a language runtime's dependant: it implements a leaf trait, and
# every runtime that binds that leaf gets this backend without either side knowing about the other.
lamella-net-core = { path = "../lamella-net-core" }

[dev-dependencies]
# The winc-first-light example drives the module's SPI bit-banged over SWD PORT pokes -- first
# light with no firmware support. Host-only dev-deps; the library itself stays no_std.
# winc-flash additionally reset-halts the host MCU (the SAM extension's DSU-aware halt) so
# the resident serve firmware cannot contend for the module's SPI pins.
lamella-probe-core = { path = "../lamella-probe-core" }
lamella-cmsis-dap = { path = "../lamella-cmsis-dap" }
lamella-cmsis-dap-sam = { path = "../lamella-cmsis-dap-sam" }
lamella-usbhid = { path = "../lamella-usbhid" }

[lints]
workspace = true
