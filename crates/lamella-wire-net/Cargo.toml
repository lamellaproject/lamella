[package]
name = "lamella-wire-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lamella Link over TCP, for the side of the link that has no std: the wire's frame codec driven over the non-blocking NetBackend socket seam. A board serving Lamella Link over its own Wi-Fi, and an on-board Linux daemon relaying to a microcontroller beside it, are the same transport reached two ways."

[dependencies]
# The protocol: the frame codec, the Transport seam, TransportError. Depends on nothing itself.
lamella-wire = { path = "../lamella-wire" }
# The socket seam, also a leaf. Joining the two is the whole of this crate: it implements a
# lamella-wire Transport for ANY NetBackend, so a board gets this transport from whichever stack
# it already carries (smoltcp over a PHY, a Wi-Fi module, an AT modem) without either leaf
# learning about the other.
lamella-net-core = { path = "../lamella-net-core" }

[lints]
workspace = true
