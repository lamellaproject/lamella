[package]
name = "lamella-runner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The Lamella Link debug + REPL RUNNER core, shared by the host reference runner, the browser (wasm) runner, and the on-device firmware: run_program (load the managed corlib + run a program + capture its output) + the serve_one request handler + the host driver helpers, over the lamella-wire Transport seam. no_std + alloc so it rides onto a microcontroller."
publish = false

[dependencies]
lamella-wire = { path = "../lamella-wire" }
# The runner is the DEVICE crate, so it controls the BCL surface as a profile knob (below): the
# interpreter + loader take NO surface by default here -- a profile feature forwards exactly the
# tier the target needs, so a 16 KB part links the kernel floor and a roomy part the full NETMF set.
lamella-cil-runtime = { path = "../lamella-cil-runtime", default-features = false }
lamella-load = { path = "../lamella-load", default-features = false }
lamella-metadata = { path = "../lamella-metadata" }
# The volatile MMIO primitive the interpreter's Lamella.Hardware.Mmio seam installs on device (so
# a C# GPIO/peripheral driver reaches real registers). Unused on the host (which uses the sim).
lamella-mmio = { path = "../lamella-mmio" }

# The run-with-corlib reference-runner example and its host-only backend dev-dependencies
# (net/tls/pinvoke-host) live in the separate lamella-host-tests crate.

[features]
# Source-level debugger names (forwarded to the loader). Default on; a constrained device build drops it.
default = ["profile-full", "debug-names"]
debug-names = ["lamella-load/debug-names"]
# The BCL surface tier (pick ONE). profile-full = the desktop / roomy-device NETMF surface (the host
# reference runner + the SAME54/L476 serve firmwares). profile-minimal = the kernel-tier floor
# (intrinsic BCL + exceptions + GC, no float / math / finalizers / varargs) for the tightest parts
# (micro:bit v1, 256 KB flash) so the interpreter leaves room for a deployed image.
profile-full = [
    "lamella-load/NETMFv4_4", "lamella-load/exceptions", "float", "lamella-load/gc",
    "lamella-load/finalizers", "lamella-load/math-transcendental", "typed-references",
    "lamella-load/varargs",
]
# cfg-testable passthroughs for the Value variants the debug `<val>` encoder names: the encoder
# compiles on every profile and emits the float/typedref tags only where the tier carries them.
float = ["lamella-load/float"]
typed-references = ["lamella-load/typed-references"]
# profile-full's surface WITHOUT floating point: the full NETMF type/exception/collection surface,
# no `float` and no transcendentals. It exists because a part can be roomy enough for the surface and
# not for the float BCL on top of it -- float costs roughly 62 KiB of flash, which can be the
# difference between fitting a 256 KB plane and overflowing it. Cargo features are additive, so this cannot be
# "profile-full minus float"; it is spelled out, and the two lists are meant to stay in step apart
# from `float` / `math-transcendental`.
profile-no-float = [
    "lamella-load/NETMFv4_4", "lamella-load/exceptions", "lamella-load/gc",
    "lamella-load/finalizers", "typed-references", "lamella-load/varargs",
]
profile-minimal = ["lamella-load/bcl", "lamella-load/exceptions", "lamella-load/gc"]
# RUN_IMAGE support: boot + run a baked flash image (Module::from_baked) as the runner's execution
# path -- the PE-less constrained-target story. Forwards the loader's code-in-place (XIP) knob, which
# pins the load API to Assembly<'static>; run_program then leaks its per-call inputs, matching the
# one-image-per-process host pattern. The host DRIVER half (send_image / RUN_IMAGE) is unconditional.
baked-image = ["lamella-load/code-in-place"]
# corlib_resolution = lazy, forwarded to the loader: a deployed bare PE resolves its corlib
# references out of the FLASH-RESIDENT corlib, materializing only the members it reaches, instead of
# loading the whole corlib into RAM. This is what lets a 256 KB part take a program PE rather than a
# baked image carrying its own copy of the corlib -- eager resolution costs about a megabyte, which
# such a part does not have. Off by default: a host or a roomy part should keep the eager path, whose
# lookups are faster and whose RAM is free. The two tiers run a program to the same output and the
# same exit value; only timing and RAM differ.
corlib-lazy = ["lamella-load/corlib-lazy"]
# The incremental-REPL LIVE-SESSION serve path (serve_one_repl + ReplSessionState): a device holds a
# persistent interpreter across wire frames and loads a compiled submission DELTA into it, running
# ONLY the new code (prior submissions never re-execute -- the safety property this path exists for).
# It loads PE deltas via the loader's load_bootstrap/load_delta, so it is INDEPENDENT of baked-image
# (composes with it: a session-capable board that is also baked advertises both). Off by default; a
# session-capable firmware + the host reference runner opt in, over a selected BCL profile. Requires
# `debug-names`: the session anchors the bootstrap `<repl>.__Repl..ctor` by the qualified name the
# loader records, so a names-stripped build loads the bootstrap but cannot find its constructor.
repl-session = ["debug-names"]

# Test-only: drives the real incremental compiler in the repl-session wire test -- emits the session
# bootstrap and compiles each C# submission into a delta the runner loads over the loopback, the
# never-skip proof (pure no_std+alloc Rust, no external tooling). The ilasm-fixture test alongside it
# adds the observable value displays + the reference-survival case.
[dev-dependencies]
lamella-assemble = { path = "../lamella-assemble" }
# The FAT backend (with mkfs) so the baked-deploy e2e test can mount a real RAM FatFs at /sd through
# the StorageProvider seam -- the host twin of sam4s's device SD boot-mount.
lamella-fs-fat = { path = "../lamella-fs-fat", features = ["format"] }

# Measures how many images a repeatedly-served board retains, so it needs the path that serves
# them. Declared rather than left to auto-discovery: without this, a build that does not select
# `baked-image` still tries to compile the target and fails on imports that are gated out -- and
# `required-features` is the one mechanism that turns "this suite silently ran nothing" into a
# hard error rather than a green with no tests behind it.
[lints]
workspace = true
