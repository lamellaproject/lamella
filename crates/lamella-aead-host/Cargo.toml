[package]
name = "lamella-aead-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "HOST-side AEAD backend for the interpreter's AeadBackend seam: RFC 5297 AES-SIV (AEAD_AES_SIV_CMAC_256, the RFC 8915 NTS cipher) over the RustCrypto aes-siv crate. Byte-identical to the device's mbedTLS-composed SIV; both are pinned by the RFC 5297 appendix vectors."

[dependencies]
lamella-cil-runtime = { path = "../lamella-cil-runtime" }
# RustCrypto AES-SIV, on the SAME RustCrypto generation the workspace already carries
# (cipher 0.4 / crypto-common 0.1 / subtle 2.6); dependency tree audited 2026-07-13 --
# all RustCrypto-org crates plus generic-array/typenum/cfg-if/cpufeatures/subtle.
aes-siv = { version = "0.7.0", default-features = false, features = ["alloc"] }

[lints]
workspace = true
