[package]
name = "lamella-cmsis-dap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "A CMSIS-DAP debug-probe host -- the command protocol and ADIv5/SWD transactions -- implemented from the Arm CMSIS-DAP and ADIv5 specifications."
publish = false

[lints]
workspace = true

[features]
default = ["usbhid"]
# The native USB-HID transport (`lamella-usbhid`). Disable for non-native targets such as wasm32,
# where the embedder supplies its own `Transport` (e.g. the browser's WebHID via a JS shim); the
# protocol / ADIv5 logic and `Dap<T: Transport>` stay target-independent either way.
usbhid = ["dep:lamella-usbhid"]
# The native USB-bulk transport (`lamella-usbbulk`) for CMSIS-DAP v2 probes (e.g. the Raspberry
# Pi Debug Probe), which expose a WinUSB vendor interface instead of HID.
usbbulk = ["dep:lamella-usbbulk"]
# Exposes the `testing` module (the probe-protocol mock) to the device-specific extension crates
# (lamella-cmsis-dap-sam, lamella-cmsis-dap-nrf) for their tests. Off by default; not in the shipped API.
test-util = []

[dependencies]
# The probe-neutral seam: this crate supplies the CMSIS-DAP implementation of `DapAccess`, and the
# MEM-AP / Cortex-M logic above it lives once in `lamella-probe-core::ArmDap`, shared with every
# other low-level probe family. Dependency-free and below us, so no cycle.
lamella-probe-core = { path = "../lamella-probe-core" }
lamella-usbhid = { path = "../lamella-usbhid", optional = true }
lamella-usbbulk = { path = "../lamella-usbbulk", optional = true }

[dev-dependencies]
# Probe SELECTION: these examples reach a `2e8a:000c` or an EDBG, both of which every board of
# their kind shares, so an example must resolve WHICH one. A dev-dependency back onto a crate that
# depends on this one is allowed and is not a cycle in the build graph.
lamella-probe = { path = "../lamella-probe", features = ["usbbulk"] }
