[package]
name = "lamella-serve-stm32f7"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Interpreter firmware for STM32F7 boards (the STM32F769I-DISCO and the STM32F746G-DISCO): it runs the C# interpreter, takes programs from the lamella CLI over the virtual COM port of the board's ST-LINK, and keeps a deployed program in the chip's own flash."
publish = false

[dependencies]
lamella-cil-runtime = { path = "../lamella-cil-runtime", default-features = false }
# The firmware's Lamella Link side: the framed protocol and the baked-image runner core.
lamella-wire = { path = "../lamella-wire", optional = true }
lamella-runner = { path = "../lamella-runner", optional = true, default-features = false, features = [
    "baked-image",
] }
# The reclaiming O(1) segregated global allocator. The M7 has the atomic CAS its spin lock needs.
lamella-heap = { path = "../lamella-heap", optional = true }
# The pin-change event queue the external interrupt controller's handler fills (the shared
# stm32_pin_events.rs and pin_events.rs), and the critical section that queue takes. Behind
# `serve`, the firmware that runs programs.
lamella-pin-events = { path = "../lamella-pin-events", optional = true }
critical-section = { version = "1", optional = true, features = ["restore-state-bool"] }

[features]
# The firmware that takes programs from the lamella CLI: lamella-wire framing and the lamella-runner
# baked-image core. Combine with a board feature -- `serve,st-stm32f769i-disco` or
# `serve,st-stm32f746g-disco`.
serve = ["dep:lamella-wire", "dep:lamella-runner", "dep:lamella-pin-events", "dep:critical-section"]
# The STM32F746NG part (Cortex-M7; 1 MB of flash, 320 KB of SRAM): the full class-library surface
# and the reclaiming heap.
stm32f7 = ["lamella-runner?/profile-full", "reclaim-heap"]
# The firmware's allocator, the reclaiming heap. Both board features take it.
reclaim-heap = ["dep:lamella-heap"]
# The STM32F769NI part (Cortex-M7; 2 MB of flash, 512 KB of SRAM). A separate part feature rather
# than a size knob on `stm32f7`, because it selects a different memory map -- see build.rs. An
# alternative to `stm32f7`, not additive with it.
stm32f769 = []
# The STM32F769I-DISCO board, for the C# interpreter firmware: the part's memory map, the full
# class-library surface and the reclaiming heap. Combine with `serve`.
st-stm32f769i-disco = ["stm32f769", "lamella-runner?/profile-full", "reclaim-heap"]
# The STM32F746G-DISCO board, for the C# interpreter firmware: the part feature, which brings the
# full class-library surface and the reclaiming heap, and leaves build.rs on the F746's memory map.
# Combine with `serve`, and not with the F769's board.
st-stm32f746g-disco = ["stm32f7"]

# The C# interpreter firmware, with the deploy tier: a program stored in the part's own flash runs
# from reset. Needs one board feature as well as `serve`.
[[bin]]
name = "stm32f7-csharp-interpreter"
path = "src/bin/stm32f7-csharp-interpreter.rs"
required-features = ["serve"]
