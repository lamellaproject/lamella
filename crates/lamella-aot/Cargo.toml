[package]
name = "lamella-aot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Lamella's ahead-of-time backend driver: lowers the middle IR to target machine code."
publish = false

[dependencies]
lamella-ir = { path = "../lamella-ir" }
lamella-cil = { path = "../lamella-cil" }
lamella-asm-arm32 = { path = "../lamella-asm-arm32", optional = true }
lamella-asm-riscv32 = { path = "../lamella-asm-riscv32", optional = true }
lamella-asm-wasm = { path = "../lamella-asm-wasm", optional = true }
# The AOT compiler reads an assembly's metadata to resolve call/ldstr tokens (the
# MetadataResolver); the core IR->native lowering itself stays metadata-free.
lamella-metadata = { path = "../lamella-metadata" }
lamella-generics = { path = "../lamella-generics" }
# Metadata tokens: the MetadataResolver names a constructor/catch type token's declaring
# type (the exception-tag seam).
lamella-token = { path = "../lamella-token" }
# The backend emits ELF relocatable objects (riscv32::lower_object) for the own linker.
lamella-elf = { path = "../lamella-elf" }

[dev-dependencies]
lamella-flash-format = { path = "../lamella-flash-format" }
lamella-wasm-interp = { path = "../lamella-wasm-interp" }
lamella-link = { path = "../lamella-link" }
lamella-probe-core = { path = "../lamella-probe-core" }
lamella-cmsis-dap = { path = "../lamella-cmsis-dap" }
lamella-cmsis-dap-sam = { path = "../lamella-cmsis-dap-sam" }
# Probe SELECTION, so a deploy example names which board it writes. Opening by vendor/product alone
# takes whichever interface the OS hands over -- an order that changes with plug order and reboots --
# and a write to the wrong board SUCCEEDS. `open_hid` resolves it through the ladder instead:
# explicit serial, then LAMELLA_PROBE_SERIAL, then the sole probe of that vid/pid, then REFUSE.
#
lamella-probe = { path = "../lamella-probe" }

[features]
default = ["arm32"]
# Each target backend is independently selectable, so a deployment compiles only
# the code generators it needs -- an ARM32 device never builds the RISC-V or WASM
# paths, and vice versa.
arm32 = ["dep:lamella-asm-arm32"]
riscv32 = ["dep:lamella-asm-riscv32"]
wasm = ["dep:lamella-asm-wasm"]
# String storage encoding (runtime's seam): UTF-16 is the DEFAULT and has no feature of its own.
# These switch the AOT string blob and the op_Equality compare to UTF-8 (drops lone-surrogate
# parity) or surrogate-preserving WTF-8. String.Length stays the UTF-16 unit count in all three.
# Mutually exclusive in intent; string-utf8-wtf8 wins if both are set.
# UTF-16 is the default and is NOT spelled as a feature: cargo rejects an unknown name outright,
# which is a louder failure than a knob that does nothing.
string-utf8 = []
string-utf8-wtf8 = []
# Drop the per-type NAME strings the descriptors carry. Names are ON by default because that is what
# `Object.ToString()` returns on .NET and a default that silently answers null is the kind of quiet
# divergence this backend keeps paying for. They are strippable because they are pure text with no
# behavioural role beyond rendering -- the same trade the exception-message knob makes -- and a
# constrained tier that never prints a type name should not carry one per live type. With this set,
# the descriptor still carries the name WORD (a zero), so the format stays total across tiers and a
# reader never has to know which way the knob was thrown.
strip-type-names = []

[lints]
workspace = true

