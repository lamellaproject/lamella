# BOARD binding: the Espressif ESP32-C6-DevKitC-1. Board truth
# ONLY: role bindings, the carrier, and the clock plan. Chip truth lives in csp/esp32c6/.
#
# The uart0 binding's pins route to the board's on-board USB-UART bridge (the "UART" USB-C
# port) AND to header J3 -- it is the ROM console. The Lamella Link wire is NOT that uart:
# it rides the chip's built-in USB-Serial-JTAG CDC (the "USB" port), which is the
# native-usb carrier below.

[table]
kind = "board"
board = "esp32c6-devkitc"
vendor = "espressif"
family = "esp32c6"
part = "esp32c6"
product_model = 14          # lamella_wire::product_model::ESP32_C6
sources = ["ESP32-C6-DevKitC-1 schematic/user guide (GPIO16/17 to the on-board bridge; 40 MHz crystal)"]

[[carriers]]
kind = "native-usb"         # the chip's USB-Serial-JTAG; the host sees a CDC COM port
plan = "xtal-40mhz"
default = true

[[bindings]]
role = "uart0"
kind = "uart"
instance = "uart0"
function = "F0"             # native IO_MUX functions (U0TXD/U0RXD) -- no GPIO matrix
tx = { pin = "GPIO16" }
rx = { pin = "GPIO17" }

[[plans]]
name = "xtal-40mhz"
default = true
source = "xtal"
xtal_hz = 40000000          # the board's crystal
uart_sclk_hz = 40000000     # PCR sclk = XTAL / 1 (SCLK_SEL 3, dividers 0) -- the generator
                            # verifies this equality under source xtal (state-and-verify)

[debug]
signals = []
exposure = "unknown"
fitted = "unknown"
onboard = "chip-usb-jtag"
recovery = "mask-rom"
source = "ESP32-C6 datasheet: the chip carries a USB Serial/JTAG controller, and USB_D+/USB_D- are connected to it by default, so a host reaches the debug interface over the board's own USB connector with no probe and no debug pads in the path. Where the chip's separate GPIO JTAG signals reach on this board is not established by a document held here, so the exposure is recorded as unknown rather than guessed. Table 3-3, Chip Boot Mode Control: GPIO9 low at reset selects Joint Download Boot mode, which supports USB-Serial-JTAG, UART and SDIO download. That mode is selected before any flash contents execute, so writing flash cannot remove it. An eFuse, EFUSE_DIS_USB_SERIAL_JTAG, can disable the controller; the default is enabled."
