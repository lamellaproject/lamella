# The Arduino MKR1000: carries the SAME ATSAMW25 module as the SAM W25 XPro (identical
# module-internal WINC wiring, inherited from csp/atsamw25/module.toml) on a board with NO
# EDBG -- the Lamella Link wire is the chip's native USB, and flashing takes an external SWD
# probe. The board contributes no VCP binding at all: a carrier is not always a peripheral
# binding, which is why [carrier] is its own record and not a role.

[table]
kind = "board"
board = "mkr1000"
module = "atsamw25"
board_model = 9
sources = [
    "Arduino MKR1000 schematic (native USB wire, no debug bridge)",
    "size-gate feature notes: identical module-internal WINC wiring to the SAMW25 XPro; the board flips the advertised identity, otherwise the same build",
]

[carrier]
kind = "native-usb"


name = "osc8m-8mhz"
default = true
source = "osc8m"
gclk0_hz = 8000000


name = "usb-48mhz"
source = "dfll48m-usb-recovery"
gclk1_hz = 48000000
