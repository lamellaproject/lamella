# The SAM C21 Xplained Pro (ATSAMC21-XPRO): board truth only -- what is wired to what. Chip truth
# lives in csp/samc21/.
#
# THE VIRTUAL COM PORT'S FUNCTION COLUMN CAME FROM THE DATASHEET AND COULD NOT HAVE COME FROM THE
# KIT. Atmel-42460 Table 4-15 names "SERCOM4 PAD[2]" on PB10 and "SERCOM4 PAD[3]" on PB11 and stops
# there; DS60001479M Table 6-2 places both in column D (SERCOM-ALT) and leaves column C empty on
# each. So the instance the guide names is right and the letter it does not name is D.

[table]
kind = "board"
board = "samc21-xpro"
vendor = "microchip"
family = "samc21"
part = "atsamc21j18a"
product_model = 53          # lamella_wire::product_model::SAMC21_XPLAINED_PRO
sources = [
    "SAM C21 Xplained Pro user guide Atmel-42460 section 4.3.1 and Table 4-13 (LED Connection): one yellow LED0 on PA15, and the section states the polarity in words -- 'The LED is activated by driving the connected I/O line to low'. The table's Shared functionality column reads 'Crystal footprint and EXT3'.",
    "Atmel-42460 section 4.3.2 and its Mechanical Buttons table: two buttons, RESET on RESETN and a generic user-configurable SW0 on PA28, whose Shared functionality column reads 'EXT3 and EDBG GPIO3'. The section states the polarity in words -- 'When a button is pressed it will drive the I/O line to GND'.",
    "Atmel-42460 section 4.5.1 and its SWD Connections table: SWD clock on PA30 and SWD data on PA31.",
    "Atmel-42460 section 4.5.2 and Table 4-15 (Virtual COM Port Connections), corroborated against DS60001479M Table 6-2 for the function column -- see the header above.",
    "Atmel-42460 section 4.3.3 (Crystals): the kit contains one MOUNTED 32.768 kHz crystal and a FOOTPRINT for a higher-frequency crystal that is not populated.",
    "SAM C20/C21 Family Data Sheet DS60001479M ch 18 (OSC48M) for the default plan's rate, stated in words: 'After reset, OSC48M is enabled and serves as the default clock source at 4MHz.'",
]
notes = [
    "TWO CRYSTAL FACTS AND THEY POINT DIFFERENT WAYS. The 32.768 kHz crystal is MOUNTED; the higher-frequency one is a footprint only. The LED's pad is the one the guide marks as shared with a crystal footprint, so on a stock board nothing contends for it -- but a board that populated that footprint would be choosing between the crystal and the LED. Recorded in the guide's own terms rather than resolved, because the guide names 'Crystal footprint' without saying which crystal.",
    "LED0 AND SW0 ARE BOTH SHARED WITH EXT3, which the guide states in its own Shared functionality column. A program driving either is also driving whatever an extension board presents on that line, and SW0 is additionally shared with an EDBG GPIO.",
    "THIS PART IS THE 64-PIN J AND BONDS NO GROUP-C PAD. Its sibling board on this roster, samc21n-xpro, is the 100-pin N and puts its LED on PC05. Nothing is shared between the two boards' device rows.",
    "THE GUIDE DOES NOT SAY WHETHER SW0 HAS AN EXTERNAL PULL-UP. It states the polarity and stops there, where the SAM D21 and E51 Curiosity Nano guides both state outright that no pull-up is fitted. The absence of the statement is not the presence of a resistor.",
]

[[carriers]]
kind = "edbg-vcp"           # the on-board EDBG's CDC virtual port, opened like any serial port.
usb_vid = 0x03EB            # NOTE: NO usb_pid ROW, AND ITS ABSENCE IS A SOURCED POSITION RATHER THAN
role = "vcp"                # AN OMISSION. A product id is a property of the debugger's FIRMWARE:
baud = 115200               # this kit's user guide never prints one, and the EDBG user guide
plan = "osc48m-4mhz"        # Atmel-42096 describes the composite device without giving an id
default = true              # table. Nor can a sibling supply it -- same54-xpro and samw25-xpro
                            # both answer 0x2111 while samd21-xpro answers 0x2169, so an
                            # Xplained Pro's product id does not follow from being one.

[[bindings]]
role = "vcp"
kind = "uart"
instance = "sercom4"
function = "D"              # SERCOM-ALT. Neither pad carries a column-C SERCOM at all, so the
gclk_gen = 0                # letter is not a choice between two instances -- but the guide does
tx = { pin = "PB10", pad = 2 }   # not state it, so it had to be read off Table 6-2.
rx = { pin = "PB11", pad = 3 }

# THE DEFAULT CLOCK PLAN, AND IT IS NOT THE SAM D21 LINE'S. Those boards run osc8m-8mhz; this
# family comes out of reset on a different oscillator at a different rate, which DS60001479M states
# in words: "After reset, OSC48M is enabled and serves as the default clock source at 4MHz." So the
# plan is named for what this part actually does rather than copied from a sibling board, and the
# baud divisors the generator derives ride that 4 MHz rather than 8.
[[plans]]
name = "osc48m-4mhz"
default = true
source = "osc48m"
gclk0_hz = 4000000

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "PA15"
active = "low"
source = "Atmel-42460 section 4.3.1 and Table 4-13: one yellow LED0 on PA15. 'The LED is activated by driving the connected I/O line to low', which is the polarity stated in words rather than inferred from a schematic. The table's Shared functionality column reads 'Crystal footprint and EXT3'."

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "PA28"
active = "low"
source = "Atmel-42460 section 4.3.2 and its Mechanical Buttons table: the generic user-configurable button SW0 on PA28, whose Shared functionality column reads 'EXT3 and EDBG GPIO3'. 'When a button is pressed it will drive the I/O line to GND'. The guide says nothing about an external pull-up on this line, in either direction."

[debug]
signals = ["swd"]
exposure = "header"
fitted = "unknown"
pitch_mm = 1.27
onboard = "edbg"
recovery = "probe"
source = "Atmel-42460 SAM C21 Xplained Pro user guide, Cortex Debug Connector section and its pin table, which gives pin 1 as the target voltage and the SWD signals against the part's pads. Whether a connector is soldered to that position is not stated: the guide gives the connector a numbered section and a full pin table but never says it is mounted, and the same guide marks its crystals mounted and not mounted in the feature list, so the silence cannot be read either way. The board carries a debugger this toolchain speaks, so the recovery path after any deploy is that debugger: it reaches the part over SWD regardless of what the application image did, which is what distinguishes it from a bootloader that has to survive in flash."
