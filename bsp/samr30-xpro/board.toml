# The SAM R30 Xplained Pro (ATSAMR30-XPRO): board truth only -- what is wired to what. Chip
# truth lives in csp/samr30/.
#
# THE PART IS A SAM L21 AND AN AT86RF212B IN ONE PACKAGE, and the kit exists to show the sub-1 GHz
# radio. What that costs a board is stated once, in csp/samr30/parts.toml: 28 general-purpose I/O
# pins on a 48-pin part. Nothing here may reach SERCOM4 or PA10/PA11/PB16/PB17.
#
# THE NAME SAYS R21 AND THE SILICON SAYS L21, AND THE CLOCK PLAN IS WHERE THAT BITES. The sibling
# samr21-xpro's plan is OSC8M at 8 MHz; this part starts on OSC16M at 4 MHz, like the SAM L21 and
# SAM L22 and unlike every SAM D21-line board on this roster. A baud divisor carried across from
# the kit that shares this one's name would be wrong by a factor of two.
#
# THIS KIT'S GUIDE DOES NOT REPEAT THE SIBLING'S TYPO, WHICH WAS CHECKED RATHER THAN ASSUMED. The
# SAM R21 Xplained Pro guide names SERCOM0 for its TX line and SERCOM1 for its RX line -- two
# instances for one link -- and csp/samr21/pins.toml records taking the datasheet over it.
# DS50002612A Table 4-12 names SERCOM0 on both rows and agrees with DS70005303C Table 7-1.

[table]
kind = "board"
board = "samr30-xpro"
vendor = "microchip"
family = "samr30"
part = "atsamr30g18a"
product_model = 57          # lamella_wire::product_model::SAMR30_XPLAINED_PRO
sources = [
    "SAM R30 Xplained Pro user guide DS50002612A (2017) section 4.3.3 and Table 4-8 (LED Connections): TWO LEDs, LED0 soft orange on PA19 and LED1 green on PA18, both with Shared Functionality 'EXT3'. Section 4.3.3 states the polarity in words -- 'The LEDs can be activated by driving the connected I/O line to ground (GND)'.",
    "DS50002612A section 4.3.2 and Table 4-7 (Mechanical Buttons): two buttons, RESET on the part's reset line and a generic user-configurable SW0 on PA28, Shared Functionality 'EXT1'. The section states the polarity in words -- 'When the user button is pressed, it drives the I/O line to ground' -- AND states outright that no external pull-up is fitted.",
    "DS50002612A section 4.4.1 and Table 4-11 (SWD Connections): SWD clock on PA30 and SWD data on PA31, both shared with the Cortex debug connector. Corroborated by DS70005303C Table 7-5, which gives the same two pads.",
    "DS50002612A section 4.4.2 and Table 4-12 (Virtual COM Port Connections), corroborated against SAM R30 datasheet DS70005303C Table 7-1 for the function column -- see the header above.",
    "DS50002612A section 4.3.1 with Table 4-5 and Table 4-6: TWO crystals are fitted. The 32.768 kHz one is on PA00 (XIN32) and PA01 (XOUT32); the 16 MHz one is on the dedicated XTAL1/XTAL2 package pins and is wired to the RF die rather than to the microcontroller.",
    "DS50002612A section 4.3.5 and Table 4-10 (RF Connections): the kit fits a passive analog RF switch driven by RFCTRL1 on PA09 and RFCTRL2 on PA12, both also shared with the EDBG's DGI GPIO.",
    "DS70005303C (OSCCTRL and GCLK) for the default plan's rate, stated three ways in three chapters: 'After reset, OSC16M is enabled and serves as the default clock source at 4MHz', 'the clock source for this clock signal is OSC16M, which is enabled and configured at 4MHz after a reset by default', and -- naming the generator this plan is about -- 'Generator 0 is using OSC16M at 4 MHz as source and generates GCLK_MAIN'.",
]
notes = [
    "TWO LEDs, AND NO OTHER XPLAINED PRO ON THIS ROSTER DECLARES MORE THAN ONE. Counted: of the nineteen Xplained Pro boards in bsp/, fourteen declare a single gpio-out device and four declare none; this is the only one with two. Both are on port A, both are active low, and both share EXT3 per the guide's own Shared Functionality column -- so a program driving either is also driving whatever an extension board presents on that line.",
    "SW0 HAS NO EXTERNAL PULL-UP AND THIS GUIDE SAYS SO. Section 4.3.2's note reads 'There is no pull-up resistor connected to the generic user button. Remember to enable the internal pull-up in the SAM R30 to use the button.' That is a stronger statement than the SAM R21 and SAM L21 guides make, both of which state the polarity and stop; this one closes the question rather than leaving it open.",
    "PA09 AND PA12 ARE SPENT ON THE RF SWITCH ON THIS BOARD. Table 4-10 wires them to the antenna-diversity switch's control inputs. Nothing here binds them, and they are not chip facts -- the pads are ordinary I/O on a bare part. Recorded because a pad list says a pin exists and cannot say what is soldered to it.",
    "AND PA12 IS ONE OF THE FOUR PADS THAT COULD OTHERWISE REACH SERCOM4. csp/samr30/parts.toml records that this part, unlike the SAM R21, does bond SERCOM4 out -- on PA12..PA15 in column D. On THIS board one of those four is already the RF switch's, so the contention the chip file describes is narrower here than the datasheet alone would suggest.",
    "THE 16 MHz CRYSTAL COSTS NO PAD AND THE 32.768 kHz ONE COSTS TWO. XTAL1 and XTAL2 are dedicated package pins and are not PORT pads at all, so the RF reference takes nothing from a board's pin budget. PA00 and PA01 are ordinary pads that this kit populates with the 32.768 kHz crystal, so they are not available as I/O on a stock board. Nothing here binds them.",
    "THE 16 MHz CLOCK REACHES THE MICROCONTROLLER ONLY BY WAY OF THE RADIO, AND THIS PART NAMES THE PAD. Section 4.3.1's Info block states that the crystal is connected directly to the RF die inside the SAM R30 and that its clock is routed from the RF die's CLKM pin to a GCLK I/O pin on the microcontroller. DS70005303C Table 7-2 identifies that pin: CLKM is PC16, and its function H is GCLK_IO[1]. So a plan wanting the 16 MHz reference is asking the transceiver for it on a pad in port group C that no package pin reaches -- which is a different act from enabling an oscillator, and no plan here does it.",
    "THE PART'S OWN XOSC PADS ARE FREE ON THIS BOARD. DS70005303C Table 7-3 puts XOSC's XIN and XOUT on PA14 and PA15, and this kit fits no crystal there -- its 16 MHz part is the RF die's, on the dedicated pins. So PA14 and PA15 are ordinary I/O here, where on a board that populated XOSC they would not be.",
    "THIS PART HAS A SECOND RAM REGION THAT NOTHING HERE CAN NAME. Ch 2 rows 8 KB of Low Power SRAM separately from the 32 KB of System SRAM, at its own address in its own power domain. csp/samr30/parts.toml records the System SRAM alone as the `ram` figure and says why.",
]

[[carriers]]
kind = "edbg-vcp"           # the on-board EDBG's CDC virtual port, opened like any serial port.
usb_vid = 0x03EB            # NOTE: NO usb_pid ROW, AND ITS ABSENCE IS A SOURCED POSITION RATHER THAN
role = "vcp"                # AN OMISSION. A product id is a property of the debugger's FIRMWARE:
baud = 115200               # this kit's user guide never prints one, and the EDBG user guide
plan = "osc16m-4mhz"        # Atmel-42096 describes the composite device without giving an id
default = true              # table. Nor can a sibling supply it -- same54-xpro and samw25-xpro
                            # both answer 0x2111 while samd21-xpro answers 0x2169, so an
                            # Xplained Pro's product id does not follow from being one.

[[bindings]]
role = "vcp"
kind = "uart"
instance = "sercom0"
function = "D"              # SERCOM-ALT. Both pads are in Table 7-1's column D and neither has a
gclk_gen = 0                # column-C SERCOM at all, so the letter is not a choice between two --
tx = { pin = "PA04", pad = 0 }   # which is the sibling samr21's shape and NOT the saml21's, where
rx = { pin = "PA05", pad = 1 }   # both columns are occupied and the letter picks the instance.

# THE DEFAULT CLOCK PLAN, AND THE DATASHEET NAMES THE GENERATOR RATHER THAN LEAVING IT INFERRED:
# "Generator 0 is using OSC16M at 4 MHz as source and generates GCLK_MAIN". So GCLK0 is 4 MHz at
# reset -- the SAM L21 and SAM L22 rate, reached by the same oscillator, and NOT the 8 MHz that the
# SAM D21-line boards and the sibling samr21-xpro start at. Every baud divisor the generator
# derives rides that rate.
[[plans]]
name = "osc16m-4mhz"
default = true
source = "osc16m"
gclk0_hz = 4000000

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "PA19"
active = "low"
source = "DS50002612A section 4.3.3 and Table 4-8: LED0, colour soft orange, on PA19, Shared Functionality 'EXT3'. 'The LEDs can be activated by driving the connected I/O line to ground (GND)'. THE POLARITY IS MEASURED, AND IT AGREES WITH THE DOCUMENT. That sentence is quoted rather than relied on: it appears word for word across this vendor's kit guides and is wrong on at least one of them, where the same instrument reports the opposite. Driven from a probe with the core halted, PA19 was held high for five seconds and low for one in a repeating cycle, sampled at both ends of every window across five cycles: the diode is lit for the one-second stretch, so it lights when the pin is LOW. The part answering on the probe reads CPUID 0x410cc601, a Cortex-M0+, with the DSU DID at 0x41002018 reading 0x1081021e -- processor 1, family 1, series 1, die 0, revision 2, device 0x1E."

[[devices]]
name = "led1"
kind = "gpio-out"
pin = "PA18"
active = "low"
source = "DS50002612A section 4.3.3 and Table 4-8: LED1, colour green, on PA18, Shared Functionality 'EXT3'. THE POLARITY IS MEASURED SEPARATELY FROM LED0's, AND DELIBERATELY SO. The guide states the polarity once for both, speaking of 'the LEDs' in the plural, so LED1's value would otherwise be an inference from a sentence covering something else -- an inference this vendor's guides do not always support. Driven from a probe with the core halted, PA18 was held high for five seconds and low for one in a repeating cycle, sampled at both ends of every window across five cycles: the green diode is lit for the one-second stretch, so it lights when the pin is LOW, as LED0 does on PA19."

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "PA28"
active = "low"
source = "DS50002612A section 4.3.2 and Table 4-7: the generic user-configurable button SW0 on PA28, silkscreened SW0, Shared Functionality 'EXT1'. 'When the user button is pressed, it drives the I/O line to ground.' BOTH HALVES OF THIS ROW ARE MEASURED AND THE GUIDE IS RIGHT ON BOTH. Read from a probe with the core halted: parked as an input the pad follows whichever internal pull is enabled, and with no pull at all it keeps whichever level was applied last -- a pad holding its own gate charge, which is only possible if nothing outside the chip is driving it. SO NO PULL RESISTOR IS FITTED, exactly as the section's note says, and a program that opens this pin as a plain input reads a floating pad. That failure has no symptom: the button appears to work, intermittently, like a worn switch. With the internal pull-up enabled the pad rests HIGH and a press takes it LOW, observed six times across a fifteen-second window with holds from 159 ms to 1068 ms, so the button drives its line to ground and is ACTIVE LOW. The shortest excursions are around 160 ms and the longest deliberate holds near a second, so a consumer of this pin owes it a debounce."

[debug]
signals = ["swd"]
exposure = "header"
fitted = "no"
pitch_mm = 1.27
onboard = "edbg"
recovery = "probe"
source = "DS50002612A SAM R30 Xplained Pro user guide section 4.4.1 and Table 4-11, SWD Connections: SWD clock on PA30 and SWD data on PA31, both shared with the Cortex debug connector. THE POSITION IS AN UNPOPULATED FOOTPRINT, AND THAT IS FROM LOOKING AT THE BOARD RATHER THAN FROM THE GUIDE. A person with the kit in hand reports plated holes for a ten-pin connector and no header soldered into them, so a cable cannot be attached without fitting one first. The document could not have answered it: it gives the connector a numbered section and a full pin table and never says it is mounted, and the same guide marks its crystals mounted and not mounted in the feature list, so its silence reads either way. THE SAM L10 XPLAINED PRO IS THE CONTRAST AND IT MATTERS: that kit's guide carries the same wording about the same connector and its position IS populated, so the wording predicts nothing and only the board answers. The board carries a debugger this toolchain speaks, so the recovery path after any deploy is that debugger: it reaches the part over SWD regardless of what the application image did, which is what distinguishes it from a bootloader that has to survive in flash."
