# The SAM D21 Xplained Pro: board truth only -- what is wired to what. Chip truth lives in
# csp/samd21/. This is the PLAIN D21 XPro (kit 2130), part J18A: its EDBG VCP is SERCOM3 on
# PA22/PA23 (UG 42220).

[table]
kind = "board"
board = "microchip-samd21-xpro"
vendor = "microchip"
family = "samd21"
part = "atsamd21j18a"
product_model = 5
sources = [
    "SAM D21 Xplained Pro user guide UG 42220: EDBG VCP = SERCOM3, PA22 (PAD0) TX / PA23 (PAD1) RX, peripheral function C",
]

[[carriers]]
kind = "edbg-vcp"
usb_vid = 0x03EB
usb_pid = 0x2169
role = "vcp"
baud = 115200
plan = "osc8m-8mhz"
default = true

[[bindings]]
role = "vcp"
kind = "uart"
instance = "sercom3"
function = "C"
gclk_gen = 0
tx = { pin = "PA22", pad = 0 }
rx = { pin = "PA23", pad = 1 }

[[bindings]]
role = "ext1-spi"
kind = "spi"
instance = "sercom0"
function = "D"
gclk_gen = 0
mosi = { pin = "PA06", pad = 2 }
sck = { pin = "PA07", pad = 3 }
miso = { pin = "PA04", pad = 0 }
cs = { pin = "PA05", soft = true }
source = "UG 42220 section 4.1.1 Table 4-1: EXT1 pin 15 SPI_SS_A is PA05, pin 16 SPI_MOSI is PA06, pin 17 SPI_MISO is PA04 and pin 18 SPI_SCK is PA07, on SERCOM0 pads 1, 2, 0 and 3. DS40001882D Table 7-1 puts those pads in column D (SERCOM-ALT). MOSI on pad 2 with SCK on pad 3 is DOPO 1, and MISO on pad 0 is DIPO 0. The chip select is driven as a plain output."

# THE ONE TWI ALL THREE EXTENSION HEADERS SHARE. Pins 11 and 12 of EXT1, EXT2 and EXT3 are the same
# two pads, so a device on any header is on this one bus -- and so is the kit's debugger, whose data
# gateway reaches the same two pads as an I2C interface of its own.

[[bindings]]
role = "ext-twi"
kind = "i2c"
instance = "sercom2"
function = "D"
gclk_gen = 0
sda = { pin = "PA08" }
scl = { pin = "PA09" }
source = "UG 42220 section 4.1.1, Tables 4-1, 4-2 and 4-3: pin 11 TWI_SDA is PA08, SERCOM2 PAD[0], and pin 12 TWI_SCL is PA09, SERCOM2 PAD[1], on every extension header, each marked as shared with the other two headers and the EDBG. Table 4-12 names the same two pads as the EDBG's DGI I2C. DS40001882D Table 7-1 puts SERCOM2 PAD[0] and PAD[1] on those pads in column D (SERCOM-ALT), page 28."

# THE CONVERTER, AND THE SIX PADS THE EXTENSION HEADERS OFFER IT. Pins 3 and 4 of every Xplained
# Pro extension header are ADC(+) and ADC(-), and each is named here by its header position: the
# channel it becomes is the pin map's to say, not this table's. Every other AIN pad on this part
# reaches a header position the standard gives another function -- a serial bus, a PWM output, an
# interrupt line or a GPIO -- so none of them is offered as an analog input.

[[bindings]]
role = "adc"
kind = "adc"
instance = "adc"
function = "B"
gclk_gen = 0
reference_uv = 3300000
ext1_pin3 = { pin = "PB00" }
ext1_pin4 = { pin = "PB01" }
ext2_pin3 = { pin = "PA10" }
ext2_pin4 = { pin = "PA11" }
ext3_pin3 = { pin = "PA02" }
ext3_pin4 = { pin = "PA03" }
source = "UG 42220 section 4.1.1, Tables 4-1, 4-2 and 4-3: pins 3 ADC(+) and 4 ADC(-) are PB00 AIN[8] and PB01 AIN[9] on EXT1, PA10 AIN[18] and PA11 AIN[19] on EXT2, and PA02 AIN[0] and PA03 AIN[1] on EXT3. PA03 is also the USB ID line, and reaches EXT3 pin 4 only with jumper JS300 on J307 set for it (Table 4-3, note 1). The reference is the analog supply: Table 3-5 names VCC_P3V3, the regulated 3.3V, as the kit's main power supply, and the driver selects half of VDDANA at half gain, so full scale is the whole rail."

# THE PWM OUTPUTS OF THE EXTENSION HEADERS. Pins 7 and 8 of every Xplained Pro extension header are
# PWM(+) and PWM(-), and on this kit each header's pair is the two outputs of one counter, so each
# header is one binding and its outputs are named by the output they are, wo0 for WO[0]. Each counter
# rides generator 0; the three share no generic clock channel.

[[bindings]]
role = "ext1-pwm"
kind = "pwm"
instance = "tc6"
function = "E"
gclk_gen = 0
wo0 = { pin = "PB02" }
wo1 = { pin = "PB03" }
source = "UG 42220 section 4.1.1 Table 4-1: EXT1 pin 7 PWM(+) is PB02, TC6/WO[0], and pin 8 PWM(-) is PB03, TC6/WO[1]. DS40001882D Table 7-1 puts both in column E (TC/TCC), pages 29 and 30."

[[bindings]]
role = "ext2-pwm"
kind = "pwm"
instance = "tc4"
function = "E"
gclk_gen = 0
wo0 = { pin = "PB12" }
wo1 = { pin = "PB13" }
source = "UG 42220 section 4.1.1 Table 4-2: EXT2 pin 7 PWM(+) is PB12, TC4/WO[0], and pin 8 PWM(-) is PB13, TC4/WO[1]. DS40001882D Table 7-1 puts both in column E (TC/TCC), pages 28 and 29."

[[bindings]]
role = "ext3-pwm"
kind = "pwm"
instance = "tcc2"
function = "E"
gclk_gen = 0
wo0 = { pin = "PA12" }
source = "UG 42220 section 4.1.1 Table 4-3: EXT3 pin 7 PWM(+) is PA12, TCC2/WO[0], in DS40001882D Table 7-1's column E (TC/TCC), page 29. Pin 8's PA13, TCC2/WO[1], is not bound: it is the serial flash's SS, and it is disconnected from EXT3 pin 8 until the 0 ohm resistor R314 is moved to R313 (Table 4-3 note 2)."

[[plans]]
name = "osc8m-8mhz"
default = true
source = "osc8m"
gclk0_hz = 8000000

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "PB30"
active = "low"
source = "UG 42220 section 4.2.3 and Table 4-6: one yellow LED0 on PB30. THE POLARITY IS MEASURED AND NOT TRANSCRIBED. The guide's sentence 'The LED can be activated by driving the connected I/O line to GND' appears word for word across this vendor's kit guides and is wrong on at least one of them, so it is quoted here rather than relied on. Driven from a probe with the core halted, PB30 was held high for five seconds and low for one in a repeating cycle, sampled at both ends of every window: the diode is lit for the one-second stretch, so it lights when the pin is LOW and the guide is right on this board. The part was identified from the silicon rather than from the debugger's USB product id: CPUID 0x410cc601 is a Cortex-M0+ and the DSU DID at 0x41002018 reads 0x10010300, which decodes as processor 1, family 0, series 1, die 0, revision 3, device 0x00 -- the ATSAMD21J18A this table already names. THE PAD LEAVES THE BOARD: Table 4-3 puts PB30 on EXT3 pin 5 as GPIO1, so an extension fitted to EXT3 reaches the same wire as the LED, and a measurement of this pin must halt the core because the resident application drives it as an output."

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "PA15"
active = "low"
source = "UG 42220 section 4.2.2 and Table 4-5: the generic user-configurable button, silkscreened SW0, on PA15; the other mechanical button is RESET and reaches RESETN rather than a pin. 'When a button is pressed it will drive the I/O line to GND'. BOTH HALVES ARE NOW MEASURED, AND THE HALF THE GUIDE DOES NOT COVER IS THE ONE THAT MATTERED. Read from a probe with the core halted: with the internal pull-up enabled the pad rests HIGH and a press takes it LOW, seen ten times across a fifteen-second window with holds from 107 ms to 908 ms, so the button drives its line to ground and is ACTIVE LOW as the section says. THE GUIDE IS SILENT ON A PULL-UP -- the word does not occur anywhere in its 23 pages, where the Curiosity Nano guides state outright that no pull-up is fitted -- and the measurement answers what the document cannot: NO EXTERNAL PULL-UP IS FITTED. The pad follows whichever internal pull is enabled, so a program opening this pin as a plain input must enable the internal pull-up itself. ONE DIFFERENCE FROM THE TWO CURIOSITY NANOS IS RECORDED RATHER THAN EXPLAINED: unpulled, their pads keep whichever level was applied last, and this one settles LOW after either internal pull. Both readings mean no external pull-up; why this pad does not hold its charge as theirs do is not established here. The shortest excursion seen is 107 ms, so a consumer owes this pin a debounce. The pad also leaves the board: Table 4-3 puts PA15 on EXT3 pin 6 as GPIO2."

[debug]
signals = []
exposure = "unknown"
fitted = "unknown"
onboard = "edbg"
recovery = "probe"
source = "UG 42220 section 4.3: the kit carries an EDBG that programs and debugs the part over SWD, and Table 4-9 gives the two SWD signals between the debugger and the target. THE EXPOSURE IS STILL UNKNOWN AND THE GUIDE IS NOW HELD, WHICH IS A NARROWER STATEMENT THAN IT WAS. Its connectors section, 4.1, has exactly two subsections -- the Xplained Pro standard extension headers and the current measurement header -- and the document has no Cortex Debug Connector section anywhere, unlike the SAM D20 Xplained Pro guide beside it, which gives that connector a numbered section and a pin table. A document that describes no external debug position is not a board that has none: an unpopulated footprint is exactly the thing a guide omits, so this stays unknown until somebody looks at the board. The board carries a debugger this toolchain speaks, so the recovery path after any deploy is that debugger: it reaches the part over SWD regardless of what the application image did, which is what distinguishes it from a bootloader that has to survive in flash."
