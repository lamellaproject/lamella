# The SAM D21 Xplained Pro: board truth only -- what is wired to what. Chip truth lives in
# csp/samd21/. This is the PLAIN D21 XPro (kit 2130), part J18A: its EDBG VCP is SERCOM3 on
# PA22/PA23 (UG 42220).

[table]
kind = "board"
board = "samd21-xpro"
vendor = "microchip"
family = "samd21"
part = "atsamd21j18a"
product_model = 5
sources = [
    "SAM D21 Xplained Pro user guide UG 42220: EDBG VCP = SERCOM3, PA22 (PAD0) TX / PA23 (PAD1) RX, peripheral function C",
]

[[carriers]]
kind = "edbg-vcp"
usb_vid = 0x03EB
usb_pid = 0x2169
role = "vcp"
baud = 115200
plan = "osc8m-8mhz"
default = true

[[bindings]]
role = "vcp"
kind = "uart"
instance = "sercom3"
function = "C"
gclk_gen = 0
tx = { pin = "PA22", pad = 0 }
rx = { pin = "PA23", pad = 1 }

[[plans]]
name = "osc8m-8mhz"
default = true
source = "osc8m"
gclk0_hz = 8000000

# [[devices]] rows (LED0, the user button) belong here once transcribed from UG 42220 with the
# guide open.
