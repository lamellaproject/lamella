# BOARD binding: the 32F769IDISCOVERY (STM32F769I-DISCO), an STM32F769NI carrier.
#
# BOTH USER LEDS DRIVE, AND UM2033 SAYS THE OPPOSITE IN WORDS. The manual's section 5.16 reads "to
# light a LED, a zero low-logic state must be written in the corresponding GPIO register", and that
# sentence is wrong for this board. The MB1225 schematic settles it: LD_USER1 leaves the pin,
# passes through R62 and LD1, and the LED's cathode goes to GROUND -- and LD_USER2 through R63 and
# LD2 to the same ground node. A pin that reaches an anode through a resistor sources the current,
# so a ONE lights these LEDs.
#
# THE MANUAL IS RIGHT IN ITS TABLES AND WRONG IN ITS PROSE, TWICE IN THE SAME SECTION. Table 4's
# port assignment (PJ13, PJ5) is confirmed by the schematic ball-for-ball, and so are Table 4's LED
# colors -- while the prose beside both gets the colors wrong and the polarity wrong. A later
# reader of UM2033 5.16 should take its tables and verify its sentences.
#
# THE USER BUTTON READS THE SAME WAY AND THE MANUAL IS RIGHT ABOUT IT: "when the button is
# depressed the logic state is 1, otherwise, the logic state is 0". So every control line on this
# board is active high.
#
# NOT MODELLED, AND NAMED SO THE OMISSION IS DELIBERATE: a 128-Mbit SDRAM on the FMC (used as
# 4M x 32) and a 512-Mbit Quad-SPI NOR flash. Both are the external-memory stratum, which needs
# the controller instances and block tables this family does not have yet -- the same shape the
# stm32f7 family already carries for its own two memories.

[table]
kind = "board"
board = "st-stm32f769i-disco"
vendor = "st"
family = "stm32f769"
part = "stm32f769ni"
product_model = 30          # lamella_wire::product_model::STM32F769I_DISCO
sources = [
    "UM2033 Rev 5 (Discovery kit with STM32F769NI MCU) section 5.15: the serial interface USART1 is directly available as a virtual COM port of the PC, connected to the ST-LINK/V2-1 USB connector, configured with 115200 b/s, 8 bits data, no parity, one stop bit and no flow control.",
    "UM2033 Rev 5 section 5.16 and Table 4 (control port assignment): LD1 USER1 on PJ13 and LD2 USER2 on PJ5; the blue button B1 is the user button and the black button B2 is the reset. When B1 is depressed the logic state is 1. The same section says a zero lights a LED, which the board schematic contradicts -- see the MB1225 source below and the led0/led1 rows.",
    "MB1225 schematic rev B03 (32F769IDISCOVERY), sheet 13 of 13, the LEDs sheet: LD_USER1 -> R62 (1K 1% 0603) -> LD1 (red) -> GND, and LD_USER2 -> R63 (330R 1% 0603) -> LD2 (green) -> the same ground node. Sheet 4 gives the MCU side: ball B9 = PJ13 = LD_USER1, ball M14 = PJ5 = LD_USER2. Both LEDs are driven from the pin through their resistor into the anode, so a ONE lights them.",
    "UM2033 Rev 5 pin table: PA9 carries USART1_TX against the label VCP_TX, PA10 carries USART1_RX against VCP_RX, and PA0/WKUP carries the label B_USER.",
]
notes = [
    "UM2033 CONTRADICTS ITSELF ABOUT THE LED COLORS INSIDE ONE SECTION. Its prose says the four LEDs are 'LD1, LD2, LD3, and LD4 with respectively green, orange, red, and blue colors'; Table 4, eight lines below, gives LD1 RED, LD2 GREEN, LD3 GREEN and LD4 RED, and names no orange or blue LED at all. The assignment table is taken, because it is the table that also carries the port assignments this file depends on and because the same manual family has been wrong in its prose and right in its table before. The MB1225 schematic settles it and agrees with the table: LD1 is red and LD2 is green. No color reaches an artifact -- what the disagreement changes is which document a later reader should trust, and the answer measured twice now is the tables and the schematic, never the prose.",
    "LD3 and LD4 are deliberately not device rows. LD3 is the ARDUINO signal LED on PA12 rather than a user LED, and LD4 on PD4 indicates an OTG overcurrent condition -- neither is a general-purpose indicator a program should be told it owns.",
    "The user button is on PA0, which is also the part's wake-up pin. UM2033 describes B1 as usable 'as a digital input or as a wake-up alternate function' -- this row states the digital-input reading, which is the one a program polls; the wake-up path is a power-management fact nothing here models.",
]

# --- the carrier -----------------------------------------------------------------------------

[[carriers]]
kind = "stlink-vcp"         # the on-board ST-LINK/V2-1 bridge's VCP, on connector CN16.
role = "vcp"
baud = 115200
plan = "hsi-16mhz"
default = true

[[bindings]]
role = "vcp"
kind = "uart"
instance = "usart1"
function = "AF7"
tx = { pin = "PA9" }
rx = { pin = "PA10" }

# --- the operating point ----------------------------------------------------------------------
#
# THE PART'S OWN RESET STATE, deliberately. This part can reach 216 MHz through its PLL, and every
# route there is a configuration a program performs rather than a fact the board states. The
# internal oscillator is running at reset on every unit, so a plan naming it holds regardless of
# what the board's crystals are populated with -- and the divisor below is then a fact about the
# part and the rate rather than about a bring-up nobody has written yet.

[[plans]]
name = "hsi-16mhz"
default = true
source = "hsi"
hsi_hz = 16000000           # the F7 reset clock: HSI at 16 MHz, no PLL, prescalers 1.
pclk_hz = 16000000          # APB2, where USART1 sits. Equal to HSI under reset prescalers, which
                            # the generator verifies rather than assumes.

# The part's rated operating point, which the reset plan above deliberately does not reach.
# STATE-AND-VERIFY: this row states the divisors AND the rates they produce, and generation
# refuses unless the vendor's arithmetic holds and every range the manual sets is satisfied.
#
# THE 48 MHz DOMAIN IS THE REASON THIS ROW IS WORTH STATING RATHER THAN LEAVING TO A BRING-UP.
# It is a second output of the SAME VCO that produces the system clock, and it is what the SD/MMC
# controllers are clocked from -- so a program that raises the core clock moves the card clock
# with it. Stated here, the pair is checked together; left to code, they are two places to get
# right and only one of them fails loudly.
#
# THE TWO APB CEILINGS BELOW ARE THE DATASHEET'S, AND THE VENDOR'S TWO DOCUMENTS DISAGREE ABOUT
# THEM. The reference manual's prescaler-field cautions give 90 MHz for APB2 and 45 MHz for APB1;
# the datasheet's block diagram for this part gives 108 MHz and 54 MHz. The part-specific document
# is the one taken, since the manual covers a range of parts and its figures are the range's. A
# design following the manual's pair would halve both buses and lose nothing but speed.
[[plans]]
name = "pll-216mhz"
source = "pll"
hsi_hz = 16000000           # the same internal oscillator the reset plan names, so this point is
                            # reachable without depending on which crystals a unit is populated
                            # with. Its accuracy suits the card clock; a USB device needs a
                            # tighter reference than an RC oscillator provides, and would have to
                            # name a plan running from a crystal instead.
pll_m = 8                   # 16 MHz / 8 = 2 MHz at the VCO input -- the rate the manual
                            # recommends outright, to limit PLL jitter.
pll_n = 216                 # 2 MHz * 216 = 432 MHz VCO, the top of the permitted range.
pll_p = 2                   # 432 / 2 = 216 MHz system clock, the part's maximum.
pll_q = 9                   # 432 / 9 = 48 MHz EXACTLY, which is what makes 432 the right VCO:
                            # the SD/MMC and USB domain divides from it with no remainder.
sysclk_hz = 216000000
pll48_hz = 48000000
pclk_hz = 108000000         # APB2 = sysclk / 2, where USART1 and both SD/MMC controllers sit.
pclk1_hz = 54000000         # APB1 = sysclk / 4.

# --- control lines ---------------------------------------------------------------------------
#
# BOTH USER LEDS ARE ACTIVE HIGH, read off the MB1225 schematic rather than off UM2033's sentence,
# which says the opposite and is wrong. Confirmed on the board as well as on the schematic: PJ13
# driven low leaves LD1 dark and driven high lights it. Read backwards, this board's LEDs are dark
# from reset until a program drives them. A manual sentence about polarity is a claim; the net is
# the fact.

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "PJ13"
active = "high"
source = "MB1225 schematic rev B03 sheet 13: LD_USER1 reaches LD1's anode through R62 (1K) and LD1's cathode goes to GND, so the pin sources the current and a ONE lights it. Sheet 4: ball B9 is PJ13 and carries LD_USER1, which is the same assignment UM2033 Rev 5 Table 4 gives for LD1/USER1. UM2033 section 5.16 says a zero lights a LED; that sentence is wrong for this board, and it is the reason this row is sourced from the schematic rather than from the manual that names the pin."

[[devices]]
name = "led1"
kind = "gpio-out"
pin = "PJ5"
active = "high"
source = "MB1225 schematic rev B03 sheet 13: LD_USER2 reaches LD2's anode through R63 (330R) and LD2's cathode joins LD1's at the same ground node, so the pin sources the current and a ONE lights it. Sheet 4: ball M14 is PJ5 and carries LD_USER2, which is the same assignment UM2033 Rev 5 Table 4 gives for LD2/USER2. This row is read from the schematic only -- LD1 is the one that has also been watched on the board -- and the two LEDs are the same net shape."

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "PA0"
active = "high"
source = "UM2033 Rev 5 section 5.16: the blue button B1 is available as a digital input, and when the button is depressed the logic state is 1, otherwise the logic state is 0. Its pin is PA0 -- the manual's pin table gives PA0/WKUP the board label B_USER."

[debug]
signals = []
exposure = "unknown"
fitted = "unknown"
onboard = "st-link"
recovery = "probe"
source = "The board carries an on-board ST-LINK that programs and debugs the part over SWD. The board carries a debugger this toolchain speaks, so the recovery path after any deploy is that debugger: it reaches the part over SWD regardless of what the application image did, which is what distinguishes it from a bootloader that has to survive in flash."
