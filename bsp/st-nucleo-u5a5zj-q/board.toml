# BOARD binding: the ST NUCLEO-U5A5ZJ-Q. Chip truth lives in csp/stm32u5a5/.
#
# THE VIRTUAL COM PORT IS SELECTABLE BETWEEN TWO PERIPHERALS BY SOLDER BRIDGE, and the default is
# USART1 on PA9/PA10 rather than the LPUART. UM2861 gives the reason in its own words: USART1 is the
# interface that supports bootloader mode. The alternative is LPUART1 on PG7/PG8, reached by moving
# SB24/SB26 ON and SB25/SB27/SB32/SB34 OFF.
#
# ONE REFERENCE BOARD, TWO DIFFERENT PARTS. UM2861 covers MB1549 under two order codes --
# NUCLEO-U575ZI-Q and NUCLEO-U5A5ZJ-Q -- so the board id selects the chip row and the board SHAPE
# does not. A sibling board file for the U575 variant would point at a different family entirely.

[table]
kind = "board"
board = "st-nucleo-u5a5zj-q"
vendor = "st"
family = "stm32u5a5"
part = "stm32u5a5zjt6q"
product_model = 40          # lamella_wire::product_model::NUCLEO_U5A5ZJ_Q
sources = [
    "STM32U5 Nucleo-144 board user manual UM2861 (MB1549), whose introduction names the order codes NUCLEO-U575ZI-Q and NUCLEO-U5A5ZJ-Q and states that the board integrates an STLINK-V3E debugger/programmer",
    "UM2861 section 7.9 and tables 10 and 11 for the virtual COM port selection, and its LED and user-button sections for LD1, LD2, LD3 and B1",
]
notes = [
    "USER LEDS: LD1 green on PC7 by default, or PA5 if SB21 is moved OFF and SB23 ON; LD2 blue on PB7; LD3 red on PG2. All three are ON when the I/O is HIGH. The user button B1 is PC13 by default (SB58 ON, SB59 OFF) or PA0 optionally.",
    "THE RESET CLOCK DOES NOT DIVIDE EVENLY INTO 115200. MSIS runs at 4 MHz out of reset, so the divisor rounds to 35 and the line runs at about 114300 baud -- roughly -0.8%, inside tolerance for an 8-bit frame but not zero. Firmware wanting margin raises the clock and states that as its own plan.",
    "LD1's OPTIONAL POSITION IS THE HEADER'S SPI CLOCK. PA5 is ST Zio D13, and UM2861's own connector table spells that row SPI_A_SCK on SPI1. So moving LD1 to PA5 puts the user LED and SPI1's clock on one pad, mutually exclusive and unreported by the chip -- the same collision the ATSAMD10-XMINI has on PA09 and the NUCLEO-L011K4 has on PB3. This board is the one that ships OUT of the collision and lets a design opt in, which is a state a reservation record would need to be able to express.",
]

[[carriers]]
kind = "stlink-vcp"         # the on-board STLINK-V3E, per UM2861's introduction
role = "vcp"
baud = 115200
plan = "msis-4mhz"
default = true

[[bindings]]
role = "vcp"
kind = "uart"
instance = "usart1"
function = "AF7"            # DS13543 table 28; NOT the L011's AF4 -- an AF number is per product
tx = { pin = "PA9" }
rx = { pin = "PA10" }

[[plans]]
name = "msis-4mhz"
default = true
source = "msis"
msis_hz = 4000000           # RM0456: "MSIS is used as system clock source after startup from
pclk_hz = 4000000           # reset, configured at 4 MHz", with reset prescalers at 1

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "PC7"
active = "high"
source = "UM2861 Rev 10 (MB1549), subsection 'User green LED (LD1)': the user green LED (LD1) is connected to the PC7 STM32 I/O (SB21 ON and SB23 OFF, default configuration). Its LED section states that these user LEDs are ON when the I/O is in the HIGH state, and are OFF when the I/O is in the LOW state. The optional position moves LD1 to PA5 with SB21 OFF and SB23 ON, which is the Zio D13 pad the same manual's connector table spells SPI_A_SCK on SPI1; this row states the default."

[[devices]]
name = "led1"
kind = "gpio-out"
pin = "PB7"
active = "high"
source = "UM2861 Rev 10 (MB1549), subsection 'User blue LED (LD2)': the user blue LED (LD2) is connected to PB7, driven through a transistor so the LED lights whatever the MCU supply. Its LED section states that these user LEDs are ON when the I/O is in the HIGH state, and are OFF when the I/O is in the LOW state."

[[devices]]
name = "led2"
kind = "gpio-out"
pin = "PG2"
active = "high"
source = "UM2861 Rev 10 (MB1549), subsection 'User red LED (LD3)': the user red LED (LD3) is connected to PG2, driven through a transistor so the LED lights whatever the MCU supply. Its LED section states that these user LEDs are ON when the I/O is in the HIGH state, and are OFF when the I/O is in the LOW state."

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "PC13"
active = "high"
pull = "down"
source = "UM2861 Rev 10 (MB1549) section 7.6 Push-buttons: the blue button for the user and wakeup functions is connected to PC13 to support the default TAMPER function, with SB58 ON and SB59 OFF as the default configuration; SB58 OFF and SB59 ON moves it to PA0 instead. The same section states that when the button is pressed the logic state is HIGH, otherwise the logic state is LOW. That section also carries a warning this row exists to carry with the pin: the PC13 I/O used for the user button must be set to INPUT, pulldown (PD) with debouncing, and PC13 must never be set to OUTPUT/LOW level, to avoid a shortcut when the user button is pressed."

[debug]
signals = []
exposure = "unknown"
fitted = "unknown"
onboard = "st-link"
recovery = "probe"
source = "The board carries an on-board ST-LINK that programs and debugs the part over SWD. The board carries a debugger this toolchain speaks, so the recovery path after any deploy is that debugger: it reaches the part over SWD regardless of what the application image did, which is what distinguishes it from a bootloader that has to survive in flash."
