# BOARD binding: the BBC micro:bit v2. Board truth ONLY: role
# bindings, on-board devices, the carrier, and the clock plan. Chip truth lives in
# csp/nrf52833/.
#
# The internal I2C bus (I2C_INT) is SHARED: the LSM303AGR motion sensor and the KL27
# interface MCU are co-resident (schematic; the KL27 answers 0x70/0x71/0x72), with STRONG
# 1k board pull-ups (R51/R52) -- which is why the TWI pins run pull-disabled (the twi
# block's Table-51 PIN_CNF_TWI value).

[table]
kind = "board"
board = "micro-bit-v2"
vendor = "micro-bit"
family = "nrf52833"
part = "nrf52833"
board_model = 11            # lamella_wire::board_model::MICROBIT_V2
sources = ["micro:bit v2.0.0_S schematic (I2C_INT wiring, bus residents, 1k pulls)"]

[[carriers]]
kind = "daplink-vcp"        # the on-board DAPLink bridge's VCP. The carrier states the bridge
                            # identity class only; its fixed USB ids are stated once host
                            # tooling pins them with evidence.
plan = "hfclk-default"
default = true

[[bindings]]
role = "internal-i2c"
kind = "i2c"
instance = "twi0"
function = "twi"
scl = { pin = "P0.08" }
sda = { pin = "P0.16" }

[[plans]]
name = "hfclk-default"
default = true
source = "hfclk"            # the TWI times itself from HFCLK and its FREQUENCY register is
                            # ENUMERATED (K100/K250/K400) -- no divisor derives from a rate,
                            # so this plan states the operating point's name only; rates
                            # join when a consumer actually derives from them.

# THE MOTION SENSOR PART IS NOT GUARANTEED BY THE BOARD REVISION, and the two rows below assert
# one. The vendor's own hardware documentation, https://tech.microbit.org/hardware/2-0-revision/ ,
# states verbatim:
#
#   "The micro:bit has a footprint for two different motion sensors: one made by ST (the
#    LSM303AGR) and one by NXP (FXOS8700CQ). The micro:bit DAL supports both of these sensors,
#    detecting them at runtime. Only one sensor will ever be placed."
#
# So the footprint is shared and the placed part is a MANUFACTURING fact, not a design guarantee
# -- which is why the reference runtime DETECTS the sensor rather than assuming it. The ST part
# answers as two bus residents (accelerometer 0x19, magnetometer 0x1E); the NXP part is a single
# combined device and does not. A consumer that must be correct on any unit should probe
# WHO_AM_I (LSM303AGR answers 0x33 at 0x0F, 0x40 at 0x4F) rather than trust these rows.
#
# They are kept because they are true of every unit measured here and a board must say what is on
# its bus. For the sibling revision the same vendor page adds "To date, all V1.5 boards have been
# manufactured with the LSM303AGR", so the alternative footprint appears never to have been
# exercised there; no equivalent statement is published for this revision.

[[devices]]                 # the motion sensor's ACCELEROMETER half, wired on the internal
name = "lsm303agr"          # bus. One package answering two addresses is two bus residents,
kind = "i2c-device"         # so it is two rows -- see the row below, and the caveat above.
role = "internal-i2c"
address = 0x19
source = "micro:bit v2.0.0_S schematic (bus residents): the accelerometer answers at 0x19 (WHO_AM_I 0x33), the magnetometer at 0x1E (WHO_AM_I 0x40). PART NOT GUARANTEED BY REVISION -- tech.microbit.org/hardware/2-0-revision/ states the board has a shared footprint for the ST LSM303AGR and the NXP FXOS8700CQ, only one is ever placed, and the reference runtime detects which at run time"

[[devices]]                 # the same package's MAGNETOMETER half. A second address on
name = "lsm303agr-mag"      # the same bus is board truth exactly as the first one is:
kind = "i2c-device"         # what answers where is the schematic's to say, not a
role = "internal-i2c"       # sensor driver's. Present only if the ST part is placed.
address = 0x1E
source = "micro:bit v2.0.0_S schematic (bus residents): the accelerometer answers at 0x19 (WHO_AM_I 0x33), the magnetometer at 0x1E (WHO_AM_I 0x40). PART NOT GUARANTEED BY REVISION -- tech.microbit.org/hardware/2-0-revision/ states the board has a shared footprint for the ST LSM303AGR and the NXP FXOS8700CQ, only one is ever placed, and the reference runtime detects which at run time"

# The 5x5 display, as ten pin-wired device rows. It is a CHARLIEPLEXED-style scanned matrix:
# a row line SOURCES current (drive high to light) and a column line SINKS it (drive low to
# light), so one LED is lit by asserting its row and its column together, and the display is
# swept row by row fast enough to look continuous.
#
# These ten pins are why board truth needs a home of its own: nothing about the chip says which
# pins reach LEDs, and no register map can. Stating them here lets the generator resolve each to
# its own port base, index, and mask, in every language -- including P1.05, which sits on the
# second GPIO port and whose flat index is therefore not its pin number.
[[devices]]
name = "display-row1"
kind = "gpio-out"
pin = "P0.21"
active = "high"
source = "micro:bit v2.0.0_S schematic (display matrix ROW1)"

[[devices]]
name = "display-row2"
kind = "gpio-out"
pin = "P0.22"
active = "high"
source = "micro:bit v2.0.0_S schematic (display matrix ROW2)"

[[devices]]
name = "display-row3"
kind = "gpio-out"
pin = "P0.15"
active = "high"
source = "micro:bit v2.0.0_S schematic (display matrix ROW3)"

[[devices]]
name = "display-row4"
kind = "gpio-out"
pin = "P0.24"
active = "high"
source = "micro:bit v2.0.0_S schematic (display matrix ROW4)"

[[devices]]
name = "display-row5"
kind = "gpio-out"
pin = "P0.19"
active = "high"
source = "micro:bit v2.0.0_S schematic (display matrix ROW5)"

[[devices]]
name = "display-col1"
kind = "gpio-out"
pin = "P0.28"
active = "low"
source = "micro:bit v2.0.0_S schematic (display matrix COL1, current sink)"

[[devices]]
name = "display-col2"
kind = "gpio-out"
pin = "P0.11"
active = "low"
source = "micro:bit v2.0.0_S schematic (display matrix COL2, current sink)"

[[devices]]
name = "display-col3"
kind = "gpio-out"
pin = "P0.31"
active = "low"
source = "micro:bit v2.0.0_S schematic (display matrix COL3, current sink)"

[[devices]]                 # the ONLY matrix line on the chip's second GPIO port -- the fact
name = "display-col4"       # that made the second port instance row necessary.
kind = "gpio-out"
pin = "P1.05"
active = "low"
source = "micro:bit v2.0.0_S schematic (display matrix COL4, current sink; the sole P1 line)"

[[devices]]
name = "display-col5"
kind = "gpio-out"
pin = "P0.30"
active = "low"
source = "micro:bit v2.0.0_S schematic (display matrix COL5, current sink)"
