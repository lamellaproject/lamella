# BOARD binding: the SAM4S Xplained Pro -- identity-first. Board truth only: the identity,
# the part, and the carrier. NO peripheral bindings yet (the SAM4S family has no generated
# driver); the vcp binding + its pin rows (UART1, PB2 URXD1 / PB3 UTXD1, peripheral A)
# land here with the family's driver.

[table]
kind = "board"
board = "sam4s-xpro"
vendor = "microchip"
family = "sam4s"
part = "atsam4sd32c"
product_model = 3           # lamella_wire::product_model::SAM4S_XPLAINED_PRO
sources = ["SAM4S Xplained Pro board identity via the on-board EDBG bridge"]

[[carriers]]
kind = "edbg-vcp"           # the on-board EDBG bridge's VCP.
usb_vid = 0x03EB            # the debugger's own USB identity, read off this kit rather than
usb_pid = 0x2111            # inherited from a sibling. THE PAIR NARROWS TO A KIT AND NEVER TO A
                            # BOARD: several Xplained Pro kits answer 0x2111, so anything that must
                            # reach THIS board settles the rest on the probe's serial.
baud = 115200               # the bridge's wire rate (BRGR CD 65 at the 120 MHz operating
                            # point realizes 115385, in tolerance)
default = true              # this board states no [[plans]] row, so the carrier names no
                            # operating point.
