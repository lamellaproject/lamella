# BOARD binding: the Arduino GIGA R1 WiFi, an STM32H747XIH6 on Arduino's ABX00063 in the Mega form
# factor.
#
# THIS BOARD HAS NO ON-BOARD DEBUGGER AND NO USB-SERIAL BRIDGE, AND BOTH ABSENCES ARE DELIBERATE
# rather than unrecorded. The user manual's component table names every populated integrated circuit
# -- the microcontroller, the SDRAM, the flash, the secure element, the wireless module and two buck
# converters -- and none of them is a debug probe or a serial bridge. What the board offers instead
# is a six-pin JTAG header with no probe fitted, and a USB-C connector wired to the microcontroller's
# OWN device controller. So the carrier below is `native-usb`, and it names neither a baud nor an
# operating point, because a rate is a property of a wire that has one and this wire does not.
#
# THE FOUR HEADER SERIAL PORTS ARE A SECOND CARRIER THAT IS NOT DECLARED HERE. The pinout gives
# Serial0 through Serial3 as PA9/PB7, PD5/PD6, PH13/PI9 and PG14/PC7, and each is a real path to a
# host through an EXTERNAL dongle. Binding one would need its own operating point and its own
# divisor, and the choice of which is not a fact this document settles, so no uart binding is
# stated and none is implied.
#
# THE USER BUTTON IS THE BOOT0 BUTTON, WHICH IS A HARDER FACT THAN IT LOOKS. The schematic runs
# ONE net to both the microcontroller's PC13 ball and its BOOT0 ball, so a program may read the
# button freely at run time, but a unit powered up with it held enters the system bootloader
# instead of the application. The device row below states the pin a program reads; it cannot state
# what the same pin does to a reset, and nothing here should be read as saying the button is free
# of consequence at power-on.
#
# NOT MODELLED, AND NAMED SO EACH OMISSION IS DELIBERATE: the 16 Mbytes of QSPI NOR flash and the
# 8 Mbytes of SDRAM (both fitted, both belonging to the external-memory stratum, and the SDRAM is
# the one a summary of this board is most likely to miss), the wireless module and its antenna
# connector, the secure element, the camera and display connectors, the audio jack and its two
# converter outputs, the USB 2.0 type A host connector, the 16 MHz oscillator and the 32.768 kHz
# crystal, and the power LED, which no pin drives.

[table]
kind = "board"
board = "arduino-giga-r1-wifi"
vendor = "arduino"
family = "stm32h7"
part = "stm32h747xi"
board_model = 33            # lamella_wire::board_model::ARDUINO_GIGA_R1_WIFI
sources = [
    "Arduino GIGA R1 WiFi user manual (SKU ABX00063), features section: the microcontroller is an STM32H747XIH6 with a 32-bit Arm Cortex-M7 core with double-precision FPU up to 480 MHz and a 32-bit Arm Cortex-M4 core with FPU up to 240 MHz. The same section gives the memory as 2 MB flash and 1 MB RAM on the STM32H747XI, 16 MB of NOR flash on an AT25SF128A-MHB-T over a QSPI interface, and 8 MB of SDRAM on an AS4C4M16SA.",
    "Arduino GIGA R1 WiFi user manual (SKU ABX00063) section 6.1, the front-view component table: DL2 is an RGB SMLP34RGB2W3 common anode LED, DL1 is the power LED, PB1 is the RESET button, PB2 is the BOOT0 button, and the populated integrated circuits are U1 the microcontroller, U3 the 8 MB SDRAM, U4 the secure element, U5 the wireless module, U6 and U7 the buck converters and U8 the 16 MB flash. Section 13.5 states that the board has a built-in bootloader which allows flashing over USB, entered by double-tapping the reset button right after power-up.",
    "Arduino GIGA R1 WiFi full pinout (ABX00063, page 1 of 9, 12 Jul 2023): the microcontroller is drawn as an STM32H747XIH6; the RGB LED's three legs are PI12 as D86 RED, PJ13 as D87 GREEN and PE3 as D88 BLUE; PC13/BOOT0 is the BOOT0_BUTTON, annotated 'It can be used as USER button'; RESET_BUTTON goes to the reset pin. The same page carries a boxed warning that pins A8, A9, A10 and A11 are ONLY analog pins, no GPIO peripherals, and draws the four as PC2_C, PC3_C, PA1_C and PA0_C.",
    "Arduino GIGA R1 WiFi schematics (ABX00063 V1.6, 19 Dec 2023), sheet TOP.SchDoc: DL2's pin 4 is tied to +3V3 and its three remaining legs run through R11, R12 and R13, each 330 ohm, to the nets PI12, PE3 and PJ13, which the sheet's own test points label RED, BLUE and GREEN. Push-button PB2 connects +3V3 to the net carrying BOOT0 and PC13; push-button PB1 connects the reset pin to ground.",
    "Arduino GIGA R1 WiFi schematics (ABX00063 V1.6), sheet STM32H747.SchDoc: R4, 100 kohm, holds the BOOT0/PC13 net to ground, and that net reaches the microcontroller at ball E8 (BOOT0) and at ball E3 (PC13). The same sheet gives PA0_C ball T1, PA1_C ball T2, PC2_C ball R1 and PC3_C ball R2, beside PA0 at N5, PA1 at N4, PC2 at M3 and PC3 at M4.",
]
notes = [
    "THE RGB LED IS ONE COMPONENT AND IT IS DESCRIBED HERE AS THREE, WHICH IS THE MODEL'S LIMIT RATHER THAN THE BOARD'S SHAPE. DL2 is a single part with one common anode and three cathodes, and three independent output rows say nothing about their sharing a package, a supply or a duty budget. A program that drives all three at once is driving one component through three descriptions, and the file cannot say so.",
    "THE ANALOG HEADER PINS A8 THROUGH A11 REACH PADS THIS FILE CANNOT NAME, and the board is what makes the distinction unmissable: its analog header carries A7 = PA0 and A11 = PA0_C as two separate header pins, A5 = PC2 beside A8 = PC2_C, and A4 = PC3 beside A9 = PC3_C. Those are different balls of the same package -- N5 against T1, M3 against R1, M4 against R2 -- and the part's own datasheet says outright that a Pxy_C pad and its Pxy pad are two separate pads. A pin name in this model is a port letter and an index, so the four have no name to be given, and writing the unsuffixed name for one of them would claim a pin the header already reaches at a different position. They are therefore absent from the part's pin list, not marked unavailable in it.",
    "THE USER MANUAL AND THE PINOUT DISAGREE ABOUT A8 THROUGH A11 AND THE PART'S DATASHEET SETTLES IT. The manual's analog pinout table describes all twelve analog pins identically, as 'Analog input N /GPIO'; the pinout drawing carries a boxed warning that the last four are analog only with no GPIO peripherals. The datasheet's pin table gives those four pads the pin type ANA where every neighbouring row reads I/O, so the drawing is right and the table is wrong, and no row here is derived from that table.",
    "THE VENDOR'S OWN WEB SUMMARY OF THIS BOARD OMITS THE SDRAM, AND THE DOCUMENTS DO NOT. The 8 Mbytes are stated four times over -- in the manual's features list, in its onboard-memories section, in its front-view component table as U3, and on the schematic as an AS4C4M16SA-6BIN -- so the fitted part is not in doubt and no third-party source is needed to establish it. It is left unmodelled here for the same reason the other external memory is: a region belongs to the external-memory stratum and needs its controller brought up first.",
    "NO OPERATING POINT IS STATED, AND THAT IS A CONSEQUENCE OF THE CARRIER RATHER THAN AN OMISSION. A plan exists for divisors to derive from; with no uart binding there is nothing to derive, and the value that a native-USB wire actually constrains -- the 48 MHz the device controller needs -- is not a rate this schema carries or checks. Stating the part's reset clock here would describe an operating point nothing on the board holds it to.",
]

# --- the carrier ------------------------------------------------------------------------------
#
# THE MICROCONTROLLER'S OWN USB DEVICE CONTROLLER, over the USB-C connector J12, which the manual
# lists as the programming port. There is no bridge between it and the host, which is why the row
# carries no vendor identity: a bridge has a USB identity of its own to state and this path has
# only the device the target itself presents.

[[carriers]]
kind = "native-usb"
default = true

# --- control lines ----------------------------------------------------------------------------
#
# ALL THREE LEDS SINK AND THE POLARITY IS READ FROM THE WIRING, NOT FROM A WORD. The component
# table calls DL2 a common anode LED, which is a strong reading and not a diagram; the schematic
# settles it directly by putting DL2's pin 4 on +3V3 and running each of the three cathodes through
# its own 330 ohm resistor to a microcontroller pin. The pin is the driven end of the diode, so it
# sinks, and a leg lights when its pin is driven LOW.
#
# AND THAT IS THE OPPOSITE OF THE OTHER STM32H7 CARRIER DESCRIBED FOR THIS FAMILY, whose three
# user LEDs are on when the I/O is high and off when it is low, in its own manual's words. One
# family, two carriers, opposite conventions on the pins a first program drives: a reader who
# learned the rule from one gets the other wrong three times, and dark is exactly what a wrong
# polarity and a missing wire look like alike. Polarity is a per-BOARD reading, never a per-family
# or per-vendor one.
#
# THE OPENING WRITE IS ALSO NOT THE ONE A DRIVER WOULD EXPECT. Pins on this part come out of
# reset in ANALOG mode rather than as inputs, so a program that sets or clears an output register
# without first putting the pin in output mode drives nothing at all. That is a chip fact and it
# lives on the gpio block table; it is repeated here because these four rows are the first thing
# anyone drives on a new carrier.

[[devices]]
name = "led_red"
kind = "gpio-out"
pin = "PI12"
active = "low"
source = "Arduino GIGA R1 WiFi full pinout page 1 gives PI12 as the RED leg of the RGB LED, at digital pin D86. The schematics sheet TOP.SchDoc wires that net through R11, 330 ohm, to a cathode of DL2, whose pin 4 is the common anode at +3V3, and taps the same net at a test point labelled RED. The user manual's component table names DL2 an RGB SMLP34RGB2W3 common anode LED, so the pin sinks and the leg lights when it is driven low."

[[devices]]
name = "led_green"
kind = "gpio-out"
pin = "PJ13"
active = "low"
source = "Arduino GIGA R1 WiFi full pinout page 1 gives PJ13 as the GREEN leg of the RGB LED, at digital pin D87. The schematics sheet TOP.SchDoc wires that net through R13, 330 ohm, to a cathode of DL2 and taps it at a test point labelled GREEN, and the STM32H747.SchDoc sheet brings the same net to ball E10 of the package. DL2's pin 4 is the common anode at +3V3, so the pin sinks and the leg lights when it is driven low."

[[devices]]
name = "led_blue"
kind = "gpio-out"
pin = "PE3"
active = "low"
source = "Arduino GIGA R1 WiFi full pinout page 1 gives PE3 as the BLUE leg of the RGB LED, at digital pin D88. The schematics sheet TOP.SchDoc wires that net through R12, 330 ohm, to a cathode of DL2 and taps it at a test point labelled BLUE. DL2's pin 4 is the common anode at +3V3, so the pin sinks and the leg lights when it is driven low. This leg is stated on the same evidence as the other two rather than by analogy with them: the schematic draws all three cathodes."

[[devices]]
name = "button"
kind = "gpio-in"
pin = "PC13"
active = "high"
source = "Arduino GIGA R1 WiFi full pinout page 1 labels PC13/BOOT0 as BOOT0_BUTTON and states that it can be used as USER button. The schematics sheet TOP.SchDoc gives push-button PB2 one terminal on +3V3 and the other on the net carrying BOOT0 and PC13, and sheet STM32H747.SchDoc holds that net to ground through R4, 100 kohm. So the pin reads low while the button is open and high while it is pressed, and the idle level is defined by a fitted resistor rather than left floating."
