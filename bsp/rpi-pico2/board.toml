# BOARD binding: the Raspberry Pi Pico 2. Board truth ONLY:
# role bindings, the reference rail, the carrier, and the clock plan. Chip truth lives in
# csp/rp2350/.

[table]
kind = "board"
board = "pico2"
vendor = "raspberry-pi"
family = "rp2350"
part = "rp2350a"
board_model = 2             # lamella_wire::board_model::PICO2
sources = ["Raspberry Pi Pico 2 pinout (GP0/GP1 header pins 1/2, GP4/GP5 pins 6/7, GP16-GP19 pins 21/22/24/25; 12 MHz crystal; 3V3 ADC rail)"]

[memory]                    # the RP2350 has NO internal flash (chip flash = 0,
flash = 0x400000            # gate-pinned) -- the 4 MB QSPI chip it XIPs from is BOARD truth.
source = "the Pico 2 family's stated 4 MB flash (the Pico 2 W datasheet's key-features list; the plain Pico 2 PDF states the same family figure)"

[[carriers]]
kind = "native-usb"         # the chip's own USB device controller -- no bridge, and so no
                            # board-fixed bridge identity to state.
plan = "pll-150-48"
default = true

[[carriers]]
kind = "uart"               # the SECOND wire: the debug-bridge UART, riding the uart0
role = "uart0"              # binding through an EXTERNAL bridge (RPi Debug Probe, any
baud = 115200               # USB-UART dongle) at the SAME operating point as the usb wire.
plan = "pll-150-48"         # the same plan the usb carrier names: both wires run at this
                            # one operating point.

[[bindings]]
role = "uart0"
kind = "uart"
instance = "uart0"
function = "F2"
tx = { pin = "GP0" }
rx = { pin = "GP1" }

[[bindings]]
role = "spi0"
kind = "spi"
instance = "spi0"
function = "F1"
mosi = { pin = "GP19" }
sck = { pin = "GP18" }
miso = { pin = "GP16" }
cs = { pin = "GP17" }

[[bindings]]
role = "i2c0"
kind = "i2c"
instance = "i2c0"
function = "F3"
sda = { pin = "GP4" }
scl = { pin = "GP5" }

[[bindings]]
role = "adc"
kind = "adc"
instance = "adc"
reference_uv = 3300000
source = "ADC_VREF/ADC_AVDD ride the board's filtered 3V3 rail. The datasheet's sensitivity warning: 1% of reference moves a reading over 4 C; an external reference improves absolute accuracy."

[[plans]]
name = "pll-150-48"         # the operating point: clk_sys 150 MHz off
default = true              # PLL_SYS, clk_usb/clk_adc 48 MHz off PLL_USB, clk_peri left
source = "xosc"             # crystal-exact (state-and-verify: generation checks
xosc_hz = 12000000          # hz == xosc * fbdiv / (postdiv1 * postdiv2) per PLL).
clk_peri_hz = 12000000
clk_sys_hz = 150000000
clk_usb_hz = 48000000
clk_adc_hz = 48000000
pll_sys_fbdiv = 125
pll_sys_postdiv1 = 5
pll_sys_postdiv2 = 2
pll_usb_fbdiv = 100
pll_usb_postdiv1 = 5
pll_usb_postdiv2 = 5
