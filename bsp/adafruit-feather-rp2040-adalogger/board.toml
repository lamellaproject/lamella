# BOARD binding: the Adafruit Feather RP2040 Adalogger (product 5980). Board truth ONLY: the
# on-board devices, the carrier, the clock plan, and the soldered XIP flash. Chip truth lives in
# csp/rp2040/.
#
# A FACT A READER WOULD GET WRONG BY ASSUMING: the STEMMA QT / header I2C on GP2/GP3 is
# **I2C1**, NOT I2C0 -- SDA/SCL on function F3, per the RP2040 datasheet's GPIO Functions table
# (GPIO2: SPI0 SCK | UART0 CTS | I2C1 SDA | PWM1 A | SIO). The instance decides the base
# (I2C1 = 0x40048000, I2C0 = 0x40044000), so "the QT port is on I2C0" would be wrong by 0x4000.
#

[table]
kind = "board"
board = "feather-rp2040-adalogger"
vendor = "adafruit"
family = "rp2040"
part = "rp2040"
board_model = 18            # lamella_wire::board_model::FEATHER_RP2040_ADALOGGER
sources = [
    "Adafruit CircuitPython board definition ports/raspberrypi/boards/adafruit_feather_rp2040_adalogger/pins.c -- the board's own authoritative pin map: LED = GPIO13, NEOPIXEL = GPIO17, BUTTON/BOOT = GPIO7, TX/RX = GPIO0/GPIO1, SDA/SCL = GPIO2/GPIO3, header SCK/MOSI/MISO = GPIO14/GPIO15/GPIO8, SD_CLK/SD_MOSI/SD_MISO/SD_CS = GPIO18/GPIO19/GPIO20/GPIO23, SD_CARD_DETECT = GPIO16",
    "Adafruit product 5980 (Feather RP2040 Adalogger): 8 MB flash, microSD slot, STEMMA QT connector",
]

[memory]                    # the RP2040 has NO internal flash (chip flash = 0, gate-pinned) --
flash = 0x800000            # the 8 MB QSPI chip it XIPs from is BOARD truth, and it is the
                            # thing that most distinguishes this board from a Pico (4x the Pico's
                            # 2 MB).
source = "Adafruit product 5980 feature list ('8 MB of SPI Flash') -- the board's advertised part; how the XIP window is split is a firmware linker-script concern, as on the Pico"

[[carriers]]
kind = "native-usb"         # the chip's own USB device controller. No debugger, no bridge UART:
plan = "xosc-12mhz"         # the board is programmed through the RP2040 bootrom (BOOTSEL exposes
default = true              # a drive) and speaks over its own USB.

[[bindings]]                # the header UART, on the same pins and function as the Pico's.
role = "uart0"
kind = "uart"
instance = "uart0"
function = "F2"
tx = { pin = "GP0" }
rx = { pin = "GP1" }

[[plans]]
name = "xosc-12mhz"
default = true
source = "xosc"
xosc_hz = 12000000          # the board's soldered crystal, the same 12 MHz the Pico runs
clk_peri_hz = 12000000      # clk_peri rides AUXSRC xosc directly (no divider) -- the generator
                            # verifies this equality (state-and-verify)

[[devices]]                 # the plain red LED. NOT the Pico's GP25: firmware that assumes
name = "led"                # the Pico's pin drives nothing here, which is exactly what this
kind = "gpio-out"           # board file exists to state.
pin = "GP13"
active = "high"
source = "CircuitPython pins.c for this board: LED = D13 = GPIO13"

[[devices]]                 # the on-board addressable RGB LED. ONE pin carries a timed serial
name = "neopixel"           # protocol rather than a level, so a driver -- not this row -- owns
kind = "gpio-out"           # the waveform; the board fact is only which pin reaches it.
pin = "GP17"
active = "high"
source = "CircuitPython pins.c for this board: NEOPIXEL = GPIO17"

[[devices]]                 # the user button, which is ALSO the bootrom's BOOT select. Held low
name = "button"             # when pressed (the RP2040 samples it during boot), so active low.
kind = "gpio-in"
pin = "GP7"
active = "low"
source = "CircuitPython pins.c for this board: BUTTON = BOOT = D7 = GPIO7"

[[devices]]                 # the microSD slot's card-detect line -- a level, so it is a board
name = "sd-card-detect"     # device row even though the card's DATA path is an SPI binding this
kind = "gpio-in"            # family cannot yet derive.
pin = "GP16"
active = "low"
source = "CircuitPython pins.c for this board: SD_CARD_DETECT = GPIO16"

# --- the expansion socket -----------------------------------------------------------------------
#
# THE SOCKET IS STATED AS TWO SINGLE LINES RATHER THAN AS A BUS, AND THAT IS THE HONEST FORM HERE
# RATHER THAN A WEAKER ONE. A bus a socket brings out whole is named by the binding role that
# serves it, and this board has no i2c binding to name: csp/rp2040 carries no i2c pin-map rows and
# no emission for the block, so a role written here would name nothing. What the board can support
# either way is which two pads reach the socket, and that is what these rows say. A bus row joins
# this connector when the family's i2c arm lands, and these two lines leave it -- one wire, one
# statement, in whichever form is the stronger.
#
# THE SOCKET AND THE FEATHER HEADER ARE ONE BUS, not two. GP2 and GP3 reach both, so a module on
# the socket shares an address space with anything wired to the header pins, and neither can be
# addressed without the other.

[[connectors]]
name = "qt"
standard = "stemma-qt"
source = "Adafruit product 5980 (Feather RP2040 Adalogger) lists a STEMMA QT connector; the board's own CircuitPython pin map gives SDA = GPIO2 and SCL = GPIO3, which are the two signal pads of that four-pin part and are the same two the Feather header brings out"

[[connectors.qt.pins]]
signal = "sda"
pin = "GP2"

[[connectors.qt.pins]]
signal = "scl"
pin = "GP3"
