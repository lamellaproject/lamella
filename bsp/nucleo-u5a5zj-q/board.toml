# BOARD binding: the ST NUCLEO-U5A5ZJ-Q. Chip truth lives in csp/stm32u5a5/.
#
# THE VIRTUAL COM PORT IS SELECTABLE BETWEEN TWO PERIPHERALS BY SOLDER BRIDGE, and the default is
# USART1 on PA9/PA10 rather than the LPUART. UM2861 gives the reason in its own words: USART1 is the
# interface that supports bootloader mode. The alternative is LPUART1 on PG7/PG8, reached by moving
# SB24/SB26 ON and SB25/SB27/SB32/SB34 OFF.
#
# ONE REFERENCE BOARD, TWO DIFFERENT PARTS. UM2861 covers MB1549 under two order codes --
# NUCLEO-U575ZI-Q and NUCLEO-U5A5ZJ-Q -- so the board id selects the chip row and the board SHAPE
# does not. A sibling board file for the U575 variant would point at a different family entirely.

[table]
kind = "board"
board = "nucleo-u5a5zj-q"
vendor = "st"
family = "stm32u5a5"
part = "stm32u5a5zjt6q"
product_model = 40          # lamella_wire::product_model::NUCLEO_U5A5ZJ_Q
sources = [
    "STM32U5 Nucleo-144 board user manual UM2861 (MB1549), whose introduction names the order codes NUCLEO-U575ZI-Q and NUCLEO-U5A5ZJ-Q and states that the board integrates an STLINK-V3E debugger/programmer",
    "UM2861 section 7.9 and tables 10 and 11 for the virtual COM port selection, and its LED and user-button sections for LD1, LD2, LD3 and B1",
]
notes = [
    "USER LEDS: LD1 green on PC7 by default, or PA5 if SB21 is moved OFF and SB23 ON; LD2 blue on PB7; LD3 red on PG2. All three are ON when the I/O is HIGH. The user button B1 is PC13 by default (SB58 ON, SB59 OFF) or PA0 optionally.",
    "THE RESET CLOCK DOES NOT DIVIDE EVENLY INTO 115200. MSIS runs at 4 MHz out of reset, so the divisor rounds to 35 and the line runs at about 114300 baud -- roughly -0.8%, inside tolerance for an 8-bit frame but not zero. Firmware wanting margin raises the clock and states that as its own plan.",
    "LD1's OPTIONAL POSITION IS THE HEADER'S SPI CLOCK. PA5 is ST Zio D13, and UM2861's own connector table spells that row SPI_A_SCK on SPI1. So moving LD1 to PA5 puts the user LED and SPI1's clock on one pad, mutually exclusive and unreported by the chip -- the same collision the ATSAMD10-XMINI has on PA09 and the NUCLEO-L011K4 has on PB3. This board is the one that ships OUT of the collision and lets a design opt in, which is a state a reservation record would need to be able to express.",
]

[[carriers]]
kind = "stlink-vcp"         # the on-board STLINK-V3E, per UM2861's introduction
role = "vcp"
baud = 115200
plan = "msis-4mhz"
default = true

[[bindings]]
role = "vcp"
kind = "uart"
instance = "usart1"
function = "AF7"            # DS13543 table 28; NOT the L011's AF4 -- an AF number is per product
tx = { pin = "PA9" }
rx = { pin = "PA10" }

[[plans]]
name = "msis-4mhz"
default = true
source = "msis"
msis_hz = 4000000           # RM0456: "MSIS is used as system clock source after startup from
pclk_hz = 4000000           # reset, configured at 4 MHz", with reset prescalers at 1
