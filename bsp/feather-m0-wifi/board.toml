# BOARD binding: the Adafruit Feather M0 WiFi (ATWINC1500). Board truth ONLY: the WINC wiring,
# the on-board indicator, the carrier, and the clock plan. Chip truth lives in csp/samd21/.
#
# THE SAME TWO PARTS AS THE ATSAMW25 MODULE, WIRED DIFFERENTLY. The module is a SAMD21G18A and an
# ATWINC1500 in ONE orderable package with FIXED internal wiring, so its pins are module truth
# (csp/atsamw25/module.toml). This board solders the two parts down separately and routes them its
# own way: the module reaches the WINC on SERCOM2 (function C, pads 0/1/3), this board on SERCOM4
# (function D, pads 0/2/3). Same silicon, same driver, different pins -- so a driver ports between
# them, and the pin table does not.
#
# This board has NO on-board debugger and NO bridge UART: it is programmed through its own USB
# bootloader, so the carrier is native-usb and no vcp role exists here.
#
# Every value below is transcribed from the official documents cited under [table]; this
# board's own wiring has not been exercised. The pin facts the ATSAMW25 module shares hold
# THERE, on different pins -- which proves the part, not this wiring.

[table]
kind = "board"
board = "feather-m0-wifi"
family = "samd21"
part = "atsamd21g18a"
board_model = 17            # lamella_wire::board_model::FEATHER_M0_WIFI
sources = [
    "Adafruit Feather M0 WiFi with ATWINC1500 guide (product 3010): 'WiFi.setPins(8,7,4,2)' is required with every WiFi101 sketch; '#13 - GPIO #13 and is connected to the red LED next to the USB jack'; 'MOSI / MISO / SCK - the SPI pins are also used for WiFi module communication'",
    "arduino-libraries/WiFi101 src/WiFi101.h: the signature is setPins(cs, irq, rst, en), which is what fixes 8/7/4/2 to CS/IRQ/RST/EN rather than any other order",
    "Adafruit ArduinoCore-samd variants/feather_m0/variant.cpp pin descriptor table (the feather_m0 variant, NOT feather_m0_express): Arduino D8 = PORTA 6, D7 = PORTA 21, D4 = PORTA 8, D2 = PORTA 14, D13 = PORTA 17, and MISO/MOSI/SCK = PORTA 12 / PORTB 10 / PORTB 11, each marked PIO_SERCOM_ALT and commented SERCOM4/PAD[0], PAD[2], PAD[3]",
    "Adafruit ArduinoCore-samd variants/feather_m0/variant.h: PERIPH_SPI = sercom4, PAD_SPI_TX = SPI_PAD_2_SCK_3, PAD_SPI_RX = SERCOM_RX_PAD_0 -- an independent statement of the same SERCOM and pads",
    "SAMD21 datasheet DS40001882D Table 7-1 as printed on page 29: PA12's function-D cell is SERCOM4/PAD[0]; every pin named here is present on the 48-pin SAMD21G package",
    "Atmel WINC1500 BSP nm_bsp_samd21.c (nm_bsp_reset): 'setting CHIP_EN and RESET_N signals low, CHIP_EN high then RESET_N high' -- which is what fixes RESET_N active-low and CHIP_EN active-high",
]

[[carriers]]
kind = "native-usb"         # the chip's own USB device controller; no on-board bridge exists,
plan = "osc8m-8mhz"         # so there is no fixed bridge identity to state.
default = true

[[bindings]]                # the WINC1500's SPI, on the header's shared SPI bus. The role name
role = "winc-spi"           # matches the ATSAMW25 module's, so ONE driver serves both wirings:
kind = "spi"                # the difference between them is entirely in these resolved values.
instance = "sercom4"
function = "D"              # SERCOM-ALT (Table 7-1 column D) -- the module uses column C.
mosi = { pin = "PB10", pad = 2 }
sck = { pin = "PB11", pad = 3 }
miso = { pin = "PA12", pad = 0 }
cs = { pin = "PA06", soft = true }

[[plans]]
name = "osc8m-8mhz"         # the reset oscillator with its prescaler cleared. The 32.768 kHz
default = true              # crystal feeds the DFLL for USB; a plan naming that source states
source = "osc8m"            # a rate only once a consumer derives a value from it.
gclk0_hz = 8000000

[[devices]]                 # the WINC's reset: held low to reset, released high to run.
name = "winc-reset_n"
kind = "gpio-out"
pin = "PA08"
active = "low"
source = "WiFi.setPins(8,7,4,2) arg 3 = Arduino D4 = PORTA 8 (variant.cpp); polarity from the WINC1500 BSP's reset sequence"

[[devices]]                 # the WINC's chip enable: driven high to bring the part up. The BSP
name = "winc-chip_en"       # drives CHIP_EN before RESET_N, so both are host outputs, not straps.
kind = "gpio-out"
pin = "PA14"
active = "high"
source = "WiFi.setPins(8,7,4,2) arg 4 = Arduino D2 = PORTA 14 (variant.cpp); polarity from the WINC1500 BSP's reset sequence"

[[devices]]                 # the WINC's interrupt line -- the ONE input among the control lines:
name = "winc-irqn"          # the module asserts it low to say a message is waiting.
kind = "gpio-in"
pin = "PA21"
active = "low"
source = "WiFi.setPins(8,7,4,2) arg 2 = Arduino D7 = PORTA 21 (variant.cpp); active-low per the signal's own name (IRQN) and the ATSAMW25 module row for the same part"

[[devices]]                 # the red LED beside the USB jack -- the only indicator visible
name = "led"                # without driving a protocol, and so the first thing to blink.
kind = "gpio-out"
pin = "PA17"
active = "high"
source = "Adafruit Feather M0 WiFi guide ('#13 - GPIO #13 and is connected to the red LED next to the USB jack') + variant.cpp (Arduino D13 = PORTA 17)"
