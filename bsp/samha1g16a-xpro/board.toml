# The SAM HA1G16A Xplained Pro (ATSAMHA1G16A-XPRO): board truth only -- what is wired to what.
# Chip truth lives in csp/samha1/.
#
# THE PART IS A SAM D21 RELATIVE AND A LIN SYSTEM BASIS CHIP IN ONE PACKAGE. On this G-series part
# the transceiver is wired to SERCOM5 at PB30 and PB23, neither of which is a package pin, so a
# board has five SERCOMs rather than six. Nothing here binds SERCOM5.
#
# THE VIRTUAL COM PORT'S TWO PADS WERE CHECKED AGAINST THE PART DATASHEET. Atmel-9426 Table 4-8
# names SERCOM1 PAD[0] on PA27 and PAD[1] on PA28 WITHOUT naming a function column, and
# DS20005841E Table 7-1 gives both pads SERCOM1 in column C with no column-D SERCOM at all -- so
# the letter is not a choice on these two pads, and the guide's omission costs nothing here.

[table]
kind = "board"
board = "samha1g16a-xpro"
vendor = "microchip"
family = "samha1"
part = "atsamha1g16a"
product_model = 50          # lamella_wire::product_model::SAMHA1G16A_XPLAINED_PRO
sources = [
    "SAM HA1G16A Xplained Pro user guide Atmel-9426 (2016) section 4.2.2 and Table 4-7 (LED Connection): one yellow LED0 on PA00, commented 'Pin shares function with EXT1', and the section states the polarity in words -- 'The LED can be activated by driving the connected I/O line to GND'.",
    "Atmel-9426 section 4.2.1 and Table 4-6 (Mechanical Buttons): two buttons, RESET on the part's reset line and a generic user-configurable SW0 on PB03. The section states the polarity in words -- 'When a button is pressed it will drive the I/O line to GND'.",
    "Atmel-9426 section 4.3.1 and its SWD Connections table: SWD clock on PA30 and SWD data on PA31.",
    "Atmel-9426 section 4.3.2 and Table 4-8 (Virtual COM Port Connections), corroborated against ATSAMHAxGXXA datasheet DS20005841E Table 7-1 for the function column -- see the header above.",
]
notes = [
    "NO 32.768 kHz CRYSTAL IS FITTED, AND THE LED SITS ON THE PAD ONE WOULD USE. DS20005841E Table 7-3 gives XOSC32K XIN32 on PA00 and XOUT32 on PA01; this guide never mentions a crystal, and it puts LED0 on PA00. So there is no conflict on this board today -- recorded because the pad is dual-purpose in the SILICON and a later board could not have both.",
    "LED0's PAD IS SHARED WITH THE EXT1 HEADER, which the guide states in its own comment column. A program driving the LED is also driving whatever an extension board presents on that line.",
    "THE GUIDE DOES NOT SAY WHETHER SW0 HAS AN EXTERNAL PULL-UP. It states the polarity and stops there, where the SAM D21 and E51 Curiosity Nano guides both state outright that no pull-up is fitted. The absence of the statement is not the presence of a resistor.",
    "THIS PART HAS NO TCC3, which DS20005841E Table 7-1's note 4 states is a G17A-only peripheral. Nothing here binds a TCC; recorded because the same pad rows in the shared family table are populated on the sibling board and empty here.",
]

[[carriers]]
kind = "edbg-vcp"           # the on-board EDBG's CDC virtual port, opened like any serial port.
usb_vid = 0x03EB            # NOTE: NO usb_pid ROW, AND ITS ABSENCE IS A SOURCED POSITION RATHER THAN
role = "vcp"                # AN OMISSION. A product id is a property of the debugger's FIRMWARE:
baud = 115200               # this kit's user guide never prints one, and the EDBG user guide
plan = "osc8m-8mhz"         # Atmel-42096 describes the composite device without giving an id
default = true              # table. Nor can a sibling supply it -- same54-xpro and samw25-xpro
                            # both answer 0x2111 while samd21-xpro answers 0x2169, so an
                            # Xplained Pro's product id does not follow from being one.

[[bindings]]
role = "vcp"
kind = "uart"
instance = "sercom1"
function = "C"              # SERCOM, not SERCOM-ALT. Neither pad carries a column-D SERCOM at all,
gclk_gen = 0                # so on these two pads the letter is not a choice between instances.
tx = { pin = "PA27", pad = 0 }
rx = { pin = "PA28", pad = 1 }

[[plans]]
name = "osc8m-8mhz"
default = true
source = "osc8m"
gclk0_hz = 8000000

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "PA00"
active = "low"
source = "Atmel-9426 section 4.2.2 and Table 4-7: one yellow LED0 on PA00. 'The LED can be activated by driving the connected I/O line to GND'. THE POLARITY IS MEASURED, AND IT AGREES WITH THE DOCUMENT -- measured rather than taken from it, because this vendor repeats the same sentence across kit guides and it does not hold for every one of them. Driven from a probe with the core halted, PA00 was held high for five seconds and low for one in a repeating cycle, sampled at both ends of every window so that exclusive control of the pad is established for the whole time it was watched rather than only at the instant of the write: the diode is lit for the one-second stretch, so it lights when the pin is LOW. The part answering on that probe reads CPUID 0x410cc601, a Cortex-M0+, with the DSU DID at 0x41002018 reading 0x1001157a -- processor 1, family 0, series 1, die 1, revision 5, device 0x7A. That is a SAM D family identifier distinct from the plain SAM D21's 0x10010300, which is what a D21 relative should look like; the device number is not resolved to an order code here because no table mapping it is held. The table's own comment column adds that the pin shares function with EXT1."

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "PB03"
active = "low"
source = "Atmel-9426 section 4.2.1 and Table 4-6: the generic user-configurable button SW0 on PB03, silkscreened SW0. 'When a button is pressed it will drive the I/O line to GND'. The guide says nothing about an external pull-up on this line, in either direction."

[debug]
signals = ["swd"]
exposure = "header"
fitted = "unknown"
pitch_mm = 1.27
onboard = "edbg"
recovery = "probe"
source = "Atmel-9426 SAM HA1G16A Xplained Pro user guide section 4.1.4: the kit has a 10-pin 50-mil Cortex Debug Connector that can be used to attach an external debugger, and its SWD Connections table gives SWD clock on PA30 and SWD data on PA31. Whether a connector is soldered to that position is not stated: the guide gives the connector a numbered section and a full pin table but never says it is mounted, and the same guide marks its crystals mounted and not mounted in the feature list, so the silence cannot be read either way. The board carries a debugger this toolchain speaks, so the recovery path after any deploy is that debugger: it reaches the part over SWD regardless of what the application image did, which is what distinguishes it from a bootloader that has to survive in flash."
