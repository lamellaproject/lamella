# BOARD binding: the BBC micro:bit v1. Board truth only: the identity, the part, the carrier,
# the I2C bus wiring, and the display's pin rows.

[table]
kind = "board"
board = "micro-bit-v1"
vendor = "micro-bit"
family = "nrf51"
part = "nrf51822"
board_model = 1             # lamella_wire::board_model::MICROBIT_V1
sources = [
    "micro:bit v1 board identity via the on-board DAPLink bridge the deploy tooling scopes by",
    "micro:bit Foundation edge connector documentation, tech.microbit.org/hardware/edgeconnector/ : pin 19 is I2C SCL and pin 20 is I2C SDA, and those pins are the bus 'used by the on-board motion sensor'",
    "microbit-dal MicroBitPin.h: MICROBIT_PIN_P19 = P0_0 and MICROBIT_PIN_P20 = P0_30, which is what maps those two edge-connector pins onto chip pins",
]

[[carriers]]
kind = "daplink-vcp"        # the on-board DAPLink bridge's VCP. The carrier states the bridge
                            # identity class and the wire rate; its fixed USB ids are stated
                            # once host tooling pins them with evidence.
baud = 115200               # the bridge's wire rate
plan = "hfclk-default"
default = true

[[plans]]
name = "hfclk-default"
default = true
source = "hfclk"            # the TWI times itself from the high-frequency clock and its rate
                            # register is ENUMERATED (K100/K250/K400) -- no divisor derives from
                            # a rate, so this plan states the operating point's NAME only. It
                            # exists because the board now declares a binding and a bound board
                            # must say which operating point its bindings run at; rates join
                            # when a consumer actually derives from them.

# THE ONE I2C BUS. On this board the motion sensor does NOT sit on a private bus: the vendor's
# edge connector documentation says pins 19 and 20 ARE the I2C, and that this is the bus "used
# by the on-board motion sensor". So the sensor and anything a user wires to the edge connector
# are residents of the same two wires -- which is why the role is named for the bus rather than
# for one of its jobs. A scan on this board sees whatever is plugged in as well as what is
# soldered down.
#
# The chip pins come from the Foundation's own runtime (microbit-dal MicroBitPin.h), which maps
# edge pin 19 to P0.00 and edge pin 20 to P0.30. Bus pull-ups are the board's; the TWI pins are
# therefore configured pull-disabled, which is what the twi block's PIN_CNF_TWI value encodes.
[[bindings]]
role = "i2c"
kind = "i2c"
instance = "twi0"
function = "twi"
scl = { pin = "P0.00" }
sda = { pin = "P0.30" }

# The display, as twelve pin-wired device rows. Row lines SOURCE current (asserted high) and
# column lines SINK it (asserted low), the same electrical convention as the v2 -- and that is
# where the resemblance ends.
#
# THIS DISPLAY IS NOT A SMALLER v2. The v2 is a plain 5x5: one pin per row, one per column, and
# pixel (r,c) is lit by asserting row r and column c. This board drives the same 25 LEDs from a
# 3x9 CHARLIEPLEXED grid, so a screen pixel does not correspond to a (row, column) pair by any
# arithmetic -- the mapping is a 27-entry table (25 LEDs plus two unused grid positions) that can
# only be transcribed. The table itself is NOT stated here: it is not a per-pin fact and the
# device schema has no shape for it, so it lives in the hand-written board class WITH this same
# citation.
#
# Source for the whole matrix, pins and map alike: the micro:bit Foundation's own runtime,
# lancaster-university/microbit-dal, inc/drivers/MicroBitMatrixMaps.h -- MICROBIT_DISPLAY_ROW1 =
# p13 and MICROBIT_DISPLAY_COL1 = p4, with the struct documenting rows and columns as contiguous
# from those starts, which is what fixes rows at P0.13-P0.15 and columns at P0.04-P0.12.

[[devices]]
name = "display-row1"
kind = "gpio-out"
pin = "P0.13"
active = "high"
source = "microbit-dal MicroBitMatrixMaps.h: MICROBIT_DISPLAY_ROW1 = p13, rows contiguous"

[[devices]]
name = "display-row2"
kind = "gpio-out"
pin = "P0.14"
active = "high"
source = "microbit-dal MicroBitMatrixMaps.h: row 2 of 3, contiguous from ROW1 = p13"

[[devices]]
name = "display-row3"
kind = "gpio-out"
pin = "P0.15"
active = "high"
source = "microbit-dal MicroBitMatrixMaps.h: row 3 of 3, contiguous from ROW1 = p13"

[[devices]]
name = "display-col1"
kind = "gpio-out"
pin = "P0.04"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: MICROBIT_DISPLAY_COL1 = p4, columns contiguous"

[[devices]]
name = "display-col2"
kind = "gpio-out"
pin = "P0.05"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 2 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col3"
kind = "gpio-out"
pin = "P0.06"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 3 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col4"
kind = "gpio-out"
pin = "P0.07"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 4 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col5"
kind = "gpio-out"
pin = "P0.08"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 5 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col6"
kind = "gpio-out"
pin = "P0.09"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 6 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col7"
kind = "gpio-out"
pin = "P0.10"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 7 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col8"
kind = "gpio-out"
pin = "P0.11"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 8 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col9"
kind = "gpio-out"
pin = "P0.12"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 9 of 9, contiguous from COL1 = p4"
