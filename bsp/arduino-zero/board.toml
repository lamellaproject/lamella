# The Arduino Zero: a plain ATSAMD21G18A board whose on-board EDBG bridges the Lamella
# Link over a virtual COM port. Its EDBG VCP is SERCOM5 on PB22/PB23, pinmux function D --
# the third distinct VCP SERCOM across the family's four boards (the case that broke the
# chip-named scheme).

[table]
kind = "board"
board = "arduino-zero"
family = "samd21"
part = "atsamd21g18a"
board_model = 12
sources = [
    "Arduino Zero schematic: EDBG VCP = SERCOM5, PB22 (PAD2) TX / PB23 (PAD3) RX, function D",
    "serve-proven: samd21-edbg-serve --features arduino-zero selects exactly this SERCOM5/PB22-PB23 path",
]

[carrier]
kind = "edbg-vcp"
usb_vid = 0x03EB
role = "vcp"
baud = 115200


role = "vcp"
kind = "uart"
instance = "sercom5"
function = "D"
gclk_gen = 0
tx = { pin = "PB22", pad = 2 }
rx = { pin = "PB23", pad = 3 }


name = "osc8m-8mhz"
default = true
source = "osc8m"
gclk0_hz = 8000000
