# The SAM W25 Xplained Pro: carries the ATSAMW25 module (csp/samw25/ -- a SAMD21G18A
# host + WINC1500, module wiring inherited from module.toml). Its EDBG VCP is SERCOM4 on
# PB10/PB11, pinmux function D: SERCOM3 transmits with nothing crossing the EDBG, and a host
# feeding the VCP wiggles PB11, not PA23.

[table]
kind = "board"
board = "samw25-xpro"
vendor = "microchip"
module = "samw25"
product_model = 6
sources = [
    "SAM W25 Xplained Pro user guide 42463A (kit identity); the VCP routing is this board's own SERCOM4/PB10/PB11 wiring, which supersedes that guide's VCP table",
]

[[carriers]]
kind = "edbg-vcp"
usb_vid = 0x03EB
usb_pid = 0x2111
role = "vcp"
baud = 115200
plan = "osc8m-8mhz"
default = true

[[bindings]]
role = "vcp"
kind = "uart"
instance = "sercom4"
function = "D"
gclk_gen = 0
tx = { pin = "PB10", pad = 2 }
rx = { pin = "PB11", pad = 3 }

[[plans]]
name = "osc8m-8mhz"
default = true
source = "osc8m"
gclk0_hz = 8000000

[[plans]]
name = "usb-48mhz"
source = "dfll48m-usb-recovery"
gclk1_hz = 48000000
