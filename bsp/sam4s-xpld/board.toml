# --- the carrier -----------------------------------------------------------------------------
#
# THE BRIDGE IS NOT THE SIBLING'S, AND NEITHER IS ITS USB IDENTITY. The Xplained Pro carries an
# EDBG answering vendor id 0x03EB; this board carries a SAM3U4C, and the board's own documentation
# settles what that SAM3U runs by naming the software a host must install for it: the J-Link
# package from Segger, with its J-Link-OB CDC driver. So the virtual port this carrier names is a
# Segger USB device. AN ATMEL VENDOR ID WOULD BE THE WRONG VENDOR HERE rather than an unverified
# guess, which is why this carrier states no vid/pid pair at all where its sibling boards state
# one. The pair a kit answers is a property of the debugger, and this board's debugger is not the
# family's.
#
# THE TWO USB RECEPTACLES BELONG TO DIFFERENT CHIPS, which is the board's most consequential fact.
# J21 is the SAM3U4's own high-speed port -- the J-Link OB and this carrier's CDC. J20 is the
# SAM4S16's own full-speed device port, its data pins PB10 and PB11, and it reaches the part with
# no bridge in between.
#
# SO THE BOARD HAS A PROGRAMMING ROUTE THAT USES NO DEBUGGER AT ALL. Jumper JP25 ties PB12 --
# the part's ERASE pin -- to VDDIO-4S. Closed at power-on it asserts ERASE, which clears GPNVM bit
# 1, and clearing GPNVM bit 1 is what maps the ROM at address 0 -- so the part boots its own 16 KB
# ROM rather than flash and answers SAM-BA over J20. The jumper is opened again before the flashing
# sequence. That ROM bootloader is reachable over UART0 as well, at 115200 8N1.
#
# AND ON THAT ROUTE THE BOARD DOES HAVE A USB IDENTITY TO STATE, BUT IT IS THE PART'S OWN AND NOT A
# DEBUGGER'S: the ROM enumerates as 0x03EB / 0x6124, an endpoint pair of one 64-byte bulk OUT and
# one 64-byte bulk IN. It appears only while the part is booting the ROM, so it is not this board's
# console carrier and is not stated as one. Its precondition is met here: the ROM allows USB only
# when it detects an external crystal at one of the frequencies it supports, and this board fits a
# 12.000 MHz crystal, which is on that list. Without such a crystal the ROM falls back to its
# internal 12 MHz RC and refuses USB, leaving only the UART.
#
# AND THE DEBUG SIGNALS REACH TEST POINTS AND NOTHING ELSE. The part's JTAG port is PB4 TDI,
# PB5 TDO, PB6 TMS (which is SWDIO), PB7 TCK (which is SWCLK), and the board brings them out as
# TP18, TP21, TP19 and TP20. There is no debug header: the four I/O expansion headers name none of
# the four, their pin tables reaching PB0-PB3, PB10, PB11 and PB13 only. The one debug-shaped
# connector on the board, J22, is drawn on the sheet titled JLINK-OB Interface inside a block
# labeled INNER JTAG (SAM3U Section) and carries only -3U signals: it programs the debugger, not
# the target.
#
# The reset button is worth one sentence because it is asymmetric: pressing it drives NRST on the
# SAM4S16 only. The bridge is not reset by it, so a wedged bridge and a wedged target are cleared
# by different actions.

[[carriers]]
kind = "sam3u-vcp"          # the on-board SAM3U4C bridge's virtual COM port.
baud = 115200
default = true              # this board states no [[plans]] row, so the carrier names no
                            # operating point.

# --- control lines ---------------------------------------------------------------------------
#
# BOTH LEDS ARE ACTIVE LOW, and the schematic is explicit about it in a way a reader should not
# have to infer: each LED's ANODE sits at VDD_MAIN_3U and its cathode returns through a 220 ohm
# resistor to the pin. The pin sinks the current, so driving it LOW lights the LED. That is the
# opposite of the arrangement where a pin drives the anode, and getting it backwards produces a
# board whose LEDs are on until a program touches them.

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "PC10"
active = "low"
source = "Schematic revision B sheet 5, USER LEDS: VDD_MAIN_3U to the anode of D9 (LED Yellow), cathode through R127 220R to PC10. The pin sinks, so LOW lights it."

[[devices]]
name = "led1"
kind = "gpio-out"
pin = "PC17"
active = "low"
source = "Schematic revision B sheet 5, USER LEDS: VDD_MAIN_3U to the anode of D10 (LED Yellow), cathode through R128 220R to PC17. The pin sinks, so LOW lights it."

# THE USER BUTTON HAS NO EXTERNAL PULL-UP AND THE SCHEMATIC SHOWS WHY: the only pull-up in that
# block is R24, 47K, and it is marked DNP -- not fitted -- and it pulls up NRST rather than this
# pin. So BP2 ties PA5 to ground when pressed and PA5 FLOATS when it is not, unless the part's own
# internal pull-up is enabled. A driver that configures this as a plain input reads noise, which
# presents as a button that is randomly already pressed rather than as a button that does not work.

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "PA5"
active = "low"
source = "Schematic revision B sheet 5, User Button: BP2 between PA5 and ground. The only pull-up drawn in that block is R24 47K marked DNP, and it is on the NRST net, not this one -- so this pin needs the part's internal pull-up."
