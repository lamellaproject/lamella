# BOARD binding: the SAM4S Xplained -- the plain Xplained, NOT the Xplained Pro that is this
# family's other board.
#
# THIS BOARD CAN BE PROGRAMMED AND CANNOT BE DEBUGGED, AND THAT SPLIT IS THE POINT OF IT. Its
# on-board debugger is a SAM3U4C running J-Link OB, whose protocol is not published, and the part's
# SWD and JTAG signals reach test points with no header for a cable to land on. So no external
# debugger reaches this silicon. What DOES reach it is the part's own boot ROM, whose monitor
# protocol is published in the datasheet, over a USB port that belongs to the part rather than to
# the bridge -- described in the carrier section below.
#
# SO IT IS AN INTERPRETER-ONLY BOARD, in the sense a hobbyist board is: a program is deployed to
# it, and a program running on it is debugged by the language runtime it is running under rather
# than by halting the core from outside. A breakpoint on this board is the interpreter's rather than
# the processor's, because nothing here reaches the processor's.
#
# THE TWO USB CONNECTORS BELONG TO DIFFERENT CHIPS, WHICH IS WHAT MAKES BOTH HALVES WORK AT ONCE:
# the part's own port carries the deploy, and the bridge's virtual COM port carries the console the
# interpreter talks over. Nothing about the console requires speaking the debugger's protocol -- a
# CDC virtual COM port is an ordinary serial port whatever else the chip presenting it does. Identity-first, like its sibling: no peripheral bindings yet, because the
# SAM4S family has no generated driver. What this file adds beyond identity is the board's control
# lines, which need no driver -- a control pin rides no alternate function.
#
# THE PART IS NOT THE SIBLING'S, AND THAT IS THE POINT OF HAVING BOTH. The Pro carries an
# ATSAM4SD32C: dual-plane, 2 MB of flash, 160 KB of SRAM. This carries an ATSAM4S16C: single
# plane, 1 MB, 128 KB. Same family, same peripheral set, different memory -- so every fact below
# is board truth and every size is part truth, and neither file states the other's.
#
# THREE DOCUMENTS AGREE ON THE FITTED PART, which is worth recording because the schematic alone
# is ambiguous. Its symbol reads AT91SAM4S16-LQFP100 and its designator MN4 reads ATSAM4S16AU;
# the datasheet's ordering table gives the 100-pin SAM4S16 as the C suffix with -AU as the LQFP100
# package code; and the board's own user documentation says outright that the board is equipped
# with a SAM4S16C in LQFP100.

[table]
kind = "board"
board = "sam4s-xpld"
vendor = "atmel"
family = "sam4s"
part = "atsam4s16c"
product_model = 24          # lamella_wire::product_model::SAM4S_XPLAINED
sources = [
