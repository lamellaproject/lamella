    "SAM4S Xplained board documentation, USB device: J21 is a micro-B receptacle on the SAM3U4's high-speed UDPHS port; J20 is a micro-B receptacle on the SAM4S16's full-speed UDP port, and the J20 connector table gives its data pins as PB10_DDM and PB11_DDP.",
