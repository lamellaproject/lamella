notes = [
    "TWO FOOTPRINTS ON THIS BOARD ARE DELIBERATELY EMPTY, and both are marked DNP on the schematic: MN7, an AT25DF321 serial flash, and the QTouch slider. They are not absent features -- they are present footprints with nothing in them, which is a different thing for anything that probes. Neither gets a row here, because a row states what the board HAS.",
