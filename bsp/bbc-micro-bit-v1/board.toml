# BOARD binding: the BBC micro:bit v1. Board truth only: the identity, the part, the carrier and
# its serial link, the clock plan, the I2C and SPI bus wiring, and the display's pin rows.

[table]
kind = "board"
board = "bbc-micro-bit-v1"
vendor = "bbc"
family = "nrf51"
part = "nrf51822"
product_model = 1           # lamella_wire::product_model::MICROBIT_V1
sources = [
    "micro:bit v1 board identity via the on-board DAPLink bridge the deploy tooling scopes by",
    "micro:bit Foundation edge connector documentation, tech.microbit.org/hardware/edgeconnector/ : pin 19 is I2C SCL and pin 20 is I2C SDA, and those pins are the bus 'used by the on-board motion sensor'",
    "microbit-dal MicroBitPin.h: MICROBIT_PIN_P19 = P0_0 and MICROBIT_PIN_P20 = P0_30, which is what maps those two edge-connector pins onto chip pins",
    "micro:bit v1.5 and v1.3B schematics, identical in these respects: sheet 5 wires the nRF51822's pins 43 and 44 (P0.24, P0.25) to nets TGT_TX and TGT_RX and puts crystal Q2 (16 MHz) across its XC1 and XC2 pins (37 and 38); sheet 2 carries TGT_TX and TGT_RX to the interface chip's pins 24 and 25",
]

[[carriers]]
kind = "daplink-vcp"        # the on-board DAPLink bridge's VCP. The carrier states the bridge
                            # identity class and the wire rate; its fixed USB ids are stated
                            # once host tooling pins them with evidence.
role = "vcp"                # the wire rides the vcp binding below
baud = 115200               # the bridge's wire rate
plan = "xtal-16mhz"
default = true

# THE CLOCK PLAN: HFCLK from the board's 16 MHz crystal oscillator, which the CLOCK block's
# HFCLKSTART task starts. After reset the part runs HFCLK from its internal RC oscillator, whose
# tolerance reaches 5%, so a startup that applies this plan starts the crystal before anything
# relies on a rate -- the serial link above all, because the UART's BAUDRATE word is only as
# accurate as HFCLK. The peripherals' rate registers are ENUMERATED (the UART's BAUDRATE, the TWI's
# and the SPI's FREQUENCY), so no divisor derives from a plan rate. `xtal_hz` is the crystal's own
# frequency: this part accepts a 16 or a 32 MHz crystal and its XTALFREQ register says which.
[[plans]]
name = "xtal-16mhz"
default = true
source = "xtal"             # HFCLKSTAT.SRC's name for the crystal oscillator
xtal_hz = 16000000          # crystal Q2 across XC1 and XC2 (schematic sheet 5)

# THE ONE I2C BUS. On this board the motion sensor does NOT sit on a private bus: the vendor's
# edge connector documentation says pins 19 and 20 ARE the I2C, and that this is the bus "used
# by the on-board motion sensor". So the sensor and anything a user wires to the edge connector
# are residents of the same two wires -- which is why the role is named for the bus rather than
# for one of its jobs. A scan on this board sees whatever is plugged in as well as what is
# soldered down.
#
# THIS FILE STATES NO MOTION-SENSOR DEVICE ROW, AND THAT IS A FACT ABOUT THE FILE'S SCOPE RATHER
# THAN AN UNFINISHED SECTION. One board id covers revisions that carry DIFFERENT SENSORS at
# DIFFERENT ADDRESSES, and no row is true of all of them:
#
#   v1.3 and v1.3B   MMA8653FC accelerometer at 0x1D, MAG3110 magnetometer at 0x0E -- two chips
#   v1.5             LSM303AGR, one package answering as two residents at 0x19 and 0x1E
#
# The two sets are DISJOINT. A row saying 0x19 would be wrong for every v1.3 ever made and a row
# saying 0x1D would be wrong for every v1.5, so stating either here would be a claim this file
# cannot support -- the same objection that keeps a plugged-in module out of a board file.
#
# The vendor's own hardware pages name the parts per revision, and every address above is the
# part's own datasheet fact rather than this board's. Both pairs have been read on silicon through
# this board's bus and each answered its identity register, so what is missing here is not the
# knowledge -- it is a way for one board file to say "it depends which revision you are holding".
# Splitting this into two board files would need a second product_model, which is a wire-protocol
# constant and not this file's to mint.
#
# The chip pins come from the Foundation's own runtime (microbit-dal MicroBitPin.h), which maps
# edge pin 19 to P0.00 and edge pin 20 to P0.30. Bus pull-ups are the board's; the TWI pins are
# therefore configured pull-disabled, which is what the twi block's PIN_CNF_TWI value encodes.
[[bindings]]
role = "i2c"
kind = "i2c"
instance = "twi0"
function = "twi"
scl = { pin = "P0.00" }
sda = { pin = "P0.30" }

# THE SERIAL LINK. The part's UART reaches the board's interface chip, which bridges it to the host
# as the USB serial port the carrier above names. The part transmits on P0.24 and receives on P0.25.
[[bindings]]
role = "vcp"
kind = "uart"
instance = "uart0"
function = "uart"
tx = { pin = "P0.24" }
rx = { pin = "P0.25" }
source = "micro:bit v1.5 schematic: sheet 5 wires the nRF51822's pin 43 (P0.24) to net TGT_TX and pin 44 (P0.25) to net TGT_RX, and sheet 2 brings those nets to the interface chip's pins 24 and 25, named TGT_TX and TGT_RX; the v1.3B schematic is identical in both"

# THE EDGE CONNECTOR'S SPI. The binding rides SPI1, whose peripheral ID it shares with SPIS1 and TWI1
# but not with TWI0, so the I2C bus above stays its own. The master drives no chip select: the
# program names the GPIO that selects its device, as SpiConnectionSettings.ChipSelectLine.
[[bindings]]
role = "spi"
kind = "spi"
instance = "spi1"
function = "spi"
sck = { pin = "P0.23" }
mosi = { pin = "P0.21" }
miso = { pin = "P0.22" }
source = "micro:bit v1.5 schematic: sheet 5 wires the nRF51822's pins 42, 41 and 40 (P0.23, P0.22, P0.21) to nets SCK, MISO and MOSI, and sheet 6 brings those nets to edge connector contacts 14, 15 and 16; the v1.3B schematic is identical in both"

# The display, as twelve pin-wired device rows. Row lines SOURCE current (asserted high) and
# column lines SINK it (asserted low), the same electrical convention as the v2 -- and that is
# where the resemblance ends.
#
# THIS DISPLAY IS NOT A SMALLER v2. The v2 is a plain 5x5: one pin per row, one per column, and
# pixel (r,c) is lit by asserting row r and column c. This board drives the same 25 LEDs from a
# 3x9 CHARLIEPLEXED grid, so a screen pixel does not correspond to a (row, column) pair by any
# arithmetic -- the mapping is a 27-entry table (25 LEDs plus two unused grid positions) that can
# only be transcribed. The table itself is NOT stated here: it is not a per-pin fact and the
# device schema has no shape for it, so it lives in the hand-written board class WITH this same
# citation.
#
# Source for the whole matrix, pins and map alike: the micro:bit Foundation's own runtime,
# lancaster-university/microbit-dal, inc/drivers/MicroBitMatrixMaps.h -- MICROBIT_DISPLAY_ROW1 =
# p13 and MICROBIT_DISPLAY_COL1 = p4, with the struct documenting rows and columns as contiguous
# from those starts, which is what fixes rows at P0.13-P0.15 and columns at P0.04-P0.12.

[[devices]]
name = "display-row1"
kind = "gpio-out"
pin = "P0.13"
active = "high"
source = "microbit-dal MicroBitMatrixMaps.h: MICROBIT_DISPLAY_ROW1 = p13, rows contiguous"

[[devices]]
name = "display-row2"
kind = "gpio-out"
pin = "P0.14"
active = "high"
source = "microbit-dal MicroBitMatrixMaps.h: row 2 of 3, contiguous from ROW1 = p13"

[[devices]]
name = "display-row3"
kind = "gpio-out"
pin = "P0.15"
active = "high"
source = "microbit-dal MicroBitMatrixMaps.h: row 3 of 3, contiguous from ROW1 = p13"

[[devices]]
name = "display-col1"
kind = "gpio-out"
pin = "P0.04"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: MICROBIT_DISPLAY_COL1 = p4, columns contiguous"

[[devices]]
name = "display-col2"
kind = "gpio-out"
pin = "P0.05"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 2 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col3"
kind = "gpio-out"
pin = "P0.06"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 3 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col4"
kind = "gpio-out"
pin = "P0.07"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 4 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col5"
kind = "gpio-out"
pin = "P0.08"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 5 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col6"
kind = "gpio-out"
pin = "P0.09"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 6 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col7"
kind = "gpio-out"
pin = "P0.10"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 7 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col8"
kind = "gpio-out"
pin = "P0.11"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 8 of 9, contiguous from COL1 = p4"

[[devices]]
name = "display-col9"
kind = "gpio-out"
pin = "P0.12"
active = "low"
source = "microbit-dal MicroBitMatrixMaps.h: column 9 of 9, contiguous from COL1 = p4"

[debug]
signals = []
exposure = "unknown"
fitted = "unknown"
onboard = "cmsis-dap"
recovery = "probe"
source = "The board carries an interface processor running a CMSIS-DAP debugger, which this toolchain speaks over USB. Where the target part's SWD signals reach on the board is not established by a document held here. The board carries a debugger this toolchain speaks, so the recovery path after any deploy is that debugger: it reaches the part over SWD regardless of what the application image did, which is what distinguishes it from a bootloader that has to survive in flash."
