# BOARD binding: the Pimoroni Pico LiPo 2, an RP2350B board with a LiPo charger. Board truth ONLY:
# role bindings and the wiring. Chip truth lives in csp/rp2350/.
#
# An RP2350B board in the Pico's shape. The QFN-80 package bonds pads the RP2350A does not have, and
# this board wires them: the PSRAM chip select on GP47, the boot/user button on GP45, the battery
# sense on GP43, an SP/CE expansion connector on GP32-GP36, and the analog channels its header
# borrows.
#
# The header says 26/A0 and means two pins. On the QFN-80 the ADC reads GPIO40-47 and does not read
# GPIO26-29, so a board that keeps the Pico's 26/27/28 header positions cannot make them analog by
# naming them. This one bridges each to an ADC pad through a 1k resistor -- GP26 to GP40 (ADC0),
# GP27 to GP41 (ADC1), GP28 to GP42 (ADC2) -- so one header position lands on two MCU pins, and a
# program reads it digitally through the low number and as an analog input through the high one.
#
# The boot button is also the user button, and the schematic says so in its own title: "Combined
# USB boot & user switch". It reaches GP45 through two 3k3 resistors from the node the BOOTSEL switch
# pulls to ground, so a program polls the same button the ROM watches at reset.
#
# Every pin this board wires above GP31 is a bank-1 row, and its mask is named for that bank.
# A device row's mask is only meaningful against the register set a consumer writes, and on the
# RP2350B one SIO block serves all 48 pins through two of them -- so the boot/user button on
# GP45, the PSRAM chip select on GP47 and the three analog pads on GP40-GP42 publish
# `<NAME>_BANK = 1` and `<NAME>_BANK1_MASK` rather than `<NAME>_MASK`. A shim written for the
# ordinary case cannot read one by accident; it fails to compile instead.
#
# The two sense lines are stated in the notes and in no device row. GP24 reads half of VBUS, and
# GP43, ADC channel 3, reads a third of the battery's voltage. A device row on GP43 would reserve the
# converter channel a program reads the battery through, so it stays an ordinary converter input.
#
# Also not modeled: the SP/CE connector's five signals on GP32-GP36. It is an expansion port whose
# meaning depends on the module fitted, and the schematic names each pad two ways -- UART_TX/DC on
# GP32, UART_RX/CS on GP33, NETLIGHT/SCK on GP34, RESET/MOSI on GP35 and PWRKEY/BL on GP36 -- because
# the port carries either a serial or an SPI peripheral. Naming one of the two in a row would pick a
# module this board does not have.

[table]
kind = "board"
board = "pimoroni-pico-lipo-2"
vendor = "pimoroni"
family = "rp2350"
part = "rp2350b"
product_model = 64          # lamella_wire::product_model::PICO_LIPO_2
sources = [
    "Pimoroni Pico LiPo 2 schematic (Pimoroni_Pico_LiPo_2_Schematic.pdf, PIM775, 4 sheets): sheet 1 is the RP2350B, its nets and the SP/CE connector, sheet 2 the USB-C socket, the user LED, the VBUS sense divider, the debug and Qw/ST connectors, the PSRAM, the crystal, the flash and the combined boot/user switch, sheet 3 the 40-pin header, sheet 4 the battery sense divider, the charger and the power switch.",
    "Pimoroni Pico LiPo 2 pinout diagram (ppico_lipo_2_pinout_diagram.pdf): 51x21x10mm, RP2350B with 16MB Flash, 8MB PSRAM, USB-C, LiPo Charging & Protection, Power, Charging & User LEDs, On-Off & User/Boot Buttons, Qw/ST, SP/CE & Debug Connectors, 40 pins, USB Input: 3V-5.5V.",
    "Pimoroni Pico LiPo 2 product page (shop.pimoroni.com/products/pimoroni-pico-lipo-2): powered by RP2350B, 16MB of QSPI flash supporting XiP, 8MB of PSRAM, a 3 pin debug connector (JST-SH), a switch for basic input that doubles up as DFU select on boot; the user LED is wired to GP25, the BOOT button to GP45 and active low, VBus Sense to GP24 and VBat Sense to GP43.",
    "RP2350 datasheet Table 1 and chapter 1's two NOTEs, for what the QFN-80 package bonds and where its analog inputs are.",
    "RP2350 datasheet section 5.2.8.1 (BOOTSEL clock requirements) and section 13.10 (the BOOT_FLAGS0, BOOTSEL_PLL_CFG and BOOTSEL_XOSC_CFG rows of OTP), for what a USB boot says about the crystal.",
]
notes = [
    "The 26/27/28 header positions reach two MCU pins each, and the second one is where the ADC is. Schematic sheet 1: the net GP26 lands on GPIO26 (pin 27) and on GPIO40/ADC0 (pin 49) through RN2-1, 1k; GP27 on GPIO27 (pin 28) and GPIO41/ADC1 (pin 52) through RN2-2; GP28 on GPIO28 (pin 36) and GPIO42/ADC2 (pin 53) through RN2-3. The pinout diagram labels them 26/A0, 27/A1 and 28/A2 and annotates the bridge as 1kOhms Internal.",
    "Two sense lines reach the MCU. Schematic sheet 2, the Vbus sense voltage divisor: VBUS through R14 (5k1) to the net VBUS_SENSE and R15 (5k1) on to ground, so the net sits at half of VBUS, and sheet 1 lands it on GPIO24 (pin 25). Sheet 4, the battery sense voltage divisor: VBAT through R19 (1M5) and R20 (750k) to ground, with C20 (100nF) across R20; the divider's midpoint reaches the net VBAT_SENSE through Q2, an SSM3K35AMFV whose gate is on 3V3, and sheet 1 lands VBAT_SENSE on GPIO43/ADC3 (pin 54). So ADC channel 3 reads a third of the battery's voltage while the 3.3 V rail is up. The product page: VBus Sense is wired to GP24 and VBat Sense is wired to GP43.",
    "X1's frequency is printed on no document for this board, and the documents imply 12 MHz. Schematic sheet 2 draws X1 with its load capacitors (C24 and C35, 10pF each) and R13 (1k), and no frequency. The product page says the board's switch doubles up as DFU select on boot and that its USB-C connector is for programming, so the board boots over USB as shipped. RP2350 datasheet section 5.2.8.1: BOOTSEL mode needs a crystal across XIN and XOUT or a clock driven into XIN; the bootrom assumes a 12 MHz XOSC and derives a fixed 48 MHz for USB from it, which 'must be a precise frequency'; and a board with any other crystal that wants USB boot programs BOOTSEL_PLL_CFG and BOOTSEL_XOSC_CFG in OTP and sets BOOT_FLAGS0.ENABLE_BOOTSEL_NON_DEFAULT_PLL_XOSC_CFG (section 13.10). The figure follows from the documents and is not a measurement.",
]

# --- memory: what the board fits beside the chip. The RP2350B's own SRAM is chip truth, stated in
#     csp/rp2350/parts.toml. ---

[[memory]]                  # the RP2350 has NO internal flash (chip flash = 0, gate-pinned) --
name = "flash"              # the 16 MB QSPI chip it XIPs from is BOARD truth.
kind = "flash"
size = 0x1000000
source = "Schematic sheet 2, Flash memory: U2 is a 16MB W25Q128JVPIQ on the QSPI lines. The pinout diagram states 16MB Flash and the product page 16MB of QSPI flash supporting XiP. 16 MB = 0x1000000."

# The PSRAM shares the flash's clock and four data lines and has a select of its own, GP47 (the
# `psram-cs` row below), so it answers in the QSPI memory interface's second window: 0x11000000,
# chip select 1's, beside the flash's 0x10000000. That address is the window's cached view; the XIP
# cache sits in front of both windows, and the same bytes read uncached at 0x15000000. Nothing
# answers there at reset: the interface's window 1 must first be told the part's commands and
# timing and GP47 routed to it, and writes reach the part only once XIP_CTRL.WRITABLE_M1 is set.
[[memory]]
name = "psram"
kind = "ram"
base = 0x11000000
size = 0x800000             # 8 MB: the whole part.
controller = "qmi"
optional = true             # the board boots and runs from its flash and the chip's SRAM without it.
source = "Schematic sheet 2, PSRAM: the part 'PSRAM 8MB APS6404L-3SQR-ZR' shares QSPI_SCLK and QSPI_SD0 to QSPI_SD3 with the flash, and its CS pin is the net PSRAM_CS, held at 3V3 by R12 (100k), which sheet 1 lands on GPIO47/ADC7 (pin 58). The pinout diagram and the product page state 8MB PSRAM. The APS6404L-3SQR datasheet (APM_PSRAM_E3_QSPI v2.7), Features: 'Organization: 64Mb, 8M x 8bits', so 8 MB = 0x800000. RP2350 datasheet 4.4.1: the lower half of the XIP address space holds two 16 MB windows, one for each QMI chip select, read cached at 0x10... and uncached at 0x14...; and the XIP_CTRL register's WRITABLE_M1 bit names window 1 as 0x11000000 through 0x11ffffff, which must be made writable 'if a RAM device is attached on QSPI chip select 1'."

[memory.psram.device]
part = "APS6404L-3SQR-ZR"
source = "Schematic sheet 2 prints the part as 'PSRAM 8MB APS6404L-3SQR-ZR'. The APS6404L-3SQR datasheet (APM_PSRAM_E3_QSPI v2.7), section 5, Table 1 'Ordering Information', lists APS6404L-3SQR-ZR as the USON-8 part for Tc = -40 C to +85 C, the standard temperature range, at 84 MHz."

# --- the wires, and the peripherals the header names. The pinout diagram labels GP0 and GP1 UART 0
#     TX and RX; GP16, GP17, GP18 and GP19 SPI 0 RX, CSn, SCK and TX; and GP4 and GP5 I2C 0 SDA and
#     SCL, the pair the schematic also wires to the Qw/ST connector. Each row below takes those
#     labels, at the Pico 2's header positions, so a program written for the Pico 2 finds the same
#     bus ids here. ---

[[carriers]]
kind = "native-usb"         # the RP2350B's own USB device controller on the USB-C socket -- no
                            # bridge, and so no board-fixed bridge identity to state.
plan = "pll-150-48"
default = true

[[carriers]]
kind = "uart"               # the second wire: uart0 on GP0/GP1 through an EXTERNAL bridge (a debug
role = "uart0"              # probe's UART cable, any USB-UART dongle), at the same operating point
baud = 115200               # as the usb wire.
plan = "pll-150-48"

[[bindings]]
role = "uart0"
kind = "uart"
instance = "uart0"
function = "F2"
tx = { pin = "GP0" }
rx = { pin = "GP1" }

[[bindings]]
role = "spi0"
kind = "spi"
instance = "spi0"
function = "F1"
mosi = { pin = "GP19" }
sck = { pin = "GP18" }
miso = { pin = "GP16" }
cs = { pin = "GP17" }

[[bindings]]
role = "i2c0"
kind = "i2c"
instance = "i2c0"
function = "F3"
sda = { pin = "GP4" }
scl = { pin = "GP5" }

[[bindings]]
role = "adc"
kind = "adc"
instance = "adc"
reference_uv = 3300000
source = "Schematic sheet 1: the 3V3 rail reaches the RP2350B's ADC supply pin (labelled ADC_IOVDD, pin 59) through R3 (220R), with C9 (2.2uF) to ground -- the net ADC_VREF, which the pinout diagram brings out at the header's ADC VREF position. The part symbol's own note reads USB&ADC: 3.3V."

# --- PWM: slices 1 to 7, each on the pair of GPIOs no other line here claims ----------------------
#
# Each output of slices 0 to 7 appears on two GPIOs, GPn and GPn+16 (datasheet 12.5.2, Table 1130),
# so which one a slice drives is a board's choice. Each pair below is clear of the uart0, spi0 and
# i2c0 pins and of the board's own lines. PWM0 is not bound: both of its pairs, GP0/GP1 and
# GP16/GP17, are taken. Slices 8 to 11, on GP32 to GP47, are not bound. The chip a program passes
# to PwmChannel.Create is the slice.

[[bindings]]
role = "pwm1"
kind = "pwm"
instance = "pwm"
function = "F4"
slice = 1
a = { pin = "GP2" }
b = { pin = "GP3" }

[[bindings]]
role = "pwm2"
kind = "pwm"
instance = "pwm"
function = "F4"
slice = 2
a = { pin = "GP20" }
b = { pin = "GP21" }

[[bindings]]
role = "pwm3"
kind = "pwm"
instance = "pwm"
function = "F4"
slice = 3
a = { pin = "GP6" }
b = { pin = "GP7" }

[[bindings]]
role = "pwm4"
kind = "pwm"
instance = "pwm"
function = "F4"
slice = 4
a = { pin = "GP8" }
b = { pin = "GP9" }

[[bindings]]
role = "pwm5"
kind = "pwm"
instance = "pwm"
function = "F4"
slice = 5
a = { pin = "GP10" }
b = { pin = "GP11" }

[[bindings]]
role = "pwm6"
kind = "pwm"
instance = "pwm"
function = "F4"
slice = 6
a = { pin = "GP12" }
b = { pin = "GP13" }

[[bindings]]
role = "pwm7"
kind = "pwm"
instance = "pwm"
function = "F4"
slice = 7
a = { pin = "GP14" }
b = { pin = "GP15" }

# --- control lines -----------------------------------------------------------------------------
#
# The user LED is active high, read off the schematic rather than from the family's habit: GP25
# reaches the LED's anode through R6, 1k, and the cathode is at ground, so the pin sources the
# current and a one lights it.

[[devices]]
name = "led0"
kind = "gpio-out"
pin = "GP25"
active = "high"
source = "Schematic sheet 2, the User LED block: the net LED_GP25 passes through R6 (1k) into the anode of LED_USER, a GREEN LED whose cathode is at ground, and sheet 1 lands LED_GP25 on GPIO25 (pin 26). A one on the pin lights it. The pinout diagram labels the LED GP25, and the product page says the user LED is wired to GP25."

[[devices]]
name = "button0"
kind = "gpio-in"
pin = "GP45"
active = "low"
source = "Schematic sheet 2, the block titled 'Combined USB boot & user switch': RN1-3 (3k3) holds a node at 3V3, SW_BOOT shorts that node to ground, and the node reaches the net USER_SW through RN1-2 and RN1-1 (3k3 each), which sheet 1 lands on GPIO45/ADC5 (pin 56). So the pin rests high and reads low while the button is held. The same node reaches the flash chip select FCS through D1 and R4 (1k), which is what makes one button serve both the boot ROM and a program. The pinout diagram labels this position BOOT/USER on GP45 and marks it Active Low, and the product page says the BOOT button is wired to GP45 and active low."

[[devices]]
name = "psram-cs"
kind = "gpio-out"
pin = "GP47"
active = "low"
source = "Schematic sheet 1: the net PSRAM_CS lands on GPIO47/ADC7 (pin 58); sheet 2 carries it to the chip select of an 8MB APS6404L-3SQR-ZR, holds it at 3V3 through R12 (100k), and notes that PSRAM_CS can be GP0, GP8, GP19 or GP47, of which this board fits GP47. The level is the chip's own: the APMemory APS6404L-3SQR datasheet (APM_PSRAM_E3_QSPI v2.7), section 6, Table 2 'Signals Table', gives CE# as an input, 'Chip select, active low. When CE#=1, chip is in standby state'."

[[devices]]
name = "adc0-header-26"
kind = "gpio-in"
pin = "GP40"
twin = { pin = "GP26" }
active = "none"
source = "Schematic sheet 1: the header net GP26 reaches GPIO40/ADC0 (pin 49) through RN2-1, 1k, as well as GPIO26 (pin 27) directly. This row names the analog half of a header position that also lands on a low-numbered GPIO, so it is a sampled input rather than a logic line and asserts no level: `none` here states that, where `unknown` would say nobody had looked."

[[devices]]
name = "adc1-header-27"
kind = "gpio-in"
pin = "GP41"
twin = { pin = "GP27" }
active = "none"
source = "Schematic sheet 1: the header net GP27 reaches GPIO41/ADC1 (pin 52) through RN2-2, 1k, as well as GPIO27 (pin 28) directly. This row names the analog half of a header position that also lands on a low-numbered GPIO, so it is a sampled input rather than a logic line and asserts no level: `none` here states that, where `unknown` would say nobody had looked."

[[devices]]
name = "adc2-header-28"
kind = "gpio-in"
pin = "GP42"
twin = { pin = "GP28" }
active = "none"
source = "Schematic sheet 1: the header net GP28 reaches GPIO42/ADC2 (pin 53) through RN2-3, 1k, as well as GPIO28 (pin 36) directly. This row names the analog half of a header position that also lands on a low-numbered GPIO, so it is a sampled input rather than a logic line and asserts no level: `none` here states that, where `unknown` would say nobody had looked."

# --- the header: the forty-position Pico header, ext/standards/pico-header.toml ---------------
#
# Each of its twenty-six GPIO positions reaches the GPIO of its own number, as the pinout draws it.
# The row still states them one by one, because it is this board's half of a join: an extension
# plugged onto the header names positions, and this row is where each finds its pad. A pin brought
# out here is exposed rather than owned, so the bindings above keep theirs -- the header's GP0 and
# GP1 are uart0's transmit and receive.
#
# Positions GP26 to GP28 also reach GPIO40 to GPIO42 through 1k. Those are the converter's pads,
# and the analog device rows above state them; this row states the header's own pads.

[[connectors]]
name = "header"
standard = "pico-header"
source = "Pimoroni Pico LiPo 2 pinout diagram: the forty header positions in the Pico's order, labeled by GPIO number alone -- 0 to 22, then 26/A0, 27/A1 and 28/A2 -- each the RP2350B's GPIO of the same number; schematic sheet 3 draws the same forty pins. The pinout diagram draws the three analog positions' second connection, to GPIO40, GPIO41 and GPIO42, and labels it 1kOhms Internal. The product page: two rows of 20 pins, exposing 26 GPIO, compatible with Raspberry Pi Pico add-ons."

[[connectors.header.pins]]
signal = "gp0"
pin = "GP0"

[[connectors.header.pins]]
signal = "gp1"
pin = "GP1"

[[connectors.header.pins]]
signal = "gp2"
pin = "GP2"

[[connectors.header.pins]]
signal = "gp3"
pin = "GP3"

[[connectors.header.pins]]
signal = "gp4"
pin = "GP4"

[[connectors.header.pins]]
signal = "gp5"
pin = "GP5"

