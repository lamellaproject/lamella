pin = "GP6"

[[connectors.header.pins]]
signal = "gp7"
pin = "GP7"

[[connectors.header.pins]]
signal = "gp8"
pin = "GP8"

[[connectors.header.pins]]
signal = "gp9"
pin = "GP9"

[[connectors.header.pins]]
signal = "gp10"
pin = "GP10"

