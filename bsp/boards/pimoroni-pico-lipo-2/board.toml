# --- the clock plan. X1 is taken as a 12 MHz crystal: no document for this board prints its
#     frequency, and this file's notes give the documents' reasons for the figure. ---

[[plans]]
name = "pll-150-48"         # the operating point: clk_sys 150 MHz off
default = true              # PLL_SYS, clk_usb/clk_adc 48 MHz off PLL_USB, clk_peri left
source = "xosc"             # crystal-exact (state-and-verify: generation checks
xosc_hz = 12000000          # hz == xosc * fbdiv / (postdiv1 * postdiv2) per PLL).
clk_peri_hz = 12000000
clk_sys_hz = 150000000
clk_usb_hz = 48000000
clk_adc_hz = 48000000
pll_sys_fbdiv = 125
pll_sys_postdiv1 = 5
pll_sys_postdiv2 = 2
pll_usb_fbdiv = 100
pll_usb_postdiv1 = 5
pll_usb_postdiv2 = 5

[debug]
signals = ["swd"]
exposure = "header"
fitted = "yes"
onboard = "none"
recovery = "mask-rom"
source = "Schematic sheet 2, Debug connector: X2, a BM03B-SRSS-TB three-pin JST SH socket, carries SWCLK on pin 1, ground on pin 2 and SWDIO on pin 3, so a probe cable lands on it with no tools. The product page lists a 3 pin debug connector (JST-SH), and the pinout diagram names its three positions SWCLK, GND and SWDIO. There is no on-board debug probe. RP2350 datasheet section 4.1: the mask ROM is a physically immutable memory resource, so the recovery path is in silicon and no image written to flash can remove it."
